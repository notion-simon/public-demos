<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Match-3 Gem Game</title>
<style>
  :root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --accent: #0f3460;
    --text: #e94560;
    --light: #f0f0f0;
    --grid: #2a2a4a;
    --ring: #ffd700;
    --cursor: #00e5ff;
    --hint: #ff9800;
    --progress-fill: #4caf50;
    --progress-bg: #333;
    --gem-red: #e53935;
    --gem-blue: #1e88e5;
    --gem-green: #43a047;
    --gem-yellow: #fdd835;
    --gem-purple: #8e24aa;
    --gem-orange: #fb8c00;
    --gem-white: #e0e0e0;
    --icon-color: #f0f0f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--light); font-family: system-ui, -apple-system, sans-serif; }
  #app { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }

  /* Main Menu */
  #main-menu { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
  .gem-logo { width: 120px; height: 120px; margin-bottom: 32px; filter: drop-shadow(0 0 20px rgba(233,69,96,0.4)); }
  .btn-start { background: var(--text); color: #fff; border: none; padding: 16px 48px; font-size: 22px; font-weight: 700; border-radius: 12px; cursor: pointer; transition: transform 0.15s; }
  .btn-start:hover { transform: scale(1.05); }
  .btn-start:active { transform: scale(0.95); }
  .menu-icon { position: absolute; width: 44px; height: 44px; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 8px; transition: background 0.15s; }
  .menu-icon:hover, .menu-icon:focus { background: rgba(255,255,255,0.1); outline: 2px solid var(--cursor); }
  #menu-trophy { top: 16px; left: 16px; }
  #menu-gear { top: 16px; right: 16px; }

  /* Game Screen */
  #game-screen { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; padding: 8px; }
  #top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 480px; margin-bottom: 4px; font-size: 18px; font-weight: 700; }
  #progress-container { width: 100%; max-width: 480px; height: 12px; background: var(--progress-bg); border-radius: 6px; margin-bottom: 8px; overflow: hidden; position: relative; }
  #progress-fill { height: 100%; width: 0%; background: var(--progress-fill); border-radius: 6px; transition: width 0.3s; }
  #board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; max-width: 480px; aspect-ratio: 1; background: var(--panel); border-radius: 8px; padding: 4px; gap: 2px; position: relative; touch-action: none; user-select: none; }
  .cell { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; border-radius: 4px; background: var(--grid); }
  .gem { width: 85%; height: 85%; display: flex; align-items: center; justify-content: center; transition: transform 0.12s, opacity 0.08s; position: relative; }
  .gem svg { width: 100%; height: 100%; }
  .gem.hovered { filter: brightness(1.1); }
  .gem.selected { filter: drop-shadow(0 0 4px var(--ring)); }
  .gem.selected::after { content: ''; position: absolute; inset: -3px; border: 3px solid var(--ring); border-radius: 50%; pointer-events: none; }
  .cell.focused .gem::before { content: ''; position: absolute; inset: 2px; border: 2px solid var(--cursor); border-radius: 4px; pointer-events: none; z-index: 10; }
  .gem.hinted { animation: hintPulse 1s ease-in-out 2; }
  @keyframes hintPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  .gem.shake { animation: shake 0.18s ease-in-out; }
  @keyframes shake { 0% { transform: translateX(0); } 33% { transform: translateX(-12%); } 66% { transform: translateX(12%); } 100% { transform: translateX(0); } }
  .gem.flash { animation: flash 0.08s ease-in-out; }
  @keyframes flash { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .gem.brighten { animation: brighten 0.12s ease-in-out; }
  @keyframes brighten { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.25); } }
  .gem.clearing { opacity: 0; transform: scale(0.5); transition: opacity 0.18s, transform 0.18s; }
  .gem.falling { transition: transform 0.18s ease-in; }
  .gem.special-line-h::after, .gem.special-line-v::after { content: ''; position: absolute; background: #fff; border-radius: 2px; }
  .gem.special-line-h::after { width: 70%; height: 4px; top: 50%; left: 15%; transform: translateY(-50%); }
  .gem.special-line-v::after { width: 4px; height: 70%; left: 50%; top: 15%; transform: translateX(-50%); }
  .gem.special-burst::after { content: '✦'; position: absolute; color: #fff; font-size: 60%; text-align: center; line-height: 1; }
  .gem.special-color { filter: hue-rotate(0deg) saturate(2); animation: colorSpin 2s linear infinite; }
  @keyframes colorSpin { 0% { filter: hue-rotate(0deg) saturate(2) brightness(1.2); } 100% { filter: hue-rotate(360deg) saturate(2) brightness(1.2); } }

  #game-controls { display: flex; gap: 16px; margin-top: 8px; }
  .ctrl-icon { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 8px; transition: background 0.15s; }
  .ctrl-icon:hover, .ctrl-icon:focus { background: rgba(255,255,255,0.1); outline: 2px solid var(--cursor); }

  /* Overlays */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
  .overlay.active { display: flex; }
  .overlay-title { font-size: 32px; font-weight: 800; margin-bottom: 16px; }
  .overlay-score { font-size: 24px; margin-bottom: 8px; }
  .overlay-best { font-size: 18px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .overlay-btn { background: var(--text); color: #fff; border: none; padding: 12px 32px; font-size: 18px; font-weight: 700; border-radius: 10px; cursor: pointer; margin: 6px; transition: transform 0.15s; }
  .overlay-btn:hover { transform: scale(1.05); }
  .overlay-icons { display: flex; gap: 16px; margin-top: 16px; }

  /* Settings / Best Score */
  .screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; position: fixed; inset: 0; background: var(--bg); z-index: 90; }
  .screen.active { display: flex; }
  .screen-title { font-size: 28px; font-weight: 700; margin-bottom: 24px; }
  .settings-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
  .setting-item { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; padding: 12px; border-radius: 12px; transition: background 0.15s; }
  .setting-item:hover, .setting-item:focus { background: rgba(255,255,255,0.05); outline: 2px solid var(--cursor); }
  .setting-icon { width: 48px; height: 48px; }
  .setting-label { font-size: 12px; color: #aaa; }
  .setting-value { font-size: 14px; font-weight: 600; }
  .confirm-row { display: flex; gap: 24px; margin-top: 16px; }

  /* Score popup */
  .score-popup { position: absolute; font-size: 18px; font-weight: 800; color: #fff; text-shadow: 0 0 4px #000; pointer-events: none; z-index: 50; animation: popupFade 0.7s ease-out forwards; }
  @keyframes popupFade { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-30px) scale(1.2); } }
  .cascade-multiplier { position: absolute; top: -40px; left: 50%; transform: translateX(-50%); font-size: 28px; font-weight: 800; color: #ffeb3b; text-shadow: 0 0 6px #000; z-index: 60; pointer-events: none; animation: multFade 0.5s ease-out forwards; }
  @keyframes multFade { 0% { opacity: 1; transform: translateX(-50%) scale(1); } 100% { opacity: 0; transform: translateX(-50%) scale(1.3); } }

  /* High contrast */
  body.high-contrast .gem svg { stroke: #fff; stroke-width: 3px; }
  body.high-contrast #board { gap: 2px; border: 2px solid var(--light); }
  body.high-contrast .cell { border: 2px solid var(--light); }

  /* Responsive */
  @media (max-width: 599px) {
    #board { max-width: calc(100vw - 32px); }
    #top-bar, #progress-container { max-width: calc(100vw - 32px); }
  }
  @media (max-width: 359px) {
    #board { max-width: calc(100vw - 16px); }
    #top-bar, #progress-container { max-width: calc(100vw - 16px); }
    .gem-logo { display: none; }
  }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<div id="app">
  <!-- Main Menu -->
  <div id="main-menu">
    <svg class="gem-logo" viewBox="0 0 100 100" aria-label="Gem logo">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b6b"/><stop offset="0.5" stop-color="#4ecdc4"/><stop offset="1" stop-color="#ffe66d"/></linearGradient></defs>
      <polygon points="50,5 95,50 50,95 5,50" fill="url(#lg)" stroke="#fff" stroke-width="2"/>
    </svg>
    <button class="btn-start" id="btn-start">Start Game</button>
    <div class="menu-icon" id="menu-trophy" role="button" tabindex="0" aria-label="Best score">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--icon-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
    </div>
    <div class="menu-icon" id="menu-gear" role="button" tabindex="0" aria-label="Settings">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--icon-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen">
    <div id="top-bar">
      <span id="score-display" aria-label="Score">0</span>
      <span id="level-display" aria-label="Level"><svg width="18" height="18" viewBox="0 0 24 24" fill="var(--gem-yellow)" stroke="var(--gem-yellow)" stroke-width="1"><polygon points="12,2 15,9 22,9 16,14 18,22 12,17 6,22 8,14 2,9 9,9"/></svg> <span id="level-num">1</span></span>
    </div>
    <div id="progress-container" role="progressbar" aria-label="Level progress">
      <div id="progress-fill"></div>
    </div>
    <div id="board" role="grid" aria-label="Gem board" tabindex="0">
      <!-- Cells generated by JS -->
    </div>
    <div id="game-controls">
      <div class="ctrl-icon" id="ctrl-pause" role="button" tabindex="0" aria-label="Pause">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--icon-color)"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      </div>
      <div class="ctrl-icon" id="ctrl-hint" role="button" tabindex="0" aria-label="Hint">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--icon-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.6a2 2 0 0 1-1.2 1.2L3.5 12l5.6 1.9a2 2 0 0 1 1.2 1.2L12 20.5l1.9-5.6a2 2 0 0 1 1.2-1.2L20.5 12l-5.6-1.9a2 2 0 0 1-1.2-1.2Z"/></svg>
      </div>
      <div class="ctrl-icon" id="ctrl-gear" role="button" tabindex="0" aria-label="Settings">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--icon-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </div>
    </div>
  </div>

  <!-- Pause Overlay -->
  <div id="pause-overlay" class="overlay">
    <div class="overlay-title">Paused</div>
    <div class="overlay-icons">
      <div class="ctrl-icon" id="pause-resume" role="button" tabindex="0" aria-label="Resume">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="var(--icon-color)"><polygon points="5,3 19,12 5,21"/></svg>
      </div>
      <div class="ctrl-icon" id="pause-restart" role="button" tabindex="0" aria-label="Restart">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--icon-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </div>
      <div class="ctrl-icon" id="pause-gear" role="button" tabindex="0" aria-label="Settings">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--icon-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </div>
      <div class="ctrl-icon" id="pause-menu" role="button" tabindex="0" aria-label="Main menu">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--icon-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
    </div>
  </div>

  <!-- Game Over Overlay -->
  <div id="gameover-overlay" class="overlay">
    <div class="overlay-title">Game Over</div>
    <div class="overlay-score" id="final-score">0</div>
    <div class="overlay-best">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--gem-yellow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
      <span id="final-best">0</span>
    </div>
    <div id="new-best" style="display:none; color: var(--gem-yellow); font-weight:700; margin-bottom:12px;">New Best</div>
    <button class="overlay-btn" id="btn-playagain">Play Again</button>
    <button class="overlay-btn" id="btn-gomenu">Menu</button>
  </div>

  <!-- Settings Screen -->
  <div id="settings-screen" class="screen">
    <div class="screen-title">Settings</div>
    <div class="settings-grid">
      <div class="setting-item" id="set-sound" role="button" tabindex="0" aria-label="Toggle sound">
        <div class="setting-icon" id="set-sound-icon"></div>
        <div class="setting-label">Sound</div>
        <div class="setting-value" id="set-sound-val">On</div>
      </div>
      <div class="setting-item" id="set-motion" role="button" tabindex="0" aria-label="Toggle motion">
        <div class="setting-icon" id="set-motion-icon"></div>
        <div class="setting-label">Motion</div>
        <div class="setting-value" id="set-motion-val">On</div>
      </div>
      <div class="setting-item" id="set-hints" role="button" tabindex="0" aria-label="Toggle idle hints">
        <div class="setting-icon" id="set-hints-icon"></div>
        <div class="setting-label">Idle Hints</div>
        <div class="setting-value" id="set-hints-val">On</div>
      </div>
      <div class="setting-item" id="set-contrast" role="button" tabindex="0" aria-label="Toggle high contrast">
        <div class="setting-icon" id="set-contrast-icon"></div>
        <div class="setting-label">High Contrast</div>
        <div class="setting-value" id="set-contrast-val">Off</div>
      </div>
      <div class="setting-item" id="set-reset" role="button" tabindex="0" aria-label="Reset best score">
        <div class="setting-icon" id="set-reset-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--icon-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </div>
        <div class="setting-label">Reset Best</div>
      </div>
      <div class="setting-item" id="set-home" role="button" tabindex="0" aria-label="Return">
        <div class="setting-icon" id="set-home-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--icon-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <div class="setting-label">Back</div>
      </div>
    </div>
    <div class="confirm-row" id="reset-confirm" style="display:none;">
      <div class="ctrl-icon" id="reset-yes" role="button" tabindex="0" aria-label="Confirm reset">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4caf50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="ctrl-icon" id="reset-no" role="button" tabindex="0" aria-label="Cancel reset">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f44336" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
    </div>
  </div>

  <!-- Best Score Screen -->
  <div id="best-screen" class="screen">
    <div class="screen-title">Best Score</div>
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--gem-yellow)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
    <div style="font-size:36px; font-weight:800; margin:16px 0;" id="best-score-num">0</div>
    <div class="ctrl-icon" id="best-home" role="button" tabindex="0" aria-label="Main menu">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--icon-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ================== Audio Engine ==================
  let audioCtx = null;
  let soundEnabled = true;
  let motionEnabled = true;
  let idleHintsEnabled = true;
  let highContrast = false;
  let bestScore = 0;
  let interacted = false;

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    interacted = true;
  }
  function playTone(freq, dur, type='sine', vol=0.15) {
    if (!soundEnabled || !interacted || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  }
  function sfxSelect() { playTone(800, 0.05, 'square', 0.08); }
  function sfxSwap() { playTone(600, 0.12, 'sine', 0.12); playTone(900, 0.12, 'sine', 0.08); }
  function sfxInvalid() { playTone(200, 0.15, 'sawtooth', 0.08); }
  function sfxClear() { playTone(1200, 0.2, 'sine', 0.1); }
  function sfxCascade(mult) { const f = 1200 + (mult-1)*200; playTone(f, 0.25, 'sine', 0.1); }
  function sfxSpecialCreate() { playTone(1500, 0.3, 'sine', 0.12); playTone(2000, 0.2, 'sine', 0.08); }
  function sfxSpecialActivate() { playTone(400, 0.4, 'square', 0.1); playTone(800, 0.3, 'sine', 0.1); }
  function sfxLevelUp() { playTone(600, 0.2, 'sine', 0.1); playTone(900, 0.2, 'sine', 0.1); playTone(1200, 0.3, 'sine', 0.12); }
  function sfxGameOver() { playTone(600, 0.3, 'sine', 0.1); playTone(400, 0.3, 'sine', 0.1); playTone(200, 0.5, 'sine', 0.12); }

  // ================== Storage ==================
  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem('gemGameSettings') || '{}');
      soundEnabled = s.sound !== false;
      motionEnabled = s.motion !== false;
      idleHintsEnabled = s.hints !== false;
      highContrast = s.contrast === true;
      bestScore = parseInt(localStorage.getItem('gemGameBest') || '0', 10) || 0;
    } catch(e) { bestScore = 0; }
    updateContrast();
  }
  function saveSettings() {
    localStorage.setItem('gemGameSettings', JSON.stringify({ sound: soundEnabled, motion: motionEnabled, hints: idleHintsEnabled, contrast: highContrast }));
    localStorage.setItem('gemGameBest', String(bestScore));
  }

  // ================== Gem Definitions ==================
  const GEM_TYPES = ['red','blue','green','yellow','purple','orange','white'];
  const GEM_SHAPES = {
    red: 'M50,10 L90,50 L50,90 L10,50 Z',
    blue: 'M50,15 C75,15 90,35 90,55 C90,80 70,90 50,90 C30,90 10,80 10,55 C10,35 25,15 50,15 Z',
    green: 'M50,5 L85,25 L85,65 L50,95 L15,65 L15,25 Z',
    yellow: 'M15,15 H85 V85 H15 Z',
    purple: 'M50,5 L85,35 L50,95 L15,35 Z',
    orange: 'M50,5 L90,50 L50,95 L10,50 Z',
    white: 'M50,15 C70,15 85,30 85,50 C85,70 70,85 50,85 C30,85 15,70 15,50 C15,30 30,15 50,15 Z'
  };
  const GEM_COLORS = {
    red: '#e53935', blue: '#1e88e5', green: '#43a047', yellow: '#fdd835',
    purple: '#8e24aa', orange: '#fb8c00', white: '#e0e0e0'
  };

  function gemSVG(type, special) {
    const color = GEM_COLORS[type] || GEM_COLORS.white;
    let extra = '';
    if (special === 'line-h') extra = '<rect x="15" y="46" width="70" height="8" rx="2" fill="#fff"/>';
    if (special === 'line-v') extra = '<rect x="46" y="15" width="8" height="70" rx="2" fill="#fff"/>';
    if (special === 'burst') extra = '<text x="50" y="58" text-anchor="middle" font-size="35" fill="#fff" font-family="serif">&#10022;</text>';
    if (special === 'color') {
      return '<svg viewBox="0 0 100 100"><defs><radialGradient id="cg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff"/><stop offset="50%" stop-color="#ff0"/><stop offset="100%" stop-color="#f0f"/></radialGradient></defs><circle cx="50" cy="50" r="40" fill="url(#cg)" stroke="#fff" stroke-width="2"/>'+extra+'</svg>';
    }
    const d = GEM_SHAPES[type] || GEM_SHAPES.white;
    return `<svg viewBox="0 0 100 100"><path d="${d}" fill="${color}" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>${extra}</svg>`;
  }

  // ================== Game State ==================
  let board = [];
  let score = 0;
  let level = 1;
  let progress = 0;
  let selected = null;
  let cursor = {r:0,c:0};
  let resolving = false;
  let paused = false;
  let gameover = false;
  let cascadeMultiplier = 1;
  let idleTimer = 0;
  let hintTimer = null;
  let animFrame = null;
  let cells = [];
  let touchStart = null;
  let boardEl = document.getElementById('board');
  let selectedGemBeforeSwap = null; // track for invalid swap

  function getGemTypesForLevel(lvl) {
    if (lvl <= 2) return GEM_TYPES.slice(0,5);
    if (lvl <= 5) return GEM_TYPES.slice(0,6);
    return GEM_TYPES.slice(0,7);
  }

  function randomGem(lvl) {
    const types = getGemTypesForLevel(lvl);
    return { type: types[Math.floor(Math.random()*types.length)], special: null };
  }

  function createBoard() {
    let b;
    do {
      b = [];
      for (let r=0;r<8;r++) {
        const row=[];
        for (let c=0;c<8;c++) {
          let g;
          do { g = randomGem(level); } while (
            (c>=2 && row[c-1].type===g.type && row[c-2].type===g.type) ||
            (r>=2 && b[r-1][c].type===g.type && b[r-2][c].type===g.type)
          );
          row.push(g);
        }
        b.push(row);
      }
    } while (!hasLegalMoves(b) || findMatches(b).length>0);
    return b;
  }

  function findMatches(b) {
    const matches = [];
    // Horizontal
    for (let r=0;r<8;r++) {
      let c=0;
      while (c<8) {
        let len=1;
        while (c+len<8 && b[r][c+len].type===b[r][c].type && !b[r][c+len].special && !b[r][c].special) len++;
        if (len>=3) matches.push({r,c,len,dir:'h',type:b[r][c].type});
        c += len;
      }
    }
    // Vertical
    for (let c=0;c<8;c++) {
      let r=0;
      while (r<8) {
        let len=1;
        while (r+len<8 && b[r+len][c].type===b[r][c].type && !b[r+len][c].special && !b[r][c].special) len++;
        if (len>=3) matches.push({r,c,len,dir:'v',type:b[r][c].type});
        r += len;
      }
    }
    return matches;
  }

  function hasLegalMoves(b) {
    let count = 0;
    const dirs = [[0,1],[1,0],[0,-1],[-1,0]];
    for (let r=0;r<8;r++) {
      for (let c=0;c<8;c++) {
        for (const [dr,dc] of dirs) {
          const nr=r+dr, nc=c+dc;
          if (nr<0||nr>=8||nc<0||nc>=8) continue;
          // Test swap
          const nb = b.map(row=>row.map(g=>Object.assign({},g)));
          const tmp = nb[r][c]; nb[r][c]=nb[nr][nc]; nb[nr][nc]=tmp;
          const hasSpecial = isSpecialSwap(nb[r][c], nb[nr][nc]);
          if (hasSpecial || findMatches(nb).length>0) {
            count++;
            if (count>=3) return true;
          }
        }
      }
    }
    return false;
  }

  function isSpecialSwap(a,b) {
    if (!a || !b) return false;
    if (!a.special && !b.special) return false;
    if (a.special==='color' || b.special==='color') return true;
    if (a.special && b.special) return true;
    return false;
  }

  // ================== Rendering ==================
  function renderBoard() {
    boardEl.innerHTML = '';
    cells = [];
    for (let r=0;r<8;r++) {
      const rowCells = [];
      for (let c=0;c<8;c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.r = r;
        cell.dataset.c = c;
        cell.setAttribute('role','gridcell');
        cell.setAttribute('aria-rowindex',r+1);
        cell.setAttribute('aria-colindex',c+1);
        if (cursor.r===r && cursor.c===c) cell.classList.add('focused');
        const gemDiv = document.createElement('div');
        gemDiv.className = 'gem';
        gemDiv.innerHTML = gemSVG(board[r][c].type, board[r][c].special);
        gemDiv.dataset.r = r; gemDiv.dataset.c = c;
        if (selected && selected.r===r && selected.c===c) gemDiv.classList.add('selected');
        cell.appendChild(gemDiv);
        boardEl.appendChild(cell);
        rowCells.push({cell, gem: gemDiv});
      }
      cells.push(rowCells);
    }
    updateAriaLabels();
  }

  function updateCell(r,c) {
    if (!cells[r] || !cells[r][c]) return;
    const gemDiv = cells[r][c].gem;
    gemDiv.innerHTML = gemSVG(board[r][c].type, board[r][c].special);
    gemDiv.classList.toggle('selected', selected && selected.r===r && selected.c===c);
    gemDiv.classList.toggle('hinted', hintActive && (hintMove && ((hintMove.r1===r&&hintMove.c1===c)||(hintMove.r2===r&&hintMove.c2===c))));
    const cell = cells[r][c].cell;
    cell.classList.toggle('focused', cursor.r===r && cursor.c===c);
  }

  function updateAllCells() {
    for (let r=0;r<8;r++) for (let c=0;c<8;c++) updateCell(r,c);
  }

  function updateUI() {
    document.getElementById('score-display').textContent = score;
    document.getElementById('level-num').textContent = level;
    const target = levelTarget(level);
    const pct = Math.min(100, Math.max(0, (progress/target)*100));
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-container').setAttribute('aria-valuenow', progress);
    document.getElementById('progress-container').setAttribute('aria-valuemax', target);
    updateAriaLabels();
  }

  function updateAriaLabels() {
    for (let r=0;r<8;r++) for (let c=0;c<8;c++) {
      const g = board[r][c];
      if (!g) continue;
      const label = `Row ${r+1}, Column ${c+1}, ${g.type} gem${g.special?' '+g.special:''}${selected&&selected.r===r&&selected.c===c?', selected':''}${cursor.r===r&&cursor.c===c?', focused':''}`;
      cells[r][c].gem.setAttribute('aria-label', label);
    }
  }

  function levelTarget(lvl) {
    return 1000 + 400*(lvl-1) + 100*(lvl-1)*(lvl-1);
  }

  // ================== Animation / Timing ==================
  function animDur(base) {
    return motionEnabled ? base : Math.max(80, base*0.5);
  }
  function wait(ms) {
    return new Promise(res => setTimeout(res, animDur(ms)));
  }

  // ================== Level Progression ==================
  function addProgress(points) {
    progress += points;
    while (true) {
      const target = levelTarget(level);
      if (progress >= target) {
        progress -= target;
        level++;
        // Flash meter
        const meter = document.getElementById('progress-container');
        meter.style.filter = 'brightness(1.5)';
        setTimeout(() => meter.style.filter = '', motionEnabled?180:80);
        sfxLevelUp();
      } else break;
    }
    updateUI();
  }

  // ================== Input Handling ==================
  let hintActive = false;
  let hintMove = null;

  function onCellClick(r,c) {
    initAudio();
    if (resolving || paused || gameover) return;
    clearHint();
    resetIdleTimer();
    sfxSelect();
    if (!selected) {
      selected = {r,c};
      selectedGemBeforeSwap = {r,c};
      updateCell(r,c);
      return;
    }
    if (selected.r===r && selected.c===c) {
      selected = null;
      selectedGemBeforeSwap = null;
      updateCell(r,c);
      return;
    }
    const dr = Math.abs(r-selected.r), dc = Math.abs(c-selected.c);
    if (dr+dc===1) {
      selectedGemBeforeSwap = {r: selected.r, c: selected.c};
      attemptSwap(selected.r, selected.c, r, c);
    } else {
      selected = {r,c};
      selectedGemBeforeSwap = {r,c};
      updateAllCells();
    }
  }

  async function attemptSwap(r1,c1,r2,c2) {
    if (resolving) return;
    resolving = true;
    const a = board[r1][c1], b = board[r2][c2];

    // Check special swap first (priority 2)
    if (isSpecialSwap(a,b)) {
      await resolveSpecialSwap(r1,c1,r2,c2);
      selected = null;
      selectedGemBeforeSwap = null;
      return;
    }

    // Test normal match (priority 3)
    const test = board.map(row=>row.map(g=>g?Object.assign({},g):null));
    const tmp = test[r1][c1]; test[r1][c1]=test[r2][c2]; test[r2][c2]=tmp;
    const matches = findMatches(test);
    if (matches.length===0) {
      // Invalid swap
      sfxInvalid();
      const gem1 = cells[r1][c1].gem;
      gem1.classList.add(motionEnabled?'shake':'flash');
      await wait(motionEnabled?180:80);
      gem1.classList.remove('shake','flash');
      // Keep selection on originally selected gem
      if (selectedGemBeforeSwap) {
        selected = {r: selectedGemBeforeSwap.r, c: selectedGemBeforeSwap.c};
      }
      resolving = false;
      updateAllCells();
      return;
    }

    // Valid normal swap
    sfxSwap();
    const g1 = cells[r1][c1].gem, g2 = cells[r2][c2].gem;
    const rect1 = g1.getBoundingClientRect(), rect2 = g2.getBoundingClientRect();
    const dx = rect2.left - rect1.left, dy = rect2.top - rect1.top;
    g1.style.transform = `translate(${dx}px,${dy}px)`;
    g2.style.transform = `translate(${-dx}px,${-dy}px)`;
    await wait(motionEnabled?120:80);
    const tmp2 = board[r1][c1]; board[r1][c1]=board[r2][c2]; board[r2][c2]=tmp2;
    g1.style.transform = ''; g2.style.transform = '';
    selected = null;
    selectedGemBeforeSwap = null;
    updateAllCells();
    await resolveMatches(matches, r2, c2);
  }

  async function resolveMatches(matches, movedR, movedC) {
    // Special creation priority: color > burst > line
    const colorMatches = matches.filter(m => m.len>=5);
    const burstMatches = matches.filter(m => isTLShape(m));
    const lineMatches = matches.filter(m => m.len===4);
    let specialGem = null;
    let priorityMatch = null;
    if (colorMatches.length>0) { priorityMatch = colorMatches[0]; }
    else if (burstMatches.length>0) { priorityMatch = burstMatches[0]; }
    else if (lineMatches.length>0) { priorityMatch = lineMatches[0]; }

    if (priorityMatch) {
      const match = priorityMatch;
      let sr, sc;
      const movedInMatch = containsCell(match, movedR, movedC);
      if (movedInMatch) {
        sr = movedR; sc = movedC;
      } else if (isTLShape(match)) {
        const inter = findIntersection(match);
        sr = inter.r; sc = inter.c;
      } else {
        const cells2 = getMatchCells(match);
        if (cells2.length % 2 === 1) {
          sr = cells2[Math.floor(cells2.length/2)].r;
          sc = cells2[Math.floor(cells2.length/2)].c;
        } else {
          let best = cells2[0], bestDist = Infinity;
          for (const cl of cells2) {
            const d = Math.abs(cl.r-movedR)+Math.abs(cl.c-movedC);
            if (d < bestDist) { bestDist=d; best=cl; }
          }
          sr = best.r; sc = best.c;
        }
      }
      if (match.len>=5) specialGem = {r:sr,c:sc,type:'color'};
      else if (isTLShape(match)) specialGem = {r:sr,c:sc,type:'burst'};
      else if (match.len===4) specialGem = {r:sr,c:sc,type: match.dir==='h'?'line-h':'line-v'};
    }

    // Determine clear set and special effects
    const clearSet = new Set();
    const specialEffectSet = new Set();
    let normalPoints = 0;
    for (const m of matches) {
      const pts = m.len===3?30 : m.len===4?60 : m.len===5?120 : m.len===6?150 : m.len===7?180 : m.len===8?210 : 120;
      normalPoints += pts;
      for (const cl of getMatchCells(m)) {
        const key = `${cl.r},${cl.c}`;
        if (specialGem && cl.r===specialGem.r && cl.c===specialGem.c) continue;
        clearSet.add(key);
        // Check for activated specials in matched gems
        const g = board[cl.r][cl.c];
        if (g.special==='line-h') {
          for (let cc=0;cc<8;cc++) { const k=`${cl.r},${cc}`; if (!clearSet.has(k)) specialEffectSet.add(k); }
        } else if (g.special==='line-v') {
          for (let rr=0;rr<8;rr++) { const k=`${rr},${cl.c}`; if (!clearSet.has(k)) specialEffectSet.add(k); }
        } else if (g.special==='burst') {
          for (let rr=Math.max(0,cl.r-1);rr<=Math.min(7,cl.r+1);rr++)
            for (let cc=Math.max(0,cl.c-1);cc<=Math.min(7,cl.c+1);cc++) {
              const k=`${rr},${cc}`; if (!clearSet.has(k)) specialEffectSet.add(k);
            }
        }
      }
    }

    // Combine special effects into clear set
    for (const k of specialEffectSet) clearSet.add(k);

    // Apply special creation (keep same type, apply special flag)
    if (specialGem) {
      const sg = board[specialGem.r][specialGem.c];
      if (specialGem.type==='color') {
        board[specialGem.r][specialGem.c] = { type: 'white', special: 'color' };
      } else {
        board[specialGem.r][specialGem.c] = { type: sg.type, special: specialGem.type };
      }
      sfxSpecialCreate();
    }

    // Score calculation
    let specialPoints = 0;
    // For each cell in specialEffectSet, determine highest effect value
    const effectValues = {};
    for (const k of specialEffectSet) {
      const [rr,cc] = k.split(',').map(Number);
      let val = 0;
      // Find which special effect hit this cell
      for (const m of matches) {
        for (const cl of getMatchCells(m)) {
          if (cl.r===rr && cl.c===cc) {
            const g = board[cl.r][cl.c];
            if (g.special==='color') val = Math.max(val,20);
            else if (g.special==='burst') val = Math.max(val,15);
            else if (g.special==='line-h'||g.special==='line-v') val = Math.max(val,10);
          }
        }
      }
      specialPoints += val;
    }
    const stepScore = (normalPoints + specialPoints) * cascadeMultiplier;
    score += stepScore;
    addProgress(stepScore);
    if (stepScore>0) showScorePopup(stepScore, clearSet);

    // Brighten then clear
    for (const k of clearSet) {
      const [rr,cc] = k.split(',').map(Number);
      if (cells[rr] && cells[rr][cc]) cells[rr][cc].gem.classList.add('brighten');
    }
    await wait(120);
    for (const k of clearSet) {
      const [rr,cc] = k.split(',').map(Number);
      if (cells[rr] && cells[rr][cc]) {
        cells[rr][cc].gem.classList.remove('brighten');
        cells[rr][cc].gem.classList.add('clearing');
      }
    }
    await wait(180);
    for (const k of clearSet) {
      const [rr,cc] = k.split(',').map(Number);
      board[rr][cc] = null;
    }
    updateAllCells();

    await fallAndSpawn();
    await checkCascades();
  }

  async function fallAndSpawn() {
    // Calculate falls
    const falls = [];
    for (let c=0;c<8;c++) {
      let emptyCount = 0;
      for (let r=7;r>=0;r--) {
        if (!board[r][c]) {
          emptyCount++;
        } else if (emptyCount>0) {
          falls.push({fromR:r, toR:r+emptyCount, c, gem:board[r][c]});
          board[r][c] = null;
        }
      }
      for (let i=0;i<emptyCount;i++) {
        const g = randomGem(level);
        falls.push({fromR:-1-i, toR:i, c, gem:g, spawn:true});
      }
    }
    // Apply falls to board
    for (const f of falls) {
      if (!f.spawn) board[f.toR][f.c] = f.gem;
    }
    // Sort by toR descending so we fill bottom first
    falls.sort((a,b)=>b.toR-a.toR);
    for (const f of falls) {
      if (f.spawn) board[f.toR][f.c] = f.gem;
    }
    updateAllCells();
    // Fall duration: 180ms for one row + 40ms per additional row when motion on, 80ms when off
    const maxDist = falls.reduce((max,f)=>Math.max(max, f.spawn ? (f.toR - f.fromR) : (f.toR - f.fromR)), 0);
    const dur = motionEnabled ? (180 + Math.max(0, maxDist-1)*40) : 80;
    await new Promise(res => setTimeout(res, dur));
  }

  async function checkCascades() {
    const matches = findMatches(board);
    if (matches.length>0) {
      cascadeMultiplier++;
      showCascadeMultiplier(cascadeMultiplier);
      sfxCascade(cascadeMultiplier);
      await resolveMatches(matches, -1, -1);
    } else {
      cascadeMultiplier = 1;
      resolving = false;
      checkGameOver();
    }
  }

  function showScorePopup(n, clearSet) {
    // Center of cleared cells
    let minR=8, maxR=-1, minC=8, maxC=-1;
    for (const k of clearSet) {
      const [rr,cc] = k.split(',').map(Number);
      minR = Math.min(minR, rr); maxR = Math.max(maxR, rr);
      minC = Math.min(minC, cc); maxC = Math.max(maxC, cc);
    }
    const centerR = (minR+maxR)/2, centerC = (minC+maxC)/2;
    const cellEl = cells[Math.floor(centerR)] && cells[Math.floor(centerR)][Math.floor(centerC)] ? cells[Math.floor(centerR)][Math.floor(centerC)].cell : cells[3][3].cell;
    const rect = cellEl.getBoundingClientRect();
    const boardRect = boardEl.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'score-popup';
    el.textContent = '+' + n;
    el.style.left = (rect.left + rect.width/2 - 20) + 'px';
    el.style.top = (rect.top + rect.height/2 - 20) + 'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 700);
  }

  function showCascadeMultiplier(n) {
    const el = document.createElement('div');
    el.className = 'cascade-multiplier';
    el.textContent = 'x' + n;
    boardEl.appendChild(el);
    setTimeout(()=>el.remove(), 500);
  }

  // ================== Special Swaps ==================
  async function resolveSpecialSwap(r1,c1,r2,c2) {
    const a = board[r1][c1], b = board[r2][c2];
    let clearSet = new Set();
    let specialEffectValue = 0; // track for scoring

    // Line + Line
    const aIsLine = a.special==='line-h'||a.special==='line-v';
    const bIsLine = b.special==='line-h'||b.special==='line-v';
    const aIsBurst = a.special==='burst';
    const bIsBurst = b.special==='burst';
    const aIsColor = a.special==='color';
    const bIsColor = b.special==='color';

    if (aIsLine && bIsLine) {
      for (let i=0;i<8;i++) { clearSet.add(`${r2},${i}`); clearSet.add(`${i},${c2}`); }
      specialEffectValue = 10;
    } else if (aIsLine && bIsBurst) {
      for (let rr=Math.max(0,r2-1);rr<=Math.min(7,r2+1);rr++) for (let i=0;i<8;i++) clearSet.add(`${rr},${i}`);
      for (let cc=Math.max(0,c2-1);cc<=Math.min(7,c2+1);cc++) for (let i=0;i<8;i++) clearSet.add(`${i},${cc}`);
      specialEffectValue = 15;
    } else if (aIsBurst && bIsLine) {
      for (let rr=Math.max(0,r1-1);rr<=Math.min(7,r1+1);rr++) for (let i=0;i<8;i++) clearSet.add(`${rr},${i}`);
      for (let cc=Math.max(0,c1-1);cc<=Math.min(7,c1+1);cc++) for (let i=0;i<8;i++) clearSet.add(`${i},${cc}`);
      specialEffectValue = 15;
    } else if (aIsBurst && bIsBurst) {
      for (let rr=Math.max(0,r2-2);rr<=Math.min(7,r2+2);rr++)
        for (let cc=Math.max(0,c2-2);cc<=Math.min(7,c2+2);cc++) clearSet.add(`${rr},${cc}`);
      specialEffectValue = 15;
    } else if (aIsColor && !b.special) {
      for (let r=0;r<8;r++) for (let c=0;c<8;c++) if (board[r][c].type===b.type) clearSet.add(`${r},${c}`);
      specialEffectValue = 20;
    } else if (!a.special && bIsColor) {
      for (let r=0;r<8;r++) for (let c=0;c<8;c++) if (board[r][c].type===a.type) clearSet.add(`${r},${c}`);
      specialEffectValue = 20;
    } else if (aIsColor && bIsLine) {
      const dir = b.special==='line-h'?'line-h':'line-v';
      for (let r=0;r<8;r++) for (let c=0;c<8;c++) if (board[r][c].type===b.type) board[r][c].special = dir;
      for (let r=0;r<8;r++) for (let c=0;c<8;c++) if (board[r][c].type===b.type) {
        if (dir==='line-h') for (let i=0;i<8;i++) clearSet.add(`${r},${i}`);
        else for (let i=0;i<8;i++) clearSet.add(`${i},${c}`);
      }
      specialEffectValue = 20;
    } else if (aIsLine && bIsColor) {
      const dir = a.special==='line-h'?'line-h':'line-v';
      for (let r=0;r<8;r++) for (let c=0;c<8;c++) if (board[r][c].type===a.type) board[r][c].special = dir;
      for (let r=0;r<8;r++) for (let c=0;c<8;c++) if (board[r][c].type===a.type) {
        if (dir==='line-h') for (let i=0;i<8;i++) clearSet.add(`${r},${i}`);
        else for (let i=0;i<8;i++) clearSet.add(`${i},${c}`);
      }
      specialEffectValue = 20;
    } else if (aIsColor && bIsBurst) {
      for (let r=0;r<8;r++) for (let c=0;c<8;c++) if (board[r][c].type===b.type) board[r][c].special = 'burst';
      for (let r=0;r<8;r++) for (let c=0;c<8;c++) if (board[r][c].type===b.type) {
        for (let rr=Math.max(0,r-1);rr<=Math.min(7,r+1);rr++)
          for (let cc=Math.max(0,c-1);cc<=Math.min(7,c+1);cc++) clearSet.add(`${rr},${cc}`);
      }
      specialEffectValue = 20;
    } else if (aIsBurst && bIsColor) {
      for (let r=0;r<8;r++) for (let c=0;c<8;c++) if (board[r][c].type===a.type) board[r][c].special = 'burst';
      for (let r=0;r<8;r++) for (let c=0;c<8;c++) if (board[r][c].type===a.type) {
        for (let rr=Math.max(0,r-1);rr<=Math.min(7,r+1);rr++)
          for (let cc=Math.max(0,c-1);cc<=Math.min(7,c+1);cc++) clearSet.add(`${rr},${cc}`);
      }
      specialEffectValue = 20;
    } else if (aIsColor && bIsColor) {
      for (let r=0;r<8;r++) for (let c=0;c<8;c++) clearSet.add(`${r},${c}`);
      specialEffectValue = 20;
    }

    // Swap visually
    const g1 = cells[r1][c1].gem, g2 = cells[r2][c2].gem;
    const rect1 = g1.getBoundingClientRect(), rect2 = g2.getBoundingClientRect();
    const dx = rect2.left - rect1.left, dy = rect2.top - rect1.top;
    g1.style.transform = `translate(${dx}px,${dy}px)`;
    g2.style.transform = `translate(${-dx}px,${-dy}px)`;
    await wait(120);
    g1.style.transform = ''; g2.style.transform = '';
    // Actually swap in board data
    const tmp = board[r1][c1]; board[r1][c1]=board[r2][c2]; board[r2][c2]=tmp;

    // Score: special swap score = effect value per unique gem cleared
    const pts = clearSet.size * specialEffectValue * cascadeMultiplier;
    score += pts; 
    addProgress(pts);
    updateUI();
    if (pts>0) showScorePopup(pts, clearSet);
    sfxSpecialActivate();

    for (const k of clearSet) {
      const [rr,cc] = k.split(',').map(Number);
      if (cells[rr] && cells[rr][cc]) cells[rr][cc].gem.classList.add('clearing');
    }
    await wait(180);
    for (const k of clearSet) {
      const [rr,cc] = k.split(',').map(Number);
      board[rr][cc] = null;
    }
    updateAllCells();
    await fallAndSpawn();
    await checkCascades();
  }

  // ================== Match Geometry Helpers ==================
  function isTLShape(m) {
    if (m.dir==='h' && m.len>=3) {
      for (let i=0;i<m.len;i++) {
        const rr=m.r, cc=m.c+i;
        let up=0,down=0;
        while (rr-up-1>=0 && board[rr-up-1] && board[rr-up-1][cc] && board[rr-up-1][cc].type===m.type && !board[rr-up-1][cc].special) up++;
        while (rr+down+1<8 && board[rr+down+1] && board[rr+down+1][cc] && board[rr+down+1][cc].type===m.type && !board[rr+down+1][cc].special) down++;
        if (up+down>=2) return true;
      }
    }
    if (m.dir==='v' && m.len>=3) {
      for (let i=0;i<m.len;i++) {
        const rr=m.r+i, cc=m.c;
        let left=0,right=0;
        while (cc-left-1>=0 && board[rr] && board[rr][cc-left-1] && board[rr][cc-left-1].type===m.type && !board[rr][cc-left-1].special) left++;
        while (cc+right+1<8 && board[rr] && board[rr][cc+right+1] && board[rr][cc+right+1].type===m.type && !board[rr][cc+right+1].special) right++;
        if (left+right>=2) return true;
      }
    }
    return false;
  }

  function findIntersection(m) {
    if (m.dir==='h') {
      for (let i=0;i<m.len;i++) {
        const rr=m.r, cc=m.c+i;
        let up=0,down=0;
        while (rr-up-1>=0 && board[rr-up-1] && board[rr-up-1][cc] && board[rr-up-1][cc].type===m.type && !board[rr-up-1][cc].special) up++;
        while (rr+down+1<8 && board[rr+down+1] && board[rr+down+1][cc] && board[rr+down+1][cc].type===m.type && !board[rr+down+1][cc].special) down++;
        if (up+down>=2) return {r:rr,c:cc};
      }
    }
    if (m.dir==='v') {
      for (let i=0;i<m.len;i++) {
        const rr=m.r+i, cc=m.c;
        let left=0,right=0;
        while (cc-left-1>=0 && board[rr] && board[rr][cc-left-1] && board[rr][cc-left-1].type===m.type && !board[rr][cc-left-1].special) left++;
        while (cc+right+1<8 && board[rr] && board[rr][cc+right+1] && board[rr][cc+right+1].type===m.type && !board[rr][cc+right+1].special) right++;
        if (left+right>=2) return {r:rr,c:cc};
      }
    }
    return {r:m.r, c:m.c};
  }

  function containsCell(m, r, c) {
    if (m.dir==='h') return m.r===r && c>=m.c && c<m.c+m.len;
    return m.c===c && r>=m.r && r<m.r+m.len;
  }

  function getMatchCells(m) {
    const arr=[];
    if (m.dir==='h') for (let i=0;i<m.len;i++) arr.push({r:m.r,c:m.c+i});
    else for (let i=0;i<m.len;i++) arr.push({r:m.r+i,c:m.c});
    return arr;
  }

      }

    }
  }

  // ================== Hint System ==================
  function findHint() {
    const dirs = [[0,1],[1,0],[0,-1],[-1,0]];
    for (let r=0;r<8;r++) {
      for (let c=0;c<8;c++) {
        for (const [dr,dc] of dirs) {
          const nr=r+dr, nc=c+dc;
          if (nr<0||nr>=8||nc<0||nc>=8) continue;
          const test = board.map(row=>row.map(g=>g?Object.assign({},g):null));
          const tmp = test[r][c]; test[r][c]=test[nr][nc]; test[nr][nc]=tmp;
          if (isSpecialSwap(test[r][c],test[nr][nc]) || findMatches(test).length>0) {
            return {r1:r,c1:c,r2:nr,c2:nc};
          }
        }
      }
    }
    return null;
  }

  function showHint() {
    if (resolving || paused || gameover) return;
    clearHint();
    const h = findHint();
    if (!h) return;
    hintMove = h;
    hintActive = true;
    updateCell(h.r1,h.c1); updateCell(h.r2,h.c2);
    if (motionEnabled) {
      const g1 = cells[h.r1][h.c1].gem;
      const dx = (h.c2-h.c1)*12, dy = (h.r2-h.r1)*12;
      g1.style.transform = `translate(${dx}%,${dy}%)`;
    }
    hintTimer = setTimeout(clearHint, 2000);
  }

  function clearHint() {
    if (hintTimer) clearTimeout(hintTimer);
    hintTimer = null;
    if (hintActive && hintMove) {
      const g1 = cells[hintMove.r1] && cells[hintMove.r1][hintMove.c1] ? cells[hintMove.r1][hintMove.c1].gem : null;
      if (g1) g1.style.transform = '';
    }
    hintActive = false; hintMove = null;
    updateAllCells();
  }

      if (inGame && !gameover) { if (paused) closePause(); else openPause(); }
    }
    if (e.key==='h' || e.key==='H') {
      if (inGame && !paused && !gameover) { initAudio(); showHint(); }
    }
    if (e.key==='Escape') {
      if (selected) { selected=null; selectedGemBeforeSwap=null; updateAllCells(); }
      else if (paused) closePause();
    }
    if (!inGame || paused || gameover) return;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
      e.preventDefault();
      if (e.key==='ArrowUp') cursor.r = Math.max(0,cursor.r-1);
      if (e.key==='ArrowDown') cursor.r = Math.min(7,cursor.r+1);
      if (e.key==='ArrowLeft') cursor.c = Math.max(0,cursor.c-1);
      if (e.key==='ArrowRight') cursor.c = Math.min(7,cursor.c+1);
      updateAllCells();

    if (e.key==='Enter' || e.key===' ') {
      e.preventDefault();
      if (!selected) { selected = {r:cursor.r,c:cursor.c}; selectedGemBeforeSwap={r:cursor.r,c:cursor.c}; updateAllCells(); }

    if (!touchStart) return;
    const touch = e.changedTouches[0];
    const dx = touch.clientX - touchStart.x, dy = touch.clientY - touchStart.y;
    const cellSize = boardEl.getBoundingClientRect().width / 8;
    const threshold = cellSize * 0.25;
    const r = touchStart.r, c = touchStart.c;
    initAudio();
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > threshold && c < 7) { selectedGemBeforeSwap={r,c}; attemptSwap(r,c,r,c+1); touchStart=null; return; }
      if (dx < -threshold && c > 0) { selectedGemBeforeSwap={r,c}; attemptSwap(r,c,r,c-1); touchStart=null; return; }
    } else {
      if (dy > threshold && r < 7) { selectedGemBeforeSwap={r,c}; attemptSwap(r,c,r+1,c); touchStart=null; return; }
      if (dy < -threshold && r > 0) { selectedGemBeforeSwap={r,c}; attemptSwap(r,c,r-1,c); touchStart=null; return; }
    }
    onCellClick(r,c);
    touchStart = null;
  });

  // Mouse drag
  boardEl.addEventListener('mousedown', e => {
    const gem = e.target.closest('.gem');
    if (!gem) return;
    touchStart = { r: parseInt(gem.dataset.r), c: parseInt(gem.dataset.c), x: e.clientX, y: e.clientY };
  });
  boardEl.addEventListener('mouseup', e => {
    if (!touchStart) return;
    const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
    const cellSize = boardEl.getBoundingClientRect().width / 8;
    const threshold = cellSize * 0.25;
    const r = touchStart.r, c = touchStart.c;
    initAudio();
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > threshold && c < 7) { selectedGemBeforeSwap={r,c}; attemptSwap(r,c,r,c+1); touchStart=null; return; }
      if (dx < -threshold && c > 0) { selectedGemBeforeSwap={r,c}; attemptSwap(r,c,r,c-1); touchStart=null; return; }
    } else {
      if (dy > threshold && r < 7) { selectedGemBeforeSwap={r,c}; attemptSwap(r,c,r+1,c); touchStart=null; return; }
      if (dy < -threshold && r > 0) { selectedGemBeforeSwap={r,c}; attemptSwap(r,c,r-1,c); touchStart=null; return; }
    }
    onCellClick(r,c);
    touchStart = null;
  });

  // Visibility pause
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && document.getElementById('game-screen').style.display==='flex' && !paused && !gameover) {
      openPause();
    }
  });

  // Init
  loadSettings();
  showScreen('menu');
})();
</script>
