<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gem Game</title>
    <style>
        :root {
            --cell-size: 60px;
            --board-width: 480px;
            --gem-red: #e74c3c;
            --gem-blue: #3498db;
            --gem-green: #2ecc71;
            --gem-yellow: #f1c40f;
            --gem-purple: #9b59b6;
            --gem-orange: #e67e22;
            --gem-white: #ecf0f1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
        }

        .hidden { display: none !important; }

        /* Main Menu */
        #main-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .menu-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 16px 24px;
            z-index: 100;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover, .icon-btn:focus {
            background: rgba(255,255,255,0.2);
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        .icon-btn svg {
            width: 24px;
            height: 24px;
            fill: #fff;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin-bottom: 40px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        @keyframes prismatic {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .logo svg {
            width: 100%;
            height: 100%;
        }

        .start-btn {
            padding: 16px 48px;
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
        }

        .start-btn:hover, .start-btn:focus {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.6);
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        /* Game Screen */
        #game-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            min-height: 100vh;
        }

        .game-header {
            width: 100%;
            max-width: var(--board-width);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .score-display, .level-display {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
        }

        .score-display svg, .level-display svg {
            width: 24px;
            height: 24px;
        }

        .score-value, .level-value {
            font-size: 24px;
            font-weight: 700;
        }

        .progress-bar {
            width: 100%;
            max-width: var(--board-width);
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
            border-radius: 4px;
            transition: width 0.3s;
        }

        .progress-flash {
            animation: progressFlash 0.18s ease-out;
        }

        @keyframes progressFlash {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(2); }
        }

        /* Board */
        .board-container {
            position: relative;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, var(--cell-size));
            grid-template-rows: repeat(8, var(--cell-size));
            gap: 2px;
            background: rgba(0,0,0,0.3);
            padding: 4px;
            border-radius: 12px;
            touch-action: none;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .gem {
            width: 85%;
            height: 85%;
            transition: transform 0.12s ease-out, opacity 0.08s, filter 0.1s;
            position: relative;
        }

        .gem:hover {
            filter: brightness(1.1);
        }

        .gem.selected {
            transform: scale(1.05);
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
        }

        .gem.selected::after {
            content: '';
            position: absolute;
            inset: -3px;
            border: 3px solid #fff;
            border-radius: inherit;
            pointer-events: none;
        }

        .gem.swapping {
            z-index: 10;
            transition: transform 0.12s ease-out;
        }

        .gem.invalid-shake {
            animation: shake 0.18s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-7.2%); }
            75% { transform: translateX(7.2%); }
        }

        .gem.matched {
            filter: brightness(1.25);
        }

        .gem.clearing {
            opacity: 0;
            transform: scale(0.5);
        }

        .gem.falling {
            transition: transform 0.18s ease-in;
        }

        .gem.hint-pulse {
            animation: hintPulse 0.5s ease-in-out 2;
        }

        @keyframes hintPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.9); }
        }

        .gem.hint-nudge-right {
            animation: nudgeRight 0.5s ease-in-out 2;
        }

        @keyframes nudgeRight {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(12%); }
        }

        .gem.hint-nudge-down {
            animation: nudgeDown 0.5s ease-in-out 2;
        }

        @keyframes nudgeDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(12%); }
        }

        .gem.hint-nudge-left {
            animation: nudgeLeft 0.5s ease-in-out 2;
        }

        @keyframes nudgeLeft {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-12%); }
        }

        @keyframes nudgeUp {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12%); }
        }

        .gem.hint-nudge-up {
            animation: nudgeUp 0.5s ease-in-out 2;
        }

        .row-flash::before, .col-flash::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.5);
            pointer-events: none;
            animation: flashFade 0.12s ease-out forwards;
        }

        @keyframes flashFade {
            to { opacity: 0; }
        }

        .burst-glow::before {
            content: '';
            position: absolute;
            inset: -10px;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, transparent 70%);
            pointer-events: none;
            animation: burstGlow 0.12s ease-out forwards;
        }

        @keyframes burstGlow {
            to { opacity: 0; }
        }

        /* Keyboard cursor */
        .cell.keyboard-cursor::before {
            content: '';
            position: absolute;
            width: 60%;
            height: 60%;
            border: 2px solid #fff;
            pointer-events: none;
        }

        /* Game Controls */
        .game-controls {
            display: flex;
            gap: 16px;
            margin-top: 16px;
        }

        /* Overlays */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .overlay-content {
            text-align: center;
            color: #fff;
        }

        .overlay-title {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .overlay-score {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #f093fb 0%, #b381ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .overlay-subtitle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            margin-bottom: 32px;
            opacity: 0.8;
        }

        .new-best {
            color: #ffd700;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .overlay-btn {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin: 8px;
            transition: all 0.3s;
        }

        .overlay-btn:hover, .overlay-btn:focus {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        .overlay-btn.secondary {
            background: rgba(255,255,255,0.1);
        }

        /* Settings Panel */
        .settings-panel {
            background: rgba(30,30,50,0.95);
            padding: 32px;
            border-radius: 20px;
            min-width: 300px;
        }

        .settings-title {
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .setting-label {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
        }

        .setting-label svg {
            width: 24px;
            height: 24px;
        }

        .toggle-btn {
            width: 50px;
            height: 28px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            transition: background 0.3s;
        }

        .toggle-btn::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-btn.active {
            background: #667eea;
        }

        .toggle-btn.active::after {
            transform: translateX(22px);
        }

        .confirm-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 16px;
        }

        .confirm-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .confirm-btn.check {
            background: #2ecc71;
        }

        .confirm-btn.x {
            background: #e74c3c;
        }

        .confirm-btn svg {
            width: 24px;
            height: 24px;
            fill: #fff;
        }

        /* Best Score Screen */
        .best-score-content {
            text-align: center;
        }

        .best-score-value {
            font-size: 72px;
            font-weight: 700;
            color: #ffd700;
            margin: 24px 0;
        }

        .best-score-icon {
            width: 80px;
            height: 80px;
        }

        /* Score Popup */
        .score-popup {
            position: absolute;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 100;
            animation: scorePopup 0.7s ease-out forwards;
        }

        @keyframes scorePopup {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
        }

        /* Cascade Multiplier */
        .cascade-multiplier {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            font-weight: 700;
            color: #f093fb;
            text-shadow: 0 0 20px rgba(240, 147, 251, 0.8);
            animation: cascadeShow 0.5s ease-out forwards;
            z-index: 50;
        }

        @keyframes cascadeShow {
            0% { opacity: 0; transform: translateX(-50%) scale(0.5); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.2); }
            100% { opacity: 0; transform: translateX(-50%) scale(1); }
        }

        /* Responsive */
        @media (max-width: 599px) {
            :root {
                --board-width: calc(100vw - 32px);
                --cell-size: calc((var(--board-width) - 24px) / 8);
            }
            .logo { width: 100px; height: 100px; }
        }

        @media (max-width: 359px) {
            :root {
                --board-width: calc(100vw - 16px);
            }
            .logo { display: none; }
        }

        /* High Contrast */
        .high-contrast .cell .gem {
            outline-width: 3px;
            outline-style: solid;
            outline-color: currentColor;
        }

        .high-contrast .board {
            outline: 2px solid rgba(255,255,255,0.5);
        }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        .no-motion .gem.invalid-shake {
            animation: none;
        }

        .no-motion .gem.hint-pulse,
        .no-motion .gem.hint-nudge-right,
        .no-motion .gem.hint-nudge-down,
        .no-motion .gem.hint-nudge-left,
        .no-motion .gem.hint-nudge-up {
            animation: none;
        }
    </style>
</head>
<body>
    <!-- Main Menu -->
    <div id="main-menu">
        <div class="menu-header">
            <button class="icon-btn" id="menu-trophy" aria-label="Best score">

            </button>
            <button class="icon-btn" id="menu-settings" aria-label="Settings">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
            </button>
        </div>
        <div class="logo">
            <svg viewBox="0 0 100 100">
                <defs>
                    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#ff6b6b"/>
                        <stop offset="25%" style="stop-color:#feca57"/>
                        <stop offset="50%" style="stop-color:#48dbfb"/>
                        <stop offset="75%" style="stop-color:#ff9ff3"/>
                        <stop offset="100%" style="stop-color:#ff6b6b"/>
                    </linearGradient>
                </defs>
                <polygon points="50,5 95,35 80,95 20,95 5,35" fill="url(#gemGrad)" stroke="#fff" stroke-width="2"/>
                <polygon points="50,20 75,40 65,75 35,75 25,40" fill="rgba(255,255,255,0.3)"/>
            </svg>
        </div>
        <button class="start-btn" id="start-btn">Start Game</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden">
        <div class="game-header">
            <div class="score-display">
                <svg viewBox="0 0 24 24"><path d="M12 2C9.24 2 7 4.24 7 7v3H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0 0 11 19h2c0-1.65.71-3.13 1.85-4.21C15.87 14.51 17.81 12.51 18 10V9H17V7c0-2.76-2.24-5-5-5zm0 2c1.65 0 3 1.35 3 3v3H9V7c0-1.65 1.35-3 3-3zm0 10c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm-1-4h2v2h-2v-2z"/></svg>
                <span class="score-value" id="score">0</span>
            </div>
            <div class="level-display">
                <svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7L12 16.4 5.7 21l2.3-7-6-4.6h7.6z"/></svg>
                <span class="level-value" id="level">1</span>
            </div>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="board-container">
            <div class="board" id="board"></div>
            <div class="cascade-multiplier hidden" id="cascade-multiplier"></div>
        </div>
        <div class="game-controls">
            <button class="icon-btn" id="pause-btn" aria-label="Pause">
                <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button class="icon-btn" id="hint-btn" aria-label="Hint">

                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
            </button>
        </div>
    </div>

    <!-- Pause Overlay -->
    <div id="pause-overlay" class="overlay hidden">
        <div class="overlay-content">
            <div class="overlay-title">Paused</div>
            <div style="display: flex; gap: 16px; margin-top: 24px;">
                <button class="icon-btn" id="resume-btn" aria-label="Resume" style="background: rgba(102,126,234,0.8);">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="icon-btn" id="restart-btn" aria-label="Restart" style="background: rgba(102,126,234,0.8);">
                    <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>

                <button class="icon-btn" id="pause-settings-btn" aria-label="Settings" style="background: rgba(102,126,234,0.8);">

    <!-- Best Score Overlay -->
    <div id="bestscore-overlay" class="overlay hidden">
        <div class="settings-panel best-score-content">
            <svg class="best-score-icon" viewBox="0 0 24 24"><path d="M12 2C9.24 2 7 4.24 7 7v3H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0 0 11 19h2c0-1.65.71-3.13 1.85-4.21C15.87 14.51 17.81 12.51 18 10V9H17V7c0-2.76-2.24-5-5-5zm0 2c1.65 0 3 1.35 3 3v3H9V7c0-1.65 1.35-3 3-3zm0 10c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm-1-4h2v2h-2v-2z"/></svg>

            <button class="icon-btn" id="bestscore-home" aria-label="Back to menu" style="background: rgba(102,126,234,0.5); margin: 16px auto 0;">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </button>
