    </div>

    <script>
        // Game constants
        const BOARD_SIZE = 8;
        const GEM_TYPES = ['red', 'blue', 'green', 'yellow', 'purple'];
        const GEM_COLORS = {
            red: '#e74c3c',
            blue: '#3498db',
            green: '#2ecc71',
            yellow: '#f1c40f',
            purple: '#9b59b6',
            orange: '#e67e22',
            white: '#ecf0f1'
        };
        const GEM_SHAPES = {
            red: 'diamond',
            blue: 'droplet',
            green: 'hexagon',
            yellow: 'square',
            purple: 'kite',
            orange: 'sun',
            white: 'crystal'
        };

        // Special gem types
        const SPECIAL_TYPES = {
            LINE_H: 'line_h',
            LINE_V: 'line_v',
            BURST: 'burst',
            COLOR: 'color'
        };

        // Game state
        let board = [];
        let score = 0;
        let level = 1;
        let progress = 0;
        let bestScore = 0;
        let selectedGem = null;
        let cursorPos = { row: 0, col: 0 };
        let isResolving = false;
        let cascadeMultiplier = 1;
        let hintTimeout = null;
        let idleTime = 0;
        let idleInterval = null;
        let hintPair = null;
        let audioContext = null;
        let hasInteracted = false;

        // Settings
        let settings = {
            sound: true,
            motion: true,
            idleHints: true,
            highContrast: false
        };

        // Load settings and best score
        function loadSettings() {
            const saved = localStorage.getItem('bejeweled-settings');
            if (saved) {
                settings = JSON.parse(saved);
            }
            const savedBest = localStorage.getItem('bejeweled-best');
            if (savedBest) {
                bestScore = parseInt(savedBest, 10);
            }
            applySettings();
        }

        function saveSettings() {
            localStorage.setItem('bejeweled-settings', JSON.stringify(settings));
        }

        function saveBestScore() {
            localStorage.setItem('bejeweled-best', bestScore.toString());
        }

        function applySettings() {
            document.getElementById('sound-toggle').classList.toggle('active', settings.sound);
            document.getElementById('motion-toggle').classList.toggle('active', settings.motion);
            document.getElementById('idle-hints-toggle').classList.toggle('active', settings.idleHints);
            document.getElementById('high-contrast-toggle').classList.toggle('active', settings.highContrast);
            
            document.body.classList.toggle('high-contrast', settings.highContrast);
            document.body.classList.toggle('no-motion', !settings.motion);
        }

        // Audio
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!settings.sound || !hasInteracted || !audioContext) return;
            
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            const now = audioContext.currentTime;
            
            switch(type) {
                case 'select':
                    osc.frequency.value = 800;
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                    break;
                case 'swap':
                    osc.frequency.value = 400;
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;
                case 'invalid':
                    osc.type = 'square';
                    osc.frequency.value = 150;
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                    break;
                case 'clear':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                    break;
                case 'cascade':
                    const baseFreq = 600 + (cascadeMultiplier - 1) * 100;
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(baseFreq, now);
                    osc.frequency.exponentialRampToValueAtTime(baseFreq * 2, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                    break;
                case 'special':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1000, now);
                    osc.frequency.exponentialRampToValueAtTime(2000, now + 0.1);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                case 'burst':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                    break;
                case 'levelup':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.setValueAtTime(500, now + 0.1);
                    osc.frequency.setValueAtTime(600, now + 0.2);
                    osc.frequency.setValueAtTime(800, now + 0.3);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                    break;
                case 'gameover':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.setValueAtTime(300, now + 0.2);
                    osc.frequency.setValueAtTime(200, now + 0.4);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                    break;
            }
        }

        // Gem SVG generation
        function createGemSVG(type, gemType, specialType = null) {
            const color = GEM_COLORS[gemType];
            let shape = '';
            
            switch(GEM_SHAPES[gemType]) {
                case 'diamond':
                    shape = `<polygon points="25,5 45,25 25,45 5,25" fill="${color}" stroke="#fff" stroke-width="1"/>`;
                    break;
                case 'droplet':
                    shape = `<path d="M25 5 C10 25 10 40 25 45 C40 40 40 25 25 5" fill="${color}" stroke="#fff" stroke-width="1"/>`;
                    break;
                case 'hexagon':
                    shape = `<polygon points="25,5 45,15 45,35 25,45 5,35 5,15" fill="${color}" stroke="#fff" stroke-width="1"/>`;
                    break;
                case 'square':
                    shape = `<rect x="7" y="7" width="36" height="36" rx="4" fill="${color}" stroke="#fff" stroke-width="1"/>`;
                    break;
                case 'kite':
                    shape = `<polygon points="25,5 40,25 25,45 10,25" fill="${color}" stroke="#fff" stroke-width="1"/>`;
                    break;
                case 'sun':
                    shape = `<circle cx="25" cy="25" r="18" fill="${color}" stroke="#fff" stroke-width="1"/>`;
                    break;
                case 'crystal':
                    shape = `<polygon points="25,5 38,15 38,35 25,45 12,35 12,15" fill="${color}" stroke="#fff" stroke-width="1"/>`;
                    break;
            }

            let extras = '';
            if (specialType === SPECIAL_TYPES.LINE_H) {
                extras += `<rect x="10" y="22" width="30" height="6" fill="rgba(255,255,255,0.8)"/>`;
            } else if (specialType === SPECIAL_TYPES.LINE_V) {
                extras += `<rect x="22" y="10" width="6" height="30" fill="rgba(255,255,255,0.8)"/>`;
            } else if (specialType === SPECIAL_TYPES.BURST) {
                extras += `<polygon points="25,15 28,22 35,22 30,27 32,35 25,30 18,35 20,27 15,22 22,22" fill="rgba(255,255,255,0.8)"/>`;
            } else if (specialType === SPECIAL_TYPES.COLOR) {
                const gradId = `colorGrad-${Date.now()}-${Math.random()}`;
                shape = `<defs><linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ff6b6b"/>
                    <stop offset="33%" style="stop-color:#feca57"/>
                    <stop offset="66%" style="stop-color:#48dbfb"/>
                    <stop offset="100%" style="stop-color:#ff9ff3"/>
                </linearGradient></defs>
                <circle cx="25" cy="25" r="18" fill="url(#${gradId})" stroke="#fff" stroke-width="2"/>`;
            }

            return `<svg viewBox="0 0 50 50" class="gem" data-type="${type}">${shape}${extras}</svg>`;
        }

        // Level targets
        function getLevelTarget(lvl) {
            return 1000 + 400 * (lvl - 1) + 100 * Math.pow(lvl - 1, 2);
        }

        function getGemTypesForLevel(lvl) {
            if (lvl >= 6) return ['red', 'blue', 'green', 'yellow', 'purple', 'orange', 'white'];
            if (lvl >= 3) return ['red', 'blue', 'green', 'yellow', 'purple', 'orange'];
            return ['red', 'blue', 'green', 'yellow', 'purple'];
        }

        // Board generation
        function generateBoard() {
            const gemTypes = getGemTypesForLevel(level);
            let newBoard;
            let attempts = 0;
            
            do {
                newBoard = [];
                for (let row = 0; row < BOARD_SIZE; row++) {
                    newBoard[row] = [];
                    for (let col = 0; col < BOARD_SIZE; col++) {
                        let type;
                        do {
                            type = gemTypes[Math.floor(Math.random() * gemTypes.length)];
                        } while (wouldMatch(newBoard, row, col, type));
                        newBoard[row][col] = { gemType: type, specialType: null };
                    }
                }
                attempts++;
            } while ((!hasLegalMoves(newBoard) || attempts < 100) && attempts < 1000);
            
            return newBoard;
        }

        function wouldMatch(board, row, col, type) {
            // Check horizontal
            if (col >= 2) {
                if (board[row][col-1]?.gemType === type && board[row][col-2]?.gemType === type) {
                    return true;
                }
            }
            // Check vertical
            if (row >= 2) {
                if (board[row-1]?.[col]?.gemType === type && board[row-2]?.[col]?.gemType === type) {
                    return true;
                }
            }
            return false;
        }

        function hasLegalMoves(board) {
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    // Check right
                    if (col < BOARD_SIZE - 1) {
                        if (wouldCreateMatch(board, row, col, row, col + 1)) return true;
                    }
                    // Check down
                    if (row < BOARD_SIZE - 1) {
                        if (wouldCreateMatch(board, row, col, row + 1, col)) return true;
                    }
                }
            }
            return false;
        }

        function wouldCreateMatch(board, r1, c1, r2, c2) {
            // Swap
            const gem1 = board[r1][c1];
            const gem2 = board[r2][c2];
            board[r1][c1] = gem2;
            board[r2][c2] = gem1;
            
            const hasMatch = findMatches(board).length > 0;
            
            // Swap back
            board[r1][c1] = gem1;
            board[r2][c2] = gem2;
            
            return hasMatch;
        }

        // Render board
        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    
                    const gem = board[row][col];
                    if (gem) {
                        cell.innerHTML = createGemSVG(gem.gemType, gem.gemType, gem.specialType);
                        
                        // Add accessibility
                        const gemEl = cell.querySelector('.gem');
                        gemEl.setAttribute('role', 'button');
                        gemEl.setAttribute('aria-label', `${gem.gemType}${gem.specialType ? ' ' + gem.specialType : ''} at row ${row + 1} column ${col + 1}`);
                        
                        // Check if selected
                        if (selectedGem && selectedGem.row === row && selectedGem.col === col) {
                            gemEl.classList.add('selected');
                        }
                        
                        // Check keyboard cursor
                        if (cursorPos.row === row && cursorPos.col === col) {
                            cell.classList.add('keyboard-cursor');
                        }
                    }
                    
                    boardEl.appendChild(cell);
                }
            }
            
            updateProgress();
        }

        function updateProgress() {
            const target = getLevelTarget(level);
            const percent = Math.min(100, (progress / target) * 100);
            document.getElementById('progress-fill').style.width = `${percent}%`;
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
        }

        // Selection and input
        function selectGem(row, col) {
            initAudio();
            hasInteracted = true;
            clearHint();
            idleTime = 0;
            
            if (isResolving) return;
            
            const gem = board[row][col];
            if (!gem) return;
            
            playSound('select');
            
            if (selectedGem) {
                if (selectedGem.row === row && selectedGem.col === col) {
                    // Deselect
                    selectedGem = null;
                } else if (isAdjacent(selectedGem.row, selectedGem.col, row, col)) {
                    // Try swap
                    attemptSwap(selectedGem.row, selectedGem.col, row, col);
                } else {
                    // Move selection
                    selectedGem = { row, col };
                }
            } else {
                selectedGem = { row, col };
            }
            
            renderBoard();
        }

        function isAdjacent(r1, c1, r2, c2) {
            return (Math.abs(r1 - r2) === 1 && c1 === c2) || 
                   (Math.abs(c1 - c2) === 1 && r1 === r2);
        }

        function attemptSwap(r1, c1, r2, c2) {
            const gem1 = board[r1][c1];
            const gem2 = board[r2][c2];
            
            // Check for special swap
            if (isSpecialSwap(gem1, gem2)) {
                resolveSpecialSwap(r1, c1, r2, c2);
                return;
            }
            
            // Normal swap - check if it creates match
            board[r1][c1] = gem2;
            board[r2][c2] = gem1;
            
            const matches = findMatches(board);
            
            if (matches.length > 0) {
                // Valid swap
                selectedGem = null;
                cascadeMultiplier = 1;
                resolveMatches(matches, { row: r2, col: c2 });
            } else {
                // Invalid swap
                board[r1][c1] = gem1;
                board[r2][c2] = gem2;
                showInvalidSwap(r1, c1);
            }
        }

        function isSpecialSwap(gem1, gem2) {
            const s1 = gem1?.specialType;
            const s2 = gem2?.specialType;
            
            // Line + Line
            if ((s1 === SPECIAL_TYPES.LINE_H || s1 === SPECIAL_TYPES.LINE_V) &&
                (s2 === SPECIAL_TYPES.LINE_H || s2 === SPECIAL_TYPES.LINE_V)) {
                return true;
            }
            
            // Line + Burst
            if ((s1 === SPECIAL_TYPES.LINE_H || s1 === SPECIAL_TYPES.LINE_V) && s2 === SPECIAL_TYPES.BURST) {
                return true;
            }
            if ((s2 === SPECIAL_TYPES.LINE_H || s2 === SPECIAL_TYPES.LINE_V) && s1 === SPECIAL_TYPES.BURST) {
                return true;
            }
            
            // Burst + Burst
            if (s1 === SPECIAL_TYPES.BURST && s2 === SPECIAL_TYPES.BURST) {
                return true;
            }
            
            // Color swaps
            if (s1 === SPECIAL_TYPES.COLOR || s2 === SPECIAL_TYPES.COLOR) {
                return true;
            }
            
            return false;
        }

        function resolveSpecialSwap(r1, c1, r2, c2) {
            const gem1 = board[r1][c1];
            const gem2 = board[r2][c2];
            const s1 = gem1?.specialType;
            const s2 = gem2?.specialType;
            const destRow = r2;
            const destCol = c2;
            
            selectedGem = null;
            
            // Clear the swapped gems
            board[r1][c1] = null;
            board[r2][c2] = null;
            
            let clearedGems = new Set();
            let specialCreated = null;
            
            // Line + Line: clear row and column at destination
            if ((s1 === SPECIAL_TYPES.LINE_H || s1 === SPECIAL_TYPES.LINE_V) &&
                (s2 === SPECIAL_TYPES.LINE_H || s2 === SPECIAL_TYPES.LINE_V)) {
                // Clear row
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[destRow][c]) clearedGems.add(`${destRow},${c}`);
                }
                // Clear column
                for (let r = 0; r < BOARD_SIZE; r++) {
                    if (board[r][destCol]) clearedGems.add(`${r},${destCol}`);
                }
                playSound('special');
            }
            // Line + Burst
            else if ((s1 === SPECIAL_TYPES.LINE_H || s1 === SPECIAL_TYPES.LINE_V) && s2 === SPECIAL_TYPES.BURST) {
                // Clear 3 rows and 3 columns centered
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const r = destRow + dr;
                        const c = destCol + dc;
                        if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE) {
                            if (board[r][c]) clearedGems.add(`${r},${c}`);
                        }
                    }
                }
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[destRow][c]) clearedGems.add(`${destRow},${c}`);
                }
                for (let r = 0; r < BOARD_SIZE; r++) {
                    if (board[r][destCol]) clearedGems.add(`${r},${destCol}`);
                }
                playSound('burst');
            }
            else if ((s2 === SPECIAL_TYPES.LINE_H || s2 === SPECIAL_TYPES.LINE_V) && s1 === SPECIAL_TYPES.BURST) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const r = destRow + dr;
                        const c = destCol + dc;
                        if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE) {
                            if (board[r][c]) clearedGems.add(`${r},${c}`);
                        }
                    }
                }
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[destRow][c]) clearedGems.add(`${destRow},${c}`);
                }
                for (let r = 0; r < BOARD_SIZE; r++) {
                    if (board[r][destCol]) clearedGems.add(`${r},${destCol}`);
                }
                playSound('burst');
            }
            // Burst + Burst
            else if (s1 === SPECIAL_TYPES.BURST && s2 === SPECIAL_TYPES.BURST) {
                // Clear 5x5 centered
                for (let dr = -2; dr <= 2; dr++) {
                    for (let dc = -2; dc <= 2; dc++) {
                        const r = destRow + dr;
                        const c = destCol + dc;
                        if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE) {
                            if (board[r][c]) clearedGems.add(`${r},${c}`);
                        }
                    }
                }
                playSound('burst');
            }
            // Color + Normal
            else if (s1 === SPECIAL_TYPES.COLOR && s2 === SPECIAL_TYPES.COLOR) {
                // Clear all 64 cells
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (board[r][c]) clearedGems.add(`${r},${c}`);
                    }
                }
                playSound('burst');
            }
            else if (s1 === SPECIAL_TYPES.COLOR) {
                const targetType = gem2.gemType;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (board[r][c]?.gemType === targetType) {
                            clearedGems.add(`${r},${c}`);
                        }
                    }
                }
                playSound('burst');
            }
            else if (s2 === SPECIAL_TYPES.COLOR) {
                const targetType = gem1.gemType;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (board[r][c]?.gemType === targetType) {
                            clearedGems.add(`${r},${c}`);
                        }
                    }
                }
                playSound('burst');
            }
            
            // Clear gems
            clearedGems.forEach(key => {
                const [r, c] = key.split(',').map(Number);
                board[r][c] = null;
            });
            
            cascadeMultiplier = 1;
            calculateAndShowScore(clearedGems, []);
            fallAndSpawn();
        }

        function showInvalidSwap(row, col) {
            playSound('invalid');
            
            const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            const gem = cell?.querySelector('.gem');
            
            if (gem) {
                if (settings.motion) {
                    gem.classList.add('invalid-shake');
                    setTimeout(() => gem.classList.remove('invalid-shake'), 180);
                } else {
                    gem.style.opacity = '0.5';
                    setTimeout(() => gem.style.opacity = '1', 80);
                }
            }
        }

        // Match finding
        function findMatches(boardState) {
            const matches = [];
            const visited = new Set();
            
            // Horizontal matches
            for (let row = 0; row < BOARD_SIZE; row++) {
                let col = 0;
                while (col < BOARD_SIZE) {
                    const gem = boardState[row][col];
                    if (!gem || gem.specialType === SPECIAL_TYPES.COLOR) {
                        col++;
                        continue;
                    }
                    
                    let matchLength = 1;
                    while (col + matchLength < BOARD_SIZE) {
                        const nextGem = boardState[row][col + matchLength];
                        if (!nextGem || nextGem.specialType === SPECIAL_TYPES.COLOR) break;
                        if (getGemTypeForMatch(nextGem) !== getGemTypeForMatch(gem)) break;
                        matchLength++;
                    }
                    
                    if (matchLength >= 3) {
                        const match = [];
                        for (let i = 0; i < matchLength; i++) {
                            const key = `${row},${col + i}`;
                            if (!visited.has(key)) {
                                match.push({ row, col: col + i });
                                visited.add(key);
                            }
                        }
                        if (match.length >= 3) {
                            matches.push({ gems: match, type: 'line', length: matchLength });
                        }
                    }
                    col += matchLength;
                }
            }
            
            // Vertical matches
            visited.clear();
            for (let col = 0; col < BOARD_SIZE; col++) {
                let row = 0;
                while (row < BOARD_SIZE) {
                    const gem = boardState[row][col];
                    if (!gem || gem.specialType === SPECIAL_TYPES.COLOR) {
                        row++;
                        continue;
                    }
                    
                    let matchLength = 1;
                    while (row + matchLength < BOARD_SIZE) {
                        const nextGem = boardState[row + matchLength][col];
                        if (!nextGem || nextGem.specialType === SPECIAL_TYPES.COLOR) break;
                        if (getGemTypeForMatch(nextGem) !== getGemTypeForMatch(gem)) break;
                        matchLength++;
                    }
                    
                    if (matchLength >= 3) {
                        const match = [];
                        for (let i = 0; i < matchLength; i++) {
                            const key = `${row + i},${col}`;
                            match.push({ row: row + i, col });
                        }
                        matches.push({ gems: match, type: 'line', length: matchLength });
                    }
                    row += matchLength;
                }
            }
            
            return matches;
        }

        function getGemTypeForMatch(gem) {
            if (gem.specialType === SPECIAL_TYPES.COLOR) return gem.gemType;
            return gem.gemType;
        }

        // Resolve matches
        async function resolveMatches(matches, movedGemPos) {
            isResolving = true;
            
            // First, brighten matched gems
            renderBoard();
            
            const matchedCells = new Set();
            matches.forEach(m => {
                m.gems.forEach(g => matchedCells.add(`${g.row},${g.col}`));
            });
            
            // Add visual feedback
            matchedCells.forEach(key => {
                const [r, c] = key.split(',').map(Number);
                const cell = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
                const gem = cell?.querySelector('.gem');
                if (gem) gem.classList.add('matched');
            });
            
            await delay(settings.motion ? 120 : 80);
            
            // Check for special creation
            let specialType = null;
            let specialPos = null;
            let specialGemType = null;
            
            // Determine highest priority special
            const longestMatch = matches.reduce((max, m) => m.length > max.length ? m : max, matches[0]);
            
            // Check for T/L shapes
            const allMatchedCells = new Set();
            matches.forEach(m => m.gems.forEach(g => allMatchedCells.add(`${g.row},${g.col}`)));
            
            // Simple T/L detection
            let isTOrL = false;
            if (matches.length >= 2) {
                const allGems = [];
                matches.forEach(m => allGems.push(...m.gems));
                
                // Check for intersection
                const rowCounts = {};
                const colCounts = {};
                allGems.forEach(g => {
                    rowCounts[g.row] = (rowCounts[g.row] || 0) + 1;
                    colCounts[g.col] = (colCounts[g.col] || 0) + 1;
                });
                
                for (const g of allGems) {
                    if ((rowCounts[g.row] || 0) >= 2 && (colCounts[g.col] || 0) >= 2) {
                        isTOrL = true;
                        specialPos = { row: g.row, col: g.col };
                        break;
                    }
                }
            }
            
            // Determine special to create
            if (isTOrL && longestMatch.length === 4) {
                // Burst from T/L
                specialType = SPECIAL_TYPES.BURST;
                specialGemType = board[movedGemPos.row]?.[movedGemPos.col]?.gemType || board[longestMatch.gems[0].row]?.[longestMatch.gems[0].col]?.gemType;
            } else if (longestMatch.length >= 5) {
                // Color gem
                specialType = SPECIAL_TYPES.COLOR;
                specialGemType = board[movedGemPos.row]?.[movedGemPos.col]?.gemType || board[longestMatch.gems[0].row]?.[longestMatch.gems[0].col]?.gemType;
            } else if (longestMatch.length === 4) {
                // Line gem - determine direction
                const isHorizontal = longestMatch.gems.every(g => g.row === longestMatch.gems[0].row);
                specialType = isHorizontal ? SPECIAL_TYPES.LINE_H : SPECIAL_TYPES.LINE_V;
                specialGemType = board[longestMatch.gems[0].row]?.[longestMatch.gems[0].col]?.gemType;
                
                // Find center position
                if (longestMatch.gems.length % 2 === 1) {
                    specialPos = longestMatch.gems[Math.floor(longestMatch.gems.length / 2)];
                } else {
                    // Even length - pick center closest to moved gem
                    const mid1 = longestMatch.gems[longestMatch.gems.length / 2 - 1];
                    const mid2 = longestMatch.gems[longestMatch.gems.length / 2];
                    const d1 = Math.abs(mid1.row - movedGemPos.row) + Math.abs(mid1.col - movedGemPos.col);
                    const d2 = Math.abs(mid2.row - movedGemPos.row) + Math.abs(mid2.col - movedGemPos.col);
                    specialPos = d1 <= d2 ? mid1 : mid2;
                }
            }
            
            // Check if moved gem is in the match
            const movedInMatch = matches.some(m => m.gems.some(g => g.row === movedGemPos.row && g.col === movedGemPos.col));
            
            if (!movedInMatch && specialPos === null) {
                if (isTOrL) {
                    specialPos = specialPos; // Already set
                } else if (longestMatch.gems.length % 2 === 1) {
                    specialPos = longestMatch.gems[Math.floor(longestMatch.gems.length / 2)];
                } else {
                    const mid1 = longestMatch.gems[longestMatch.gems.length / 2 - 1];
                    const mid2 = longestMatch.gems[longestMatch.gems.length / 2];
                    const d1 = Math.abs(mid1.row - movedGemPos.row) + Math.abs(mid1.col - movedGemPos.col);
                    const d2 = Math.abs(mid2.row - movedGemPos.row) + Math.abs(mid2.col - movedGemPos.col);
                    specialPos = d1 <= d2 ? mid1 : mid2;
                }
            } else if (movedInMatch) {
                specialPos = movedGemPos;
            }
            
            // Clear matched gems (except where special will be created)
            const clearedGems = new Set();
            matchedCells.forEach(key => {
                if (!specialPos || key !== `${specialPos.row},${specialPos.col}`) {
                    clearedGems.add(key);
                    const [r, c] = key.split(',').map(Number);
                    board[r][c] = null;
                }
            });
            
            // Create special gem
            if (specialType && specialPos) {
                board[specialPos.row][specialPos.col] = {
                    gemType: specialGemType,
                    specialType: specialType
                };
                playSound('special');
            }
            
            // Show clearing animation
            renderBoard();
            clearedGems.forEach(key => {
                const [r, c] = key.split(',').map(Number);
                const cell = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
                const gem = cell?.querySelector('.gem');
                if (gem) gem.classList.add('clearing');
            });
            
            await delay(settings.motion ? 180 : 80);
            
            // Calculate score
            calculateAndShowScore(clearedGems, matches);
            
            // Check for special activations
            await activateSpecials();
            
            // Fall and spawn
            await fallAndSpawn();
            
            // Check for cascades
            await checkCascade();
            
            // Check game over
            if (!hasLegalMoves(board)) {
                showGameOver();
            }
            
            isResolving = false;
        }

        async function activateSpecials() {
            const specialsToActivate = [];
            
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    const gem = board[row][col];
                    if (gem?.specialType && gem.specialType !== SPECIAL_TYPES.COLOR) {
                        // Check if in a match
                        const type = gem.gemType;
                        let inMatch = false;
                        
                        // Check horizontal
                        let hCount = 1;
                        for (let c = col - 1; c >= 0 && board[row][c]?.gemType === type; c--) hCount++;
                        for (let c = col + 1; c < BOARD_SIZE && board[row][c]?.gemType === type; c++) hCount++;
                        
                        // Check vertical
                        let vCount = 1;
                        for (let r = row - 1; r >= 0 && board[r][col]?.gemType === type; r--) vCount++;
                        for (let r = row + 1; r < BOARD_SIZE && board[r][col]?.gemType === type; r++) vCount++;
                        
                        if (hCount >= 3 || vCount >= 3) {
                            inMatch = true;
                        }
                        
                        if (inMatch) {
                            specialsToActivate.push({ row, col, special: gem.specialType });
                        }
                    }
                }
            }
            
            if (specialsToActivate.length === 0) return;
            
            const clearedGems = new Set();
            
            for (const s of specialsToActivate) {
                const gem = board[s.row][s.col];
                if (!gem) continue;
                
                if (s.special === SPECIAL_TYPES.LINE_H) {
                    playSound('special');
                    // Flash row
                    renderBoard();
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        const cell = document.querySelector(`[data-row="${s.row}"][data-col="${c}"]`);
                        if (cell) cell.classList.add('row-flash');
                    }
                    await delay(settings.motion ? 120 : 80);
                    
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (board[s.row][c]) {
                            clearedGems.add(`${s.row},${c}`);
                            board[s.row][c] = null;
                        }
                    }
                } else if (s.special === SPECIAL_TYPES.LINE_V) {
                    playSound('special');
                    // Flash column
                    renderBoard();
                    for (let r = 0; r < BOARD_SIZE; r++) {
                        const cell = document.querySelector(`[data-row="${r}"][data-col="${s.col}"]`);
                        if (cell) cell.classList.add('col-flash');
                    }
                    await delay(settings.motion ? 120 : 80);
                    
                    for (let r = 0; r < BOARD_SIZE; r++) {
                        if (board[r][s.col]) {
                            clearedGems.add(`${r},${s.col}`);
                            board[r][s.col] = null;
                        }
                    }
                } else if (s.special === SPECIAL_TYPES.BURST) {
                    playSound('burst');
                    // Glow area
                    renderBoard();
                    const cell = document.querySelector(`[data-row="${s.row}"][data-col="${s.col}"]`);
                    if (cell) cell.classList.add('burst-glow');
                    await delay(settings.motion ? 120 : 80);
                    
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            const r = s.row + dr;
                            const c = s.col + dc;
                            if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE) {
                                if (board[r][c]) {
                                    clearedGems.add(`${r},${c}`);
                                    board[r][c] = null;
                                }
                            }
                        }
                    }
                }
            }
            
            if (clearedGems.size > 0) {
                renderBoard();
                clearedGems.forEach(key => {
                    const [r, c] = key.split(',').map(Number);
                    const cell = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
                    const gemEl = cell?.querySelector('.gem');
                    if (gemEl) gemEl.classList.add('clearing');
                });
                await delay(settings.motion ? 180 : 80);
                
                // Score for special effects
                const specialScore = clearedGems.size * 15;
                addScore(specialScore);
            }
        }

        function calculateAndShowScore(clearedGems, matches) {
            let points = 0;
            
            // Normal match points
            matches.forEach(m => {
                switch(m.length) {
                    case 3: points += 30; break;
                    case 4: points += 60; break;
                    case 5: points += 120; break;
                    case 6: points += 150; break;
                    case 7: points += 180; break;
                    case 8: points += 210; break;
                    default: points += 30 + (m.length - 3) * 30;
                }
            });
            
            // T/L shapes (120 points)
            if (matches.length >= 2) {
                points += 120;
            }
            
            // Apply cascade multiplier
            points *= cascadeMultiplier;
            
            addScore(points, clearedGems);
        }

        function addScore(points, clearedGems) {
            score += points;
            progress += points;
            
            // Show score popup
            if (clearedGems && clearedGems.size > 0 && points > 0) {
                showScorePopup(points, clearedGems);
            }
            
            // Check level up
            const oldLevel = level;
            while (progress >= getLevelTarget(level)) {
                progress -= getLevelTarget(level);
                level++;
            }
            
            if (level > oldLevel) {
                playSound('levelup');
                const fill = document.getElementById('progress-fill');
                if (settings.motion) {
                    fill.classList.add('progress-flash');
                    setTimeout(() => fill.classList.remove('progress-flash'), 180);
                } else {
                    fill.style.filter = 'brightness(2)';
                    setTimeout(() => fill.style.filter = '', 80);
                }
            }
            
            updateProgress();
        }

        function showScorePopup(points, clearedGems) {
            const popup = document.createElement('div');
            popup.className = 'score-popup';
            popup.textContent = `+${points}`;
            
            // Find center of cleared cells
            let sumRow = 0, sumCol = 0, count = 0;
            clearedGems.forEach(key => {
                const [r, c] = key.split(',').map(Number);
                sumRow += r;
                sumCol += c;
                count++;
            });
            
            const avgRow = sumRow / count;
            const avgCol = sumCol / count;
            
            const boardEl = document.getElementById('board');
            const cellSize = boardEl.offsetWidth / BOARD_SIZE;
            
            popup.style.left = `${avgCol * cellSize + cellSize / 2}px`;
            popup.style.top = `${avgRow * cellSize}px`;
            
            boardEl.parentElement.appendChild(popup);
            setTimeout(() => popup.remove(), 700);
        }

        async function fallAndSpawn() {
            const gemTypes = getGemTypesForLevel(level);
            
            // Gravity - fall down
            for (let col = 0; col < BOARD_SIZE; col++) {
                let writeRow = BOARD_SIZE - 1;
                for (let row = BOARD_SIZE - 1; row >= 0; row--) {
                    if (board[row][col]) {
                        if (row !== writeRow) {
                            board[writeRow][col] = board[row][col];
                            board[row][col] = null;
                        }
                        writeRow--;
                    }
                }
                
                // Spawn new gems at top
                for (let row = writeRow; row >= 0; row--) {
                    board[row][col] = {
                        gemType: gemTypes[Math.floor(Math.random() * gemTypes.length)],
                        specialType: null
                    };
                }
            }
            
            renderBoard();
            
            if (settings.motion) {
                await delay(200);
            } else {
                await delay(80);
            }
        }

        async function checkCascade() {
            const matches = findMatches(board);
            
            if (matches.length > 0) {
                cascadeMultiplier++;
                
                // Show multiplier
                const multEl = document.getElementById('cascade-multiplier');
                multEl.textContent = `x${cascadeMultiplier}`;
                multEl.classList.remove('hidden');
                
                playSound('cascade');
                
                await delay(500);
                multEl.classList.add('hidden');
                
                await resolveMatches(matches, matches[0].gems[0]);
            }
        }

        // Hint system
        function showHint() {
            if (isResolving) return;
            clearHint();
            
            const move = findHintMove();
            if (!move) return;
            
            hintPair = move;
            
            const cell1 = document.querySelector(`[data-row="${move.from.row}"][data-col="${move.from.col}"]`);
            const cell2 = document.querySelector(`[data-row="${move.to.row}"][data-col="${move.to.col}"]`);
            
            const gem1 = cell1?.querySelector('.gem');
            const gem2 = cell2?.querySelector('.gem');
            
            if (settings.motion) {
                // Determine nudge direction
                const dx = move.to.col - move.from.col;
                const dy = move.to.row - move.from.row;
                
                if (gem1) {
                    gem1.classList.add('hint-pulse');
                    if (dx > 0) gem1.classList.add('hint-nudge-right');
                    else if (dx < 0) gem1.classList.add('hint-nudge-left');
                    else if (dy > 0) gem1.classList.add('hint-nudge-down');
                    else if (dy < 0) gem1.classList.add('hint-nudge-up');
                }
                if (gem2) gem2.classList.add('hint-pulse');
            } else {
                if (gem1) gem1.classList.add('hint-pulse');
                if (gem2) gem2.classList.add('hint-pulse');
            }
            
            hintTimeout = setTimeout(() => {
                clearHint();
            }, 2000);
        }

        function clearHint() {
            if (hintTimeout) {
                clearTimeout(hintTimeout);
                hintTimeout = null;
            }
            
            document.querySelectorAll('.hint-pulse, .hint-nudge-right, .hint-nudge-left, .hint-nudge-down, .hint-nudge-up')
                .forEach(el => el.classList.remove('hint-pulse', 'hint-nudge-right', 'hint-nudge-left', 'hint-nudge-down', 'hint-nudge-up'));
            
            hintPair = null;
        }

        function findHintMove() {
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    // Check right
                    if (col < BOARD_SIZE - 1) {
                        if (wouldCreateMatch(board, row, col, row, col + 1)) {
                            return { from: { row, col }, to: { row, col: col + 1 } };
                        }
                    }
                    // Check down
                    if (row < BOARD_SIZE - 1) {
                        if (wouldCreateMatch(board, row, col, row + 1, col)) {
                            return { from: { row, col }, to: { row: row + 1, col } };
                        }
                    }
                }
            }
            return null;
        }

        // Pause/Resume
        function togglePause() {
            const overlay = document.getElementById('pause-overlay');
            if (overlay.classList.contains('hidden')) {
                overlay.classList.remove('hidden');
                clearIdleTimer();
            } else {
                overlay.classList.add('hidden');
                startIdleTimer();
            }
        }

        // Game Over
        function showGameOver() {
            playSound('gameover');
            
            const overlay = document.getElementById('gameover-overlay');
            const boardEl = document.getElementById('board');
            
            boardEl.style.opacity = '0.4';
            
            document.getElementById('final-score').textContent = score;
            document.getElementById('best-score-display').textContent = bestScore;
            
            if (score > bestScore) {
                bestScore = score;
                saveBestScore();
                document.getElementById('new-best').classList.remove('hidden');
            } else {
                document.getElementById('new-best').classList.add('hidden');
            }
            
            overlay.classList.remove('hidden');
            clearIdleTimer();
        }

        // New game
        function startNewGame() {
            board = generateBoard();
            score = 0;
            level = 1;
            progress = 0;
            selectedGem = null;
            cursorPos = { row: 0, col: 0 };
            isResolving = false;
            cascadeMultiplier = 1;
            
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('gameover-overlay').classList.add('hidden');
            document.getElementById('pause-overlay').classList.add('hidden');
            
            const boardEl = document.getElementById('board');
            boardEl.style.opacity = '1';
            
            renderBoard();
            startIdleTimer();
        }

        // Idle timer
        function startIdleTimer() {
            if (!settings.idleHints) return;
            
            idleTime = 0;
            clearIdleTimer();
            
            idleInterval = setInterval(() => {
                if (!isResolving && document.getElementById('game-screen').classList.contains('hidden') === false) {
                    idleTime++;
                    if (idleTime >= 8) {
                        showHint();
                    }
                }
            }, 1000);
        }

        function clearIdleTimer() {
            if (idleInterval) {
                clearInterval(idleInterval);
                idleInterval = null;
            }
            idleTime = 0;
        }

        function resetIdleTimer() {
            idleTime = 0;
        }

        // Utility
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function showScreen(screenId) {
            document.querySelectorAll('.overlay, #main-menu, #game-screen').forEach(el => {
                el.classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        // Event listeners
        document.getElementById('start-btn').addEventListener('click', () => {
            initAudio();
            hasInteracted = true;
            startNewGame();
        });

        document.getElementById('menu-trophy').addEventListener('click', () => {
            document.getElementById('best-score-value').textContent = bestScore;
            showScreen('bestscore-overlay');
        });

        document.getElementById('menu-settings').addEventListener('click', () => {
            showScreen('settings-overlay');
        });

        document.getElementById('bestscore-home').addEventListener('click', () => {
            showScreen('main-menu');
        });

        document.getElementById('pause-btn').addEventListener('click', togglePause);
        document.getElementById('resume-btn').addEventListener('click', togglePause);
        document.getElementById('pause-menu-btn').addEventListener('click', () => {
            document.getElementById('pause-overlay').classList.add('hidden');
            showScreen('main-menu');
            clearIdleTimer();
        });

        document.getElementById('restart-btn').addEventListener('click', startNewGame);
        document.getElementById('pause-settings-btn').addEventListener('click', () => {
            document.getElementById('pause-overlay').classList.add('hidden');
            showScreen('settings-overlay');
        });

        document.getElementById('hint-btn').addEventListener('click', () => {
            initAudio();
            hasInteracted = true;
            resetIdleTimer();
            showHint();
        });

        document.getElementById('game-settings').addEventListener('click', () => {
            showScreen('settings-overlay');
        });

        document.getElementById('play-again-btn').addEventListener('click', startNewGame);

        document.getElementById('gameover-menu-btn').addEventListener('click', () => {
            showScreen('main-menu');
        });

        // Settings toggles
        document.getElementById('sound-toggle').addEventListener('click', function() {
            settings.sound = !settings.sound;
            this.classList.toggle('active', settings.sound);
            saveSettings();
        });

        document.getElementById('motion-toggle').addEventListener('click', function() {
            settings.motion = !settings.motion;
            this.classList.toggle('active', settings.motion);
            document.body.classList.toggle('no-motion', !settings.motion);
            saveSettings();
        });

        document.getElementById('idle-hints-toggle').addEventListener('click', function() {
            settings.idleHints = !settings.idleHints;
            this.classList.toggle('active', settings.idleHints);
            saveSettings();
            if (settings.idleHints) {
                startIdleTimer();
            } else {
                clearIdleTimer();
            }
        });

        document.getElementById('high-contrast-toggle').addEventListener('click', function() {
            settings.highContrast = !settings.highContrast;
            this.classList.toggle('active', settings.highContrast);
            document.body.classList.toggle('high-contrast', settings.highContrast);
            saveSettings();
        });

        document.getElementById('reset-best-btn').addEventListener('click', () => {
            document.getElementById('reset-confirm').classList.remove('hidden');
        });

        document.getElementById('confirm-reset').addEventListener('click', () => {
            bestScore = 0;
            saveBestScore();
            document.getElementById('reset-confirm').classList.add('hidden');
        });

        document.getElementById('cancel-reset').addEventListener('click', () => {
            document.getElementById('reset-confirm').classList.add('hidden');
        });

        document.getElementById('settings-home').addEventListener('click', () => {
            if (document.getElementById('pause-overlay').classList.contains('hidden') === false) {
                document.getElementById('settings-overlay').classList.add('hidden');
                document.getElementById('pause-overlay').classList.remove('hidden');
            } else {
                showScreen('main-menu');
            }
        });

        // Board interaction
        const boardEl = document.getElementById('board');

        boardEl.addEventListener('click', (e) => {
            const cell = e.target.closest('.cell');
            if (!cell) return;
            
            const row = parseInt(cell.dataset.row);
            const col = parseInt(cell.dataset.col);
            
            selectGem(row, col);
        });

        // Touch/swipe support
        let touchStart = null;
        let touchGem = null;

        boardEl.addEventListener('touchstart', (e) => {
            const cell = e.target.closest('.cell');
            if (!cell) return;
            
            const row = parseInt(cell.dataset.row);
            const col = parseInt(cell.dataset.col);
            
            touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            touchGem = { row, col };
            
            initAudio();
            hasInteracted = true;
            resetIdleTimer();
        }, { passive: true });

        boardEl.addEventListener('touchmove', (e) => {
            if (!touchStart || !touchGem) return;
            
            const dx = e.touches[0].clientX - touchStart.x;
            const dy = e.touches[0].clientY - touchStart.y;
            
            const cellSize = boardEl.offsetWidth / BOARD_SIZE;
            const threshold = cellSize * 0.25;
            
            if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
                e.preventDefault();
                
                let targetRow = touchGem.row;
                let targetCol = touchGem.col;
                
                if (Math.abs(dx) > Math.abs(dy)) {
                    targetCol += dx > 0 ? 1 : -1;
                } else {
                    targetRow += dy > 0 ? 1 : -1;
                }
                
                if (targetRow >= 0 && targetRow < BOARD_SIZE && targetCol >= 0 && targetCol < BOARD_SIZE) {
                    selectGem(touchGem.row, touchGem.col);
                    selectGem(targetRow, targetCol);
                }
                
                touchStart = null;
                touchGem = null;
            }
        }, { passive: false });

        boardEl.addEventListener('touchend', () => {
            touchStart = null;
            touchGem = null;
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            const gameScreen = document.getElementById('game-screen');
            if (gameScreen.classList.contains('hidden')) return;
            
            const pauseOverlay = document.getElementById('pause-overlay');
            const settingsOverlay = document.getElementById('settings-overlay');
            const bestScoreOverlay = document.getElementById('bestscore-overlay');
            const gameOverOverlay = document.getElementById('gameover-overlay');
            
            // Handle overlay keys
            if (!pauseOverlay.classList.contains('hidden')) {
                if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
                    togglePause();
                }
                return;
            }
            
            if (!settingsOverlay.classList.contains('hidden')) {
                if (e.key === 'Escape') {
                    document.getElementById('settings-home').click();
                }
                return;
            }
            
            if (!bestScoreOverlay.classList.contains('hidden')) {
                if (e.key === 'Escape') {
                    document.getElementById('bestscore-home').click();
                }
                return;
            }
            
            if (!gameOverOverlay.classList.contains('hidden')) {
                if (e.key === 'Enter' || e.key === ' ') {
                    startNewGame();
                } else if (e.key === 'Escape') {
                    showScreen('main-menu');
                }
                return;
            }
            
            if (isResolving) return;
            
            initAudio();
            hasInteracted = true;
            resetIdleTimer();
            clearHint();
            
            switch(e.key) {
                case 'ArrowUp':
                    if (cursorPos.row > 0) cursorPos.row--;
                    renderBoard();
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    if (cursorPos.row < BOARD_SIZE - 1) cursorPos.row++;
                    renderBoard();
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                    if (cursorPos.col > 0) cursorPos.col--;
                    renderBoard();
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                    if (cursorPos.col < BOARD_SIZE - 1) cursorPos.col++;
                    renderBoard();
                    e.preventDefault();
                    break;
                case 'Enter':
                case ' ':
                    selectGem(cursorPos.row, cursorPos.col);
                    e.preventDefault();
                    break;
                case 'Escape':
                    selectedGem = null;
                    renderBoard();
                    break;
                case 'p':
                case 'P':
                    togglePause();
                    break;
                case 'h':
                case 'H':
                    showHint();
                    break;
            }
        });

        // Visibility change - pause animations
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // Pause animations handled naturally by browser
            }
        });

        // Responsive board sizing
        function updateBoardSize() {
            const vw = window.innerWidth;
            let boardWidth;
            
            if (vw >= 600) {
                boardWidth = 480;
            } else if (vw >= 360) {
                boardWidth = vw - 32;
            } else {
                boardWidth = vw - 16;
            }
            
            document.documentElement.style.setProperty('--board-width', `${boardWidth}px`);
        }

        window.addEventListener('resize', updateBoardSize);
        updateBoardSize();

        // Initialize
        loadSettings();
        showScreen('main-menu');
    </script>
</body>
</html>
