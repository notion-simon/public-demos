<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <style>
      :root{
        --bg0:#070A12;
        --bg1:#0B1022;
        --panel: rgba(255,255,255,0.06);
        --panel2: rgba(255,255,255,0.10);
        --text: rgba(255,255,255,0.92);
        --muted: rgba(255,255,255,0.70);
        --focus: rgba(255,255,255,0.95);
        --accent: #7CF2FF;
        --accent2:#B77CFF;
        --danger:#FF5C7A;
        --ok:#57FFA6;
        --shadow: 0 14px 30px rgba(0,0,0,0.45);
        --gridLine: 1px;
        --gemOutline: 1.5px;
        --cellRing: 3px;
        --cellGlow: 4px;
        --cellCursor: 2px;
        --radius: 18px;
        --boardRadius: 18px;
        --iconSize: 46px;
        --boardW: 480px;
        --cell: calc(var(--boardW) / 8);
        --motion: 1;
      }

      *{ box-sizing:border-box; }
      html, body { height: 100%; }
      body{
        margin:0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
        background: radial-gradient(1200px 800px at 50% 0%, #1A1F4B 0%, var(--bg0) 45%, #04050A 100%);
        color: var(--text);
        overflow-x:hidden;
        -webkit-tap-highlight-color: transparent;
      }
      button{ font:inherit; }

      .app{
        min-height:100%;
        display:flex;
        align-items:center;
        justify-content:center;
        padding: 20px 16px;
      }

      .shell{
        width:min(720px, 100%);
        display:flex;
        flex-direction:column;
        gap: 14px;
        align-items:center;
      }

      .topRow{
        width:100%;
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:12px;
      }

      .numbersRow{
        width:100%;
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:12px;
        padding: 0 2px;
      }

      .scoreNum, .levelNum, .bestNum, .finalNum{
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.5px;
        text-shadow: 0 1px 0 rgba(0,0,0,0.35);
      }
      .scoreNum{ font-size: 22px; font-weight: 760; }
      .levelWrap{
        display:flex;
        align-items:center;
        gap:8px;
      }
      .levelNum{ font-size: 18px; font-weight: 740; }

      .meter{
        width:100%;
        height: 12px;
        background: rgba(255,255,255,0.10);
        border-radius: 999px;
        overflow:hidden;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
      }
      .meterFill{
        height:100%;
        width:0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #7CF2FF 0%, #B77CFF 55%, #FF74B8 100%);
        box-shadow: 0 0 18px rgba(124,242,255,0.22);
      }
      .meter.flash .meterFill{
        filter: brightness(1.3);
      }

      .boardWrap{
        width: var(--boardW);
        height: var(--boardW);
        position:relative;
        border-radius: var(--boardRadius);
        background: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.06) 70%);
        box-shadow: var(--shadow);
        border: 1px solid rgba(255,255,255,0.10);
        overflow:hidden;
        user-select:none;
        touch-action:none;
      }
      .boardGrid{
        position:absolute;
        inset:0;
        background-size: var(--cell) var(--cell);
        background-image:
          linear-gradient(to right, rgba(255,255,255,0.08) var(--gridLine), transparent var(--gridLine)),
          linear-gradient(to bottom, rgba(255,255,255,0.08) var(--gridLine), transparent var(--gridLine));
        pointer-events:none;
        opacity: 0.55;
      }

      .gemLayer{
        position:absolute;
        inset:0;
      }
      .gem{
        position:absolute;
        width: var(--cell);
        height: var(--cell);
        display:flex;
        align-items:center;
        justify-content:center;
        will-change: transform, opacity, filter;
      }
      .gemSvg{
        width: 82%;
        height: 82%;
        filter: drop-shadow(0 10px 12px rgba(0,0,0,0.40));
      }
      .gemSvg .o{
        stroke: rgba(255,255,255,0.55);
        stroke-width: var(--gemOutline);
        stroke-linejoin: round;
      }
      .gemSvg .shine{
        opacity: 0.28;
      }
      .gem:hover .gemSvg{
        filter: drop-shadow(0 10px 12px rgba(0,0,0,0.40)) brightness(1.10);
      }
      .gem.selected::before{
        content:"";
        position:absolute;
        inset: 10%;
        border-radius: 14px;
        outline: var(--cellRing) solid rgba(255,255,255,0.92);
        box-shadow: 0 0 0 var(--cellGlow) rgba(124,242,255,0.35);
        pointer-events:none;
      }
      .cursor{
        position:absolute;
        width: var(--cell);
        height: var(--cell);
        border-radius: 12px;
        pointer-events:none;
      }
      .cursor::after{
        content:"";
        position:absolute;
        inset: 14%;
        border: var(--cellCursor) solid rgba(255,255,255,0.90);
        border-radius: 0px;
        box-shadow: 0 0 0 1px rgba(0,0,0,0.2);
      }

      .controlsRow{
        display:flex;
        gap: 12px;
        justify-content:center;
        align-items:center;
        width:100%;
        flex-wrap:wrap;
        margin-top: 6px;
      }
      .iconBtn{
        width: var(--iconSize);
        height: var(--iconSize);
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.06);
        box-shadow: 0 10px 20px rgba(0,0,0,0.32);
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        color: rgba(255,255,255,0.92);
      }
      .iconBtn:hover{ background: rgba(255,255,255,0.09); }
      .iconBtn:active{ transform: translateY(1px); }
      .iconBtn:focus-visible{
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .iconSvg{
        width: 24px;
        height: 24px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .menuCard{
        width:min(560px, 100%);
        border-radius: 26px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.06);
        box-shadow: var(--shadow);
        padding: 18px 16px 20px;
        position:relative;
        overflow:hidden;
      }
      .menuTop{
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:12px;
      }
      .logoWrap{
        display:flex;
        justify-content:center;
        align-items:center;
        padding: 22px 0 14px;
      }
      .logoSvg{
        width: min(320px, 86%);
        height: auto;
        filter: drop-shadow(0 16px 20px rgba(0,0,0,0.35));
      }
      .startBtn{
        width: min(320px, 92%);
        height: 52px;
        border-radius: 18px;
        border: 1px solid rgba(255,255,255,0.18);
        background: linear-gradient(180deg, rgba(124,242,255,0.20) 0%, rgba(183,124,255,0.18) 55%, rgba(255,116,184,0.16) 100%);
        color: rgba(255,255,255,0.94);
        font-weight: 780;
        letter-spacing: 0.4px;
        cursor:pointer;
        box-shadow: 0 16px 24px rgba(0,0,0,0.33);
      }
      .startBtn:hover{ filter: brightness(1.04); }
      .startBtn:active{ transform: translateY(1px); }
      .startBtn:focus-visible{
        outline: 2px solid rgba(255,255,255,0.95);
        outline-offset: 3px;
      }

      .overlay{
        position:fixed;
        inset:0;
        display:none;
        align-items:center;
        justify-content:center;
        padding: 20px 16px;
        background: rgba(0,0,0,0.55);
        backdrop-filter: blur(6px);
        z-index: 50;
      }
      .overlay.show{ display:flex; }
      .overlayCard{
        width:min(520px, 100%);
        border-radius: 26px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(11,16,34,0.86);
        box-shadow: var(--shadow);
        padding: 18px 16px;
        display:flex;
        flex-direction:column;
        align-items:center;
        gap: 12px;
      }
      .bigWord{
        font-size: 26px;
        font-weight: 820;
        letter-spacing: 0.5px;
        text-shadow: 0 2px 0 rgba(0,0,0,0.25);
      }
      .overlayRow{
        display:flex;
        gap: 14px;
        align-items:center;
        justify-content:center;
        flex-wrap:wrap;
      }

      .gameOverNums{
        display:flex;
        align-items:center;
        justify-content:center;
        gap: 10px;
        flex-wrap:wrap;
      }
      .finalNum{
        font-size: 26px;
        font-weight: 840;
      }
      .bestNum{
        font-size: 18px;
        font-weight: 760;
        opacity: 0.92;
      }
      .newBest{
        font-size: 14px;
        font-weight: 820;
        color: rgba(255,255,255,0.94);
        background: rgba(87,255,166,0.18);
        border: 1px solid rgba(87,255,166,0.22);
        padding: 6px 10px;
        border-radius: 999px;
        letter-spacing: 0.3px;
      }

      .textBtn{
        min-width: 170px;
        height: 48px;
        border-radius: 16px;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.08);
        color: rgba(255,255,255,0.94);
        font-weight: 780;
        letter-spacing: 0.3px;
        cursor:pointer;
      }
      .textBtn:hover{ background: rgba(255,255,255,0.11); }
      .textBtn:focus-visible{
        outline: 2px solid rgba(255,255,255,0.95);
        outline-offset: 3px;
      }

      .hudWrap{
        width:100%;
        max-width: 720px;
        display:none;
        flex-direction:column;
        align-items:center;
        gap: 10px;
      }
      .hudWrap.show{ display:flex; }

      .multiplier{
        position:absolute;
        left:50%;
        transform: translateX(-50%);
        top: -44px;
        font-weight: 860;
        letter-spacing: 0.4px;
        font-size: 18px;
        opacity:0;
        pointer-events:none;
        text-shadow: 0 2px 0 rgba(0,0,0,0.35);
      }

      .scorePopup{
        position:absolute;
        transform: translate(-50%, -50%);
        font-weight: 860;
        letter-spacing: 0.3px;
        font-variant-numeric: tabular-nums;
        color: rgba(255,255,255,0.96);
        text-shadow: 0 2px 0 rgba(0,0,0,0.35);
        pointer-events:none;
      }

      .screen{
        width:100%;
        display:none;
      }
      .screen.show{ display:block; }

      .settingsGrid{
        width:min(520px, 100%);
        border-radius: 26px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.06);
        box-shadow: var(--shadow);
        padding: 18px 16px;
        display:flex;
        flex-direction:column;
        gap: 14px;
      }
      .settingsRow{
        display:flex;
        gap:12px;
        flex-wrap:wrap;
        justify-content:center;
      }
      .iconBtn.on{
        border-color: rgba(124,242,255,0.30);
        background: rgba(124,242,255,0.10);
      }
      .iconBtn.off{
        border-color: rgba(255,255,255,0.10);
        background: rgba(255,255,255,0.05);
        opacity: 0.85;
      }
      .confirmRow{
        display:none;
        gap:12px;
        justify-content:center;
      }
      .confirmRow.show{ display:flex; }

      /* Responsive board widths */
      @media (min-width: 600px){
        :root{ --boardW: 480px; }
      }
      @media (min-width: 360px) and (max-width: 599px){
        :root{ --boardW: calc(100vw - 32px); }
      }
      @media (max-width: 359px){
        :root{ --boardW: calc(100vw - 16px); }
      }

      @media (max-width: 359px){
        .shell{ gap: 10px; }
        .startBtn{ width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="shell">
        <!-- Main Menu -->
        <div id="menuScreen" class="screen show" aria-hidden="false">
          <div class="menuCard">
            <div class="menuTop">
              <button id="menuBestBtn" class="iconBtn" type="button" aria-label="Best score">
                <svg class="iconSvg" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 5h8v4a4 4 0 0 1-8 0V5Z"></path>
                  <path d="M6 7H4a2 2 0 0 0 2 2"></path>
                  <path d="M18 7h2a2 2 0 0 1-2 2"></path>
                  <path d="M10 13v2a2 2 0 0 0 4 0v-2"></path>
                  <path d="M8 21h8"></path>
                </svg>
              </button>
              <button id="menuSettingsBtn" class="iconBtn" type="button" aria-label="Settings">
                <svg class="iconSvg" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path>
                  <path d="M19.4 15a8.2 8.2 0 0 0 .1-1l2-1.2-2-3.4-2.3.6a7.5 7.5 0 0 0-1.7-1L14.8 6h-3.6l-.7 2a7.5 7.5 0 0 0-1.7 1L6.5 9.4 4.5 12.8l2 1.2a8.2 8.2 0 0 0 .1 1l-2 1.2 2 3.4 2.3-.6a7.5 7.5 0 0 0 1.7 1l.7 2h3.6l.7-2a7.5 7.5 0 0 0 1.7-1l2.3.6 2-3.4-2-1.2Z"></path>
                </svg>
              </button>
            </div>

            <div class="logoWrap" aria-hidden="true">
              <svg class="logoSvg" viewBox="0 0 400 210">
                <defs>
                  <linearGradient id="lg0" x1="0" x2="1">
                    <stop offset="0" stop-color="#7CF2FF" stop-opacity="0.95"/>
                    <stop offset="0.45" stop-color="#B77CFF" stop-opacity="0.92"/>
                    <stop offset="1" stop-color="#FF74B8" stop-opacity="0.90"/>
                  </linearGradient>
                  <linearGradient id="lg1" x1="0" x2="1" y1="1" y2="0">
                    <stop offset="0" stop-color="#2BFFBF" stop-opacity="0.85"/>
                    <stop offset="0.55" stop-color="#7CF2FF" stop-opacity="0.80"/>
                    <stop offset="1" stop-color="#B77CFF" stop-opacity="0.85"/>
                  </linearGradient>
                </defs>
                <path d="M200 10 335 75 360 125 270 200 130 200 40 125 65 75Z" fill="url(#lg0)" opacity="0.95"/>
                <path d="M200 25 312 80 328 123 254 185 146 185 72 123 88 80Z" fill="rgba(0,0,0,0.18)"/>
                <path d="M200 28 304 82 316 122 248 178 152 178 84 122 96 82Z" fill="url(#lg1)" opacity="0.92"/>
                <path d="M200 28 248 178 152 178Z" fill="rgba(255,255,255,0.10)"/>
                <path d="M96 82 200 28 84 122Z" fill="rgba(255,255,255,0.12)"/>
                <path d="M304 82 200 28 316 122Z" fill="rgba(255,255,255,0.12)"/>
              </svg>
            </div>

            <div style="display:flex; justify-content:center; padding-bottom: 6px;">
              <button id="startBtn" class="startBtn" type="button">Start Game</button>
            </div>
          </div>
        </div>

        <!-- Gameplay HUD -->
        <div id="gameHud" class="hudWrap" aria-hidden="true">
          <div class="numbersRow">
            <div class="scoreNum" id="scoreNum" aria-label="Score" aria-live="polite">0</div>
            <div class="levelWrap" aria-label="Level">
              <svg class="iconSvg" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px;opacity:0.95;">
                <path d="M12 2.5l2.9 6 6.6.6-5 4.2 1.6 6.3L12 16.8 5.9 19.6 7.5 13.3 2.5 9.1l6.6-.6L12 2.5Z" fill="rgba(255,255,255,0.92)" stroke="none"/>
              </svg>
              <div class="levelNum" id="levelNum">1</div>
            </div>
          </div>
          <div class="meter" id="meter" aria-label="Progress">
            <div class="meterFill" id="meterFill"></div>
          </div>

          <div style="position:relative; width:var(--boardW);">
            <div id="multiplier" class="multiplier" aria-hidden="true">x2</div>
            <div id="board" class="boardWrap" role="grid" tabindex="0" aria-label="Board" aria-activedescendant="">
              <div class="boardGrid" aria-hidden="true"></div>
              <div id="gemLayer" class="gemLayer" aria-hidden="false"></div>
              <div id="cursor" class="cursor" aria-hidden="true"></div>
            </div>
          </div>

          <div class="controlsRow">
            <button id="pauseBtn" class="iconBtn" type="button" aria-label="Pause">
              <svg class="iconSvg" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 5v14"></path>
                <path d="M17 5v14"></path>
              </svg>
            </button>
            <button id="hintBtn" class="iconBtn" type="button" aria-label="Hint">
              <svg class="iconSvg" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2l1.5 6.5L20 10l-6.5 1.5L12 18l-1.5-6.5L4 10l6.5-1.5L12 2Z"></path>
              </svg>
            </button>
            <button id="gameSettingsBtn" class="iconBtn" type="button" aria-label="Settings">
              <svg class="iconSvg" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path>
                <path d="M19.4 15a8.2 8.2 0 0 0 .1-1l2-1.2-2-3.4-2.3.6a7.5 7.5 0 0 0-1.7-1L14.8 6h-3.6l-.7 2a7.5 7.5 0 0 0-1.7 1L6.5 9.4 4.5 12.8l2 1.2a8.2 8.2 0 0 0 .1 1l-2 1.2 2 3.4 2.3-.6a7.5 7.5 0 0 0 1.7 1l.7 2h3.6l.7-2a7.5 7.5 0 0 0 1.7-1l2.3.6 2-3.4-2-1.2Z"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Pause Overlay -->
    <div id="pauseOverlay" class="overlay" aria-hidden="true">
      <div class="overlayCard">
        <div class="bigWord">Paused</div>
        <div class="overlayRow">
          <button id="resumeBtn" class="iconBtn" type="button" aria-label="Resume">
            <svg class="iconSvg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5l12 7-12 7Z" fill="currentColor" stroke="none"></path>
            </svg>
          </button>
          <button id="restartBtn" class="iconBtn" type="button" aria-label="Restart">
            <svg class="iconSvg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-3-6.7"></path>
              <path d="M21 3v6h-6"></path>
            </svg>
          </button>
          <button id="pauseSettingsBtn" class="iconBtn" type="button" aria-label="Settings">
            <svg class="iconSvg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path>
              <path d="M19.4 15a8.2 8.2 0 0 0 .1-1l2-1.2-2-3.4-2.3.6a7.5 7.5 0 0 0-1.7-1L14.8 6h-3.6l-.7 2a7.5 7.5 0 0 0-1.7 1L6.5 9.4 4.5 12.8l2 1.2a8.2 8.2 0 0 0 .1 1l-2 1.2 2 3.4 2.3-.6a7.5 7.5 0 0 0 1.7 1l.7 2h3.6l.7-2a7.5 7.5 0 0 0 1.7-1l2.3.6 2-3.4-2-1.2Z"></path>
            </svg>
          </button>
          <button id="pauseMenuBtn" class="iconBtn" type="button" aria-label="Menu">
            <svg class="iconSvg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 10.5 12 3l9 7.5"></path>
              <path d="M5 10v10h14V10"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" aria-hidden="true">
      <div class="overlayCard">
        <div class="bigWord">Game Over</div>
        <div class="gameOverNums">
          <div id="finalScoreNum" class="finalNum" aria-label="Final score">0</div>
        </div>
        <div class="gameOverNums">
          <svg class="iconSvg" viewBox="0 0 24 24" aria-hidden="true" style="width:26px;height:26px;">
            <path d="M8 5h8v4a4 4 0 0 1-8 0V5Z"></path>
            <path d="M6 7H4a2 2 0 0 0 2 2"></path>
            <path d="M18 7h2a2 2 0 0 1-2 2"></path>
            <path d="M10 13v2a2 2 0 0 0 4 0v-2"></path>
            <path d="M8 21h8"></path>
          </svg>
          <div id="bestScoreNum" class="bestNum" aria-label="Best score">0</div>
        </div>
        <div id="newBestTag" class="newBest" style="display:none;">New Best</div>
        <div class="overlayRow">
          <button id="playAgainBtn" class="textBtn" type="button">Play Again</button>
          <button id="goMenuBtn" class="textBtn" type="button">Menu</button>
        </div>
      </div>
    </div>

    <!-- Best Score Screen -->
    <div id="bestScreen" class="overlay" aria-hidden="true">
      <div class="overlayCard">
        <svg class="iconSvg" viewBox="0 0 24 24" aria-hidden="true" style="width:32px;height:32px;">
          <path d="M8 5h8v4a4 4 0 0 1-8 0V5Z"></path>
          <path d="M6 7H4a2 2 0 0 0 2 2"></path>
          <path d="M18 7h2a2 2 0 0 1-2 2"></path>
          <path d="M10 13v2a2 2 0 0 0 4 0v-2"></path>
          <path d="M8 21h8"></path>
        </svg>
        <div id="bestOnlyNum" class="finalNum">0</div>
        <button id="bestHomeBtn" class="iconBtn" type="button" aria-label="Menu">
          <svg class="iconSvg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.5 12 3l9 7.5"></path>
            <path d="M5 10v10h14V10"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Settings Screen -->
    <div id="settingsScreen" class="overlay" aria-hidden="true">
      <div class="settingsGrid">
        <div class="settingsRow">
          <button id="soundBtn" class="iconBtn" type="button" aria-label="Sound"></button>
          <button id="motionBtn" class="iconBtn" type="button" aria-label="Motion"></button>
          <button id="idleHintBtn" class="iconBtn" type="button" aria-label="Idle hints"></button>
          <button id="contrastBtn" class="iconBtn" type="button" aria-label="High contrast"></button>
          <button id="trashBtn" class="iconBtn" type="button" aria-label="Reset best score"></button>
          <button id="settingsHomeBtn" class="iconBtn" type="button" aria-label="Menu"></button>
        </div>
        <div id="confirmRow" class="confirmRow" aria-hidden="true">
          <button id="confirmResetBtn" class="iconBtn" type="button" aria-label="Confirm reset"></button>
          <button id="cancelResetBtn" class="iconBtn" type="button" aria-label="Cancel reset"></button>
        </div>
      </div>
    </div>

    <script>
/* Core game logic (no DOM). Provides deterministic board operations and scoring.
   Exposes a global BejeweledCore for browser, and module.exports for Node tests. */
(function (global) {
  'use strict';

  const ROWS = 8;
  const COLS = 8;

  const GemType = Object.freeze({
    RED: 'red',
    BLUE: 'blue',
    GREEN: 'green',
    YELLOW: 'yellow',
    PURPLE: 'purple',
    ORANGE: 'orange',
    WHITE: 'white',
  });

  const Special = Object.freeze({
    NONE: 'none',
    LINE_H: 'lineH',
    LINE_V: 'lineV',
    BURST: 'burst',
    COLOR: 'color',
  });

  function deepCloneBoard(board) {
    return board.map(row => row.map(cell => (cell ? { ...cell } : null)));
  }

  function targetForLevel(level) {
    const x = level - 1;
    return 1000 + 400 * x + 100 * x * x;
  }

  function gemTypesForLevel(level) {
    if (level <= 2) return [GemType.RED, GemType.BLUE, GemType.GREEN, GemType.YELLOW, GemType.PURPLE];
    if (level <= 5) return [GemType.RED, GemType.BLUE, GemType.GREEN, GemType.YELLOW, GemType.PURPLE, GemType.ORANGE];
    return [GemType.RED, GemType.BLUE, GemType.GREEN, GemType.YELLOW, GemType.PURPLE, GemType.ORANGE, GemType.WHITE];
  }

  function isInBounds(r, c) {
    return r >= 0 && r < ROWS && c >= 0 && c < COLS;
  }

  function baseTypeOf(cell) {
    if (!cell) return null;
    if (cell.special === Special.COLOR) return null;
    return cell.type;
  }

  function canMatch(cell) {
    return !!cell && cell.special !== Special.COLOR;
  }

  function swapInBoard(board, a, b) {
    const tmp = board[a.r][a.c];
    board[a.r][a.c] = board[b.r][b.c];
    board[b.r][b.c] = tmp;
  }

  function forEachCell(fn) {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) fn(r, c);
    }
  }

  function detectMatches(board) {
    // Returns:
    // - lines: array of { cells:[{r,c}...], dir:'h'|'v', type, length }
    // - matchedSet: Map key->true for all matched cells (union)
    // Special gems count as their base type; color gems do not match.
    const matched = new Map();
    const lines = [];

    // Horizontal
    for (let r = 0; r < ROWS; r++) {
      let c = 0;
      while (c < COLS) {
        const cell = board[r][c];
        const t = baseTypeOf(cell);
        if (!t) {
          c++;
          continue;
        }
        let end = c + 1;
        while (end < COLS && baseTypeOf(board[r][end]) === t) end++;
        const len = end - c;
        if (len >= 3) {
          const cells = [];
          for (let cc = c; cc < end; cc++) {
            const key = `${r},${cc}`;
            matched.set(key, true);
            cells.push({ r, c: cc });
          }
          lines.push({ cells, dir: 'h', type: t, length: len });
        }
        c = end;
      }
    }

    // Vertical
    for (let c = 0; c < COLS; c++) {
      let r = 0;
      while (r < ROWS) {
        const cell = board[r][c];
        const t = baseTypeOf(cell);
        if (!t) {
          r++;
          continue;
        }
        let end = r + 1;
        while (end < ROWS && baseTypeOf(board[end][c]) === t) end++;
        const len = end - r;
        if (len >= 3) {
          const cells = [];
          for (let rr = r; rr < end; rr++) {
            const key = `${rr},${c}`;
            matched.set(key, true);
            cells.push({ r: rr, c });
          }
          lines.push({ cells, dir: 'v', type: t, length: len });
        }
        r = end;
      }
    }

    return { lines, matchedSet: matched };
  }

  function buildMatchedComponents(board, matchedSet) {
    // Components of matched cells connected 4-dir with same base type.
    const seen = new Map();
    const comps = [];

    function neighbors(rc) {
      return [
        { r: rc.r - 1, c: rc.c },
        { r: rc.r + 1, c: rc.c },
        { r: rc.r, c: rc.c - 1 },
        { r: rc.r, c: rc.c + 1 },
      ].filter(p => isInBounds(p.r, p.c));
    }

    for (const key of matchedSet.keys()) {
      if (seen.get(key)) continue;
      const [r0, c0] = key.split(',').map(Number);
      const t = baseTypeOf(board[r0][c0]);
      if (!t) continue;

      const queue = [{ r: r0, c: c0 }];
      const cells = [];
      seen.set(key, true);
      while (queue.length) {
        const cur = queue.pop();
        cells.push(cur);
        for (const nb of neighbors(cur)) {
          const k = `${nb.r},${nb.c}`;
          if (!matchedSet.get(k) || seen.get(k)) continue;
          if (baseTypeOf(board[nb.r][nb.c]) !== t) continue;
          seen.set(k, true);
          queue.push(nb);
        }
      }
      comps.push({ type: t, cells });
    }
    return comps;
  }

  function analyzeComponentForSpecial(board, comp) {
    // Determine if comp supports color, burst, or line creation.
    // Also compute intersection and best straight segment lengths.
    const set = new Set(comp.cells.map(p => `${p.r},${p.c}`));
    const horizAt = new Map(); // key -> run length including key
    const vertAt = new Map();

    // For each cell, compute horizontal contiguous length within set.
    for (const p of comp.cells) {
      // horizontal
      let left = p.c;
      while (left - 1 >= 0 && set.has(`${p.r},${left - 1}`)) left--;
      let right = p.c;
      while (right + 1 < COLS && set.has(`${p.r},${right + 1}`)) right++;
      horizAt.set(`${p.r},${p.c}`, right - left + 1);
      // vertical
      let up = p.r;
      while (up - 1 >= 0 && set.has(`${up - 1},${p.c}`)) up--;
      let down = p.r;
      while (down + 1 < ROWS && set.has(`${down + 1},${p.c}`)) down++;
      vertAt.set(`${p.r},${p.c}`, down - up + 1);
    }

    let hasIntersection = false;
    let intersectionCell = null;
    for (const p of comp.cells) {
      const k = `${p.r},${p.c}`;
      if ((horizAt.get(k) || 0) >= 3 && (vertAt.get(k) || 0) >= 3) {
        hasIntersection = true;
        // Prefer the most central intersection (deterministic)
        if (!intersectionCell) intersectionCell = p;
        else {
          if (p.r < intersectionCell.r || (p.r === intersectionCell.r && p.c < intersectionCell.c)) intersectionCell = p;
        }
      }
    }

    // Find longest straight segments in this component.
    let bestH = null; // {length, row, cStart, cEnd}
    let bestV = null; // {length, col, rStart, rEnd}

    // For horizontal, scan per row
    for (let r = 0; r < ROWS; r++) {
      let c = 0;
      while (c < COLS) {
        if (!set.has(`${r},${c}`)) { c++; continue; }
        let end = c + 1;
        while (end < COLS && set.has(`${r},${end}`)) end++;
        const len = end - c;
        if (len >= 3) {
          if (!bestH || len > bestH.length || (len === bestH.length && (r < bestH.row || (r === bestH.row && c < bestH.cStart)))) {
            bestH = { length: len, row: r, cStart: c, cEnd: end - 1 };
          }
        }
        c = end;
      }
    }
    // For vertical, scan per col
    for (let c = 0; c < COLS; c++) {
      let r = 0;
      while (r < ROWS) {
        if (!set.has(`${r},${c}`)) { r++; continue; }
        let end = r + 1;
        while (end < ROWS && set.has(`${end},${c}`)) end++;
        const len = end - r;
        if (len >= 3) {
          if (!bestV || len > bestV.length || (len === bestV.length && (c < bestV.col || (c === bestV.col && r < bestV.rStart)))) {
            bestV = { length: len, col: c, rStart: r, rEnd: end - 1 };
          }
        }
        r = end;
      }
    }

    const canColor = (bestH && bestH.length >= 5) || (bestV && bestV.length >= 5);
    const canBurst = hasIntersection;
    const canLine = (!canBurst && !canColor) && ((bestH && bestH.length === 4) || (bestV && bestV.length === 4));

    return { canColor, canBurst, canLine, intersectionCell, bestH, bestV };
  }

  function chooseSpecialCreation(board, detection, movedDest) {
    // Returns { kind:Special, at:{r,c}, baseType } or null.
    const comps = buildMatchedComponents(board, detection.matchedSet);
    if (comps.length === 0) return null;
    const candidates = [];
    for (const comp of comps) {
      const info = analyzeComponentForSpecial(board, comp);
      if (info.canColor) candidates.push({ priority: 3, kind: Special.COLOR, comp, info });
      else if (info.canBurst) candidates.push({ priority: 2, kind: Special.BURST, comp, info });
      else if (info.canLine) {
        // Determine line direction from the straight 4 that exists (prefer longer? deterministic).
        // If both exist (rare without intersection), prefer the one involving movedDest if possible.
        candidates.push({ priority: 1, kind: 'line', comp, info });
      }
    }
    if (!candidates.length) return null;

    // Highest priority only.
    const maxP = Math.max(...candidates.map(c => c.priority));
    let top = candidates.filter(c => c.priority === maxP);

    // Prefer candidate that contains movedDest (moved gem final cell)
    const mdKey = movedDest ? `${movedDest.r},${movedDest.c}` : null;
    if (mdKey) {
      const withMoved = top.filter(c => c.comp.cells.some(p => `${p.r},${p.c}` === mdKey));
      if (withMoved.length) top = withMoved;
    }

    // Deterministic tie-breaker: smallest (row,col) among component cells
    top.sort((a, b) => {
      function minKey(comp) {
        let mr = 99, mc = 99;
        for (const p of comp.cells) {
          if (p.r < mr || (p.r === mr && p.c < mc)) { mr = p.r; mc = p.c; }
        }
        return mr * 100 + mc;
      }
      return minKey(a.comp) - minKey(b.comp);
    });
    const chosen = top[0];

    // Determine placement cell.
    let at = null;
    const movedInComp = mdKey && chosen.comp.cells.some(p => `${p.r},${p.c}` === mdKey);
    if (movedInComp) {
      at = { ...movedDest };
    } else if (chosen.kind === Special.BURST) {
      at = chosen.info.intersectionCell ? { ...chosen.info.intersectionCell } : { ...chosen.comp.cells[0] };
    } else {
      // Straight placement: use the longest straight segment in the component (prefer horizontal then vertical).
      let seg = null;
      if (chosen.info.bestH && chosen.info.bestV) {
        if (chosen.info.bestH.length > chosen.info.bestV.length) seg = { dir: 'h', ...chosen.info.bestH };
        else if (chosen.info.bestV.length > chosen.info.bestH.length) seg = { dir: 'v', ...chosen.info.bestV };
        else {
          // tie: pick one closest to movedDest if exists, else deterministic (horizontal).
          seg = { dir: 'h', ...chosen.info.bestH };
        }
      } else if (chosen.info.bestH) seg = { dir: 'h', ...chosen.info.bestH };
      else if (chosen.info.bestV) seg = { dir: 'v', ...chosen.info.bestV };

      if (!seg) return null;

      const len = seg.length;
      if (seg.dir === 'h') {
        const centers = len % 2 === 1 ? [seg.cStart + Math.floor(len / 2)] : [seg.cStart + len / 2 - 1, seg.cStart + len / 2];
        if (!movedDest) at = { r: seg.row, c: centers[0] };
        else {
          centers.sort((a, b) => Math.abs(a - movedDest.c) - Math.abs(b - movedDest.c));
          at = { r: seg.row, c: centers[0] };
        }
      } else {
        const centers = len % 2 === 1 ? [seg.rStart + Math.floor(len / 2)] : [seg.rStart + len / 2 - 1, seg.rStart + len / 2];
        if (!movedDest) at = { r: centers[0], c: seg.col };
        else {
          centers.sort((a, b) => Math.abs(a - movedDest.r) - Math.abs(b - movedDest.r));
          at = { r: centers[0], c: seg.col };
        }
      }
    }

    // Determine kind details for line.
    let kind = chosen.kind;
    if (kind === 'line') {
      // Determine if horizontal 4 or vertical 4 exists in chosen component; prefer one that includes movedDest if possible.
      const set = new Set(chosen.comp.cells.map(p => `${p.r},${p.c}`));
      const options = [];
      // horizontal runs
      for (let r = 0; r < ROWS; r++) {
        let c = 0;
        while (c < COLS) {
          if (!set.has(`${r},${c}`)) { c++; continue; }
          let end = c + 1;
          while (end < COLS && set.has(`${r},${end}`)) end++;
          const len = end - c;
          if (len === 4) options.push({ dir: 'h', r, cStart: c, cEnd: end - 1 });
          c = end;
        }
      }
      for (let c = 0; c < COLS; c++) {
        let r = 0;
        while (r < ROWS) {
          if (!set.has(`${r},${c}`)) { r++; continue; }
          let end = r + 1;
          while (end < ROWS && set.has(`${end},${c}`)) end++;
          const len = end - r;
          if (len === 4) options.push({ dir: 'v', c, rStart: r, rEnd: end - 1 });
          r = end;
        }
      }
      let opt = options[0];
      if (movedDest && options.length > 1) {
        const k = `${movedDest.r},${movedDest.c}`;
        const withMoved = options.filter(o => {
          if (o.dir === 'h') return movedDest.r === o.r && movedDest.c >= o.cStart && movedDest.c <= o.cEnd;
          return movedDest.c === o.c && movedDest.r >= o.rStart && movedDest.r <= o.rEnd;
        });
        if (withMoved.length) opt = withMoved[0];
      }
      kind = (opt && opt.dir === 'v') ? Special.LINE_V : Special.LINE_H;
    }

    return { kind, at, baseType: chosen.comp.type };
  }

  function scoreNormalMatchForComponent(board, comp) {
    // Determine if component is T/L and its straight length otherwise.
    const set = new Set(comp.cells.map(p => `${p.r},${p.c}`));
    let hasIntersection = false;
    for (const p of comp.cells) {
      let h = 1;
      while (p.c - h >= 0 && set.has(`${p.r},${p.c - h}`)) h++;
      let hh = 1;
      while (p.c + hh < COLS && set.has(`${p.r},${p.c + hh}`)) hh++;
      const hlen = h + hh - 1;
      let v = 1;
      while (p.r - v >= 0 && set.has(`${p.r - v},${p.c}`)) v++;
      let vv = 1;
      while (p.r + vv < ROWS && set.has(`${p.r + vv},${p.c}`)) vv++;
      const vlen = v + vv - 1;
      if (hlen >= 3 && vlen >= 3) { hasIntersection = true; break; }
    }
    if (hasIntersection) return 120;

    // Straight: either all in a row or all in a column (for standard match detection).
    // Determine max run length among rows/cols.
    let maxLen = 0;
    // rows
    for (let r = 0; r < ROWS; r++) {
      let c = 0;
      while (c < COLS) {
        if (!set.has(`${r},${c}`)) { c++; continue; }
        let end = c + 1;
        while (end < COLS && set.has(`${r},${end}`)) end++;
        maxLen = Math.max(maxLen, end - c);
        c = end;
      }
    }
    // cols
    for (let c = 0; c < COLS; c++) {
      let r = 0;
      while (r < ROWS) {
        if (!set.has(`${r},${c}`)) { r++; continue; }
        let end = r + 1;
        while (end < ROWS && set.has(`${end},${c}`)) end++;
        maxLen = Math.max(maxLen, end - r);
        r = end;
      }
    }
    const table = new Map([
      [3, 30],
      [4, 60],
      [5, 120],
      [6, 150],
      [7, 180],
      [8, 210],
    ]);
    return table.get(Math.min(8, maxLen)) || 0;
  }

  function scoreNormalMatches(board, matchedSet) {
    const comps = buildMatchedComponents(board, matchedSet);
    let total = 0;
    for (const comp of comps) total += scoreNormalMatchForComponent(board, comp);
    return { total, components: comps };
  }

  function classifySpecialSwap(a, b) {
    // a,b are cells. Returns one of:
    // 'LL','LB','BB','CN','CL','CB','CC' or null
    const sa = a ? a.special : Special.NONE;
    const sb = b ? b.special : Special.NONE;

    const isLine = s => s === Special.LINE_H || s === Special.LINE_V;
    const isBurst = s => s === Special.BURST;
    const isColor = s => s === Special.COLOR;

    if (isLine(sa) && isLine(sb)) return 'LL';
    if ((isLine(sa) && isBurst(sb)) || (isBurst(sa) && isLine(sb))) return 'LB';
    if (isBurst(sa) && isBurst(sb)) return 'BB';
    if (isColor(sa) && isColor(sb)) return 'CC';
    if ((isColor(sa) && !isColor(sb)) || (!isColor(sa) && isColor(sb))) {
      // color + normal/line/burst (color gem has no base type)
      const other = isColor(sa) ? b : a;
      if (!other) return null;
      if (other.special === Special.BURST) return 'CB';
      if (other.special === Special.LINE_H || other.special === Special.LINE_V) return 'CL';
      if (other.special === Special.NONE) return 'CN';
      // color + color handled above
      return null;
    }
    return null;
  }

  function computeSpecialSwapClears(board, swap, movedDest) {
    // swap: {a:{r,c}, b:{r,c}} where a is moved origin and b is destination.
    // movedDest is swap.b.
    const a = board[swap.a.r][swap.a.c];
    const b = board[swap.b.r][swap.b.c];
    const kind = classifySpecialSwap(a, b);
    if (!kind) return null;

    const dest = movedDest;
    const clears = new Map(); // key -> effectType ('line'|'burst'|'color')
    const activations = []; // for UI hints, list of {type:'line'|'burst'|'color', at:{r,c}}

    function markCell(r, c, effect) {
      if (!isInBounds(r, c)) return;
      const key = `${r},${c}`;
      const prev = clears.get(key);
      // keep highest effect value: color > burst > line
      const rank = { line: 1, burst: 2, color: 3 };
      if (!prev || rank[effect] > rank[prev]) clears.set(key, effect);
    }

    function clearRowColCross(r, c) {
      for (let cc = 0; cc < COLS; cc++) markCell(r, cc, 'line');
      for (let rr = 0; rr < ROWS; rr++) markCell(rr, c, 'line');
    }
    function clear3Rows3Cols(r, c) {
      for (let dr = -1; dr <= 1; dr++) {
        const rr = r + dr;
        if (isInBounds(rr, 0)) for (let cc = 0; cc < COLS; cc++) markCell(rr, cc, 'line');
      }
      for (let dc = -1; dc <= 1; dc++) {
        const cc = c + dc;
        if (isInBounds(0, cc)) for (let rr = 0; rr < ROWS; rr++) markCell(rr, cc, 'line');
      }
    }
    function clearArea(r, c, radius, effect) {
      for (let rr = r - radius; rr <= r + radius; rr++) {
        for (let cc = c - radius; cc <= c + radius; cc++) markCell(rr, cc, effect);
      }
    }

    if (kind === 'LL') {
      clearRowColCross(dest.r, dest.c);
      activations.push({ type: 'line', at: { ...dest } });
    } else if (kind === 'LB') {
      clear3Rows3Cols(dest.r, dest.c);
      activations.push({ type: 'line', at: { ...dest } });
    } else if (kind === 'BB') {
      clearArea(dest.r, dest.c, 2, 'burst');
      activations.push({ type: 'burst', at: { ...dest } });
    } else if (kind === 'CN') {
      // Clear all gems of the normal type.
      const other = (a.special === Special.COLOR) ? b : a;
      const t = baseTypeOf(other);
      forEachCell((r, c) => {
        const bt = baseTypeOf(board[r][c]);
        if (bt && bt === t) markCell(r, c, 'color');
      });
      activations.push({ type: 'color', at: { ...dest } });
    } else if (kind === 'CL' || kind === 'CB') {
      const other = (a.special === Special.COLOR) ? b : a;
      const t = baseTypeOf(other);
      // Convert all gems of that type into line/burst, then activate all.
      // We do conversion in the resolver; here we just compute effects of activating all converted.
      if (!t) return null;
      if (kind === 'CL') {
        // Convert to line gems. Use the swapped line gem's direction for all conversions.
        const lineDir = (other.special === Special.LINE_V) ? 'v' : 'h';
        forEachCell((r, c) => {
          const bt = baseTypeOf(board[r][c]);
          if (bt !== t) return;
          // When "activating all converted line gems", each clears its row/col.
          if (lineDir === 'h') {
            for (let cc = 0; cc < COLS; cc++) markCell(r, cc, 'line');
          } else {
            for (let rr = 0; rr < ROWS; rr++) markCell(rr, c, 'line');
          }
          activations.push({ type: 'line', at: { r, c } });
        });
      } else {
        forEachCell((r, c) => {
          const bt = baseTypeOf(board[r][c]);
          if (bt !== t) return;
          clearArea(r, c, 1, 'burst');
          activations.push({ type: 'burst', at: { r, c } });
        });
      }
    } else if (kind === 'CC') {
      forEachCell((r, c) => markCell(r, c, 'color'));
      activations.push({ type: 'color', at: { ...dest } });
    }

    // In special swaps, both swapped gems are consumed; ensure both swap coordinates clear.
    // (Important for color gem consumption and for row/col/area patterns that might not include the origin cell.)
    if (swap && swap.a && swap.b) {
      if (kind.startsWith('C')) {
        markCell(swap.a.r, swap.a.c, 'color');
        markCell(swap.b.r, swap.b.c, 'color');
      } else if (kind === 'BB') {
        markCell(swap.a.r, swap.a.c, 'burst');
        markCell(swap.b.r, swap.b.c, 'burst');
      } else {
        markCell(swap.a.r, swap.a.c, 'line');
        markCell(swap.b.r, swap.b.c, 'line');
      }
    }

    return { kind, clears, activations };
  }

  function resolveSpecialActivations(board, matchedSet) {
    // For specials included in matchedSet, compute additional clears and effect map.
    const effectMap = new Map(); // key -> effect type highest
    const triggers = []; // list of activations for UI

    const rank = { line: 1, burst: 2, color: 3 };
    function mark(r, c, effect) {
      if (!isInBounds(r, c)) return;
      const k = `${r},${c}`;
      const prev = effectMap.get(k);
      if (!prev || rank[effect] > rank[prev]) effectMap.set(k, effect);
    }

    for (const key of matchedSet.keys()) {
      const [r, c] = key.split(',').map(Number);
      const cell = board[r][c];
      if (!cell) continue;
      if (cell.special === Special.LINE_H) {

        triggers.push({ type: 'line', at: { r, c }, dir: 'v' });

        for (let rr = r - 1; rr <= r + 1; rr++) {
          for (let cc = c - 1; cc <= c + 1; cc++) mark(rr, cc, 'burst');

  function computeScoreForStep(boardBeforeClear, matchedSet, effectMap, cascadeMultiplier) {

    // Special-effect points: 10/15/20 per unique gem cleared by effects, highest effect per cell.
    let effectPoints = 0;
    for (const [key, eff] of effectMap.entries()) {
      const [r, c] = key.split(',').map(Number);

      if (eff === 'line') effectPoints += 10;
      else if (eff === 'burst') effectPoints += 15;
      else if (eff === 'color') effectPoints += 20;

    const subtotal = normalPoints + effectPoints;
    const stepPoints = subtotal * cascadeMultiplier;
    return { normalPoints, effectPoints, subtotal, stepPoints };

  function applyClears(board, clearKeys) {

            moves.push({ id: gem.id, from: { r, c }, to: { r: writeRow, c }, distance: writeRow - r });

        spawns.push({ id: gem.id, to: { r, c }, fromRow: -1 - Math.floor(Math.random() * 2) });

  function legalNormalSwapExists(board) {

      // right and down only to avoid duplicates
    });
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {

  function countLegalNormalSwaps(board) {

        const dirs = [{ dr: 0, dc: 1 }, { dr: 1, dc: 0 }];
        for (const d of dirs) {
          const rr = r + d.dr, cc = c + d.dc;
          if (!isInBounds(rr, cc)) continue;
          const other = { r: rr, c: cc };
          const b2 = deepCloneBoard(board);
          swapInBoard(b2, here, other);
          const det = detectMatches(b2);
          if (det.matchedSet.size > 0) count++;
        }
      }
    }
    return count;
  }

    // Legal move: any swap creating normal match OR any adjacent special swap (section 16)
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {

        for (const d of dirs) {

  }

    const dirs = [
      { dr: 0, dc: 1 },
      { dr: 1, dc: 0 },
      { dr: 0, dc: -1 },
      { dr: -1, dc: 0 },
    ];

      for (let c = 0; c < COLS; c++) {
        for (const d of dirs) {
          const rr = r + d.dr, cc = c + d.dc;

          const det = detectMatches(b2);

  }

    storage.setItem(StorageKeys.CONTRAST, s.contrast ? '1' : '0');
  }

  const API = {
    ROWS,
    COLS,
    GemType,
    Special,
    targetForLevel,
    gemTypesForLevel,
    baseTypeOf,
    detectMatches,
    chooseSpecialCreation,
