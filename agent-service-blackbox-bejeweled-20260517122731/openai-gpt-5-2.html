    if (state.settingsFrom === 'menu') {
      showMenu();
    } else if (state.settingsFrom === 'pause') {
      showPause();
    } else {
      showGame();
    }
  }

  function showBest() {
    state.screen = 'best';
    dom.bestOnlyNum.textContent = String(state.best);
    dom.bestScreen.classList.add('show');
    dom.bestScreen.setAttribute('aria-hidden', 'false');
  }

  function hideBest() {
    dom.bestScreen.classList.remove('show');
    dom.bestScreen.setAttribute('aria-hidden', 'true');
    showMenu();
  }

  function showGameOver(finalScore) {
    state.screen = 'gameover';
    dom.board.style.opacity = '0.4';
    dom.finalScoreNum.textContent = String(finalScore);
    dom.bestScoreNum.textContent = String(state.best);
    dom.newBestTag.style.display = 'none';
    dom.gameOverOverlay.classList.add('show');
    dom.gameOverOverlay.setAttribute('aria-hidden', 'false');
    dom.gameOverOverlay.setAttribute('aria-label', `Game Over ${finalScore} ${state.best}`);
  }

  // ---------- Gem rendering ----------
  function gemSvgFor(cell) {
    const t = cell.type;
    const sp = cell.special;
    // Shapes are distinct per color/type.
    // Use a per-gem subtle highlight and outline.
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'gemSvg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('aria-hidden', 'true');

    function defs() {
      const d = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      svg.appendChild(d);
      return d;
    }
    function mkLinear(id, stops) {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
      g.setAttribute('id', id);
      g.setAttribute('x1', '0'); g.setAttribute('y1', '0');
      g.setAttribute('x2', '1'); g.setAttribute('y2', '1');
      for (const s of stops) {
        const st = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
        st.setAttribute('offset', s[0]);
        st.setAttribute('stop-color', s[1]);
        st.setAttribute('stop-opacity', s[2] ?? '1');
        g.appendChild(st);
      }
      return g;
    }

    function polygon(points, fill, cls = '') {
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      p.setAttribute('points', points);
      p.setAttribute('fill', fill);
      if (cls) p.setAttribute('class', cls);
      svg.appendChild(p);
      return p;
    }
    function path(d, fill, cls = '') {
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', d);
      p.setAttribute('fill', fill);
      if (cls) p.setAttribute('class', cls);
      svg.appendChild(p);
      return p;
    }
    function circle(cx, cy, r, fill, cls = '') {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', r);
      c.setAttribute('fill', fill);
      if (cls) c.setAttribute('class', cls);
      svg.appendChild(c);
      return c;
    }
    function rect(x, y, w, h, fill, rx = 10, cls = '') {
      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('x', x); r.setAttribute('y', y); r.setAttribute('width', w); r.setAttribute('height', h);
      r.setAttribute('rx', rx);
      r.setAttribute('fill', fill);
      if (cls) r.setAttribute('class', cls);
      svg.appendChild(r);
      return r;
    }

    // Color palettes
    const pal = {
      red: ['#FF4B5E', '#B1162B'],
      blue: ['#4CC7FF', '#124DAE'],
      green: ['#5CFFB0', '#0E7B48'],
      yellow: ['#FFD44D', '#B66C0A'],
      purple: ['#B77CFF', '#4A1B9D'],
      orange: ['#FF9D47', '#B13F0A'],
      white: ['#F3F7FF', '#8AA6FF'],
    };

    const ds = defs();

    if (sp === Special.COLOR) {
      const g = mkLinear(`prism-${cell.id}`, [
        ['0%', '#7CF2FF', '0.95'],
        ['35%', '#B77CFF', '0.92'],
        ['70%', '#FF74B8', '0.90'],
        ['100%', '#2BFFBF', '0.88'],
      ]);
      ds.appendChild(g);
      circle(50, 50, 40, `url(#prism-${cell.id})`);
      circle(50, 50, 40, 'transparent', 'o').setAttribute('stroke', 'rgba(255,255,255,0.55)');
      circle(38, 35, 10, 'rgba(255,255,255,0.32)', 'shine');
      circle(44, 30, 5, 'rgba(255,255,255,0.24)', 'shine');
    } else {
      const [c0, c1] = pal[t] || pal.red;
      const g = mkLinear(`g-${cell.id}`, [
        ['0%', c0, '0.96'],
        ['100%', c1, '0.95'],
      ]);
      ds.appendChild(g);

      if (t === 'red') {
        polygon('50,10 84,44 50,90 16,44', `url(#g-${cell.id})`);
        polygon('50,18 75,44 50,82 25,44', 'rgba(255,255,255,0.12)');
      } else if (t === 'blue') {
        path('M50 10C70 26 78 44 78 58c0 18-12 32-28 32S22 76 22 58c0-14 8-32 28-48Z', `url(#g-${cell.id})`);
        path('M50 20C62 30 67 41 67 50c0 10-8 18-17 18S33 60 33 50c0-9 5-20 17-30Z', 'rgba(255,255,255,0.10)');
      } else if (t === 'green') {
        polygon('50,10 78,26 78,58 50,90 22,58 22,26', `url(#g-${cell.id})`);
        polygon('50,20 69,31 69,56 50,80 31,56 31,31', 'rgba(255,255,255,0.10)');
      } else if (t === 'yellow') {
        rect(20, 20, 60, 60, `url(#g-${cell.id})`, 10);
        polygon('30,30 70,30 70,70 30,70', 'rgba(255,255,255,0.10)');
        polygon('20,20 80,20 72,28 28,28', 'rgba(255,255,255,0.10)');
      } else if (t === 'purple') {
        polygon('50,10 78,42 50,90 22,42', `url(#g-${cell.id})`);
        polygon('50,24 67,42 50,76 33,42', 'rgba(255,255,255,0.10)');
      } else if (t === 'orange') {
        polygon('50,12 72,20 88,42 80,64 50,88 20,64 12,42 28,20', `url(#g-${cell.id})`);
        polygon('50,24 68,30 78,44 73,58 50,76 27,58 22,44 32,30', 'rgba(255,255,255,0.10)');
      } else if (t === 'white') {
        polygon('50,8 62,28 84,34 68,52 72,76 50,64 28,76 32,52 16,34 38,28', `url(#g-${cell.id})`);
        polygon('50,20 59,34 74,38 63,50 66,66 50,58 34,66 37,50 26,38 41,34', 'rgba(255,255,255,0.10)');
      }

      // Outline
      const outline = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      outline.setAttribute('fill', 'transparent');
      outline.setAttribute('class', 'o');
      // approximate outlines per type
      if (t === 'blue') outline.setAttribute('d', 'M50 10C70 26 78 44 78 58c0 18-12 32-28 32S22 76 22 58c0-14 8-32 28-48Z');
      else if (t === 'yellow') outline.setAttribute('d', 'M30 20h40a10 10 0 0 1 10 10v40a10 10 0 0 1-10 10H30a10 10 0 0 1-10-10V30a10 10 0 0 1 10-10Z');
      else if (t === 'green') outline.setAttribute('d', 'M50 10 78 26 78 58 50 90 22 58 22 26Z');
      else if (t === 'purple') outline.setAttribute('d', 'M50 10 78 42 50 90 22 42Z');
      else if (t === 'orange') outline.setAttribute('d', 'M50 12 72 20 88 42 80 64 50 88 20 64 12 42 28 20Z');
      else if (t === 'white') outline.setAttribute('d', 'M50 8 62 28 84 34 68 52 72 76 50 64 28 76 32 52 16 34 38 28Z');
      else outline.setAttribute('d', 'M50 10 84 44 50 90 16 44Z');
      svg.appendChild(outline);

      // Shine
      circle(38, 30, 9, 'rgba(255,255,255,0.20)', 'shine');
      circle(44, 24, 4, 'rgba(255,255,255,0.18)', 'shine');

      // Special marks
      if (sp === Special.LINE_H || sp === Special.LINE_V) {
        const mark = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        if (sp === Special.LINE_H) {
          mark.setAttribute('x', '18'); mark.setAttribute('y', '46'); mark.setAttribute('width', '64'); mark.setAttribute('height', '8');
        } else {
          mark.setAttribute('x', '46'); mark.setAttribute('y', '18'); mark.setAttribute('width', '8'); mark.setAttribute('height', '64');
        }
        mark.setAttribute('rx', '4');
        mark.setAttribute('fill', 'rgba(255,255,255,0.92)');
        svg.appendChild(mark);
      } else if (sp === Special.BURST) {
        const star = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        star.setAttribute('d', 'M50 24l4.5 12 12 4.5-12 4.5-4.5 12-4.5-12-12-4.5 12-4.5L50 24Z');
        star.setAttribute('fill', 'rgba(255,255,255,0.92)');
        svg.appendChild(star);
      }
    }
    return svg;
  }

  function gemAriaLabelFor(cell, r, c, focused, selected) {
    const row = r + 1;
    const col = c + 1;
    let gemType = cell.special === Special.COLOR ? 'color' : cell.type;
    let special = cell.special;
    return `row ${row} column ${col} ${gemType} ${special} ${focused ? 'focused' : 'unfocused'} ${selected ? 'selected' : 'unselected'}`;
  }

  function cellPx() {
    const br = dom.board.getBoundingClientRect();
    return br.width / 8;
  }

  function posFor(r, c) {
    const s = cellPx();
    return { x: c * s, y: r * s, s };
  }

  function clearBoardDom() {
    dom.gemLayer.innerHTML = '';
    state.gemEls.clear();
  }

  function renderBoard() {
    // Ensure cursor exists.
    dom.cursor.style.display = 'block';

    // Create/update gem elements.
    const seen = new Set();
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = state.board[r][c];
        if (!cell) continue;
        seen.add(cell.id);
        let el = state.gemEls.get(cell.id);
        if (!el) {
          el = document.createElement('div');
          el.className = 'gem';
          el.dataset.gemId = cell.id;
          dom.gemLayer.appendChild(el);
          state.gemEls.set(cell.id, el);
        }
        el.innerHTML = '';
        el.appendChild(gemSvgFor(cell));
        el.id = `cell-${r}-${c}`;
        el.setAttribute('role', 'gridcell');
        el.setAttribute('aria-label', gemAriaLabelFor(cell, r, c, (state.cursor.r === r && state.cursor.c === c), (state.selected && state.selected.r === r && state.selected.c === c)));
        el.setAttribute('aria-selected', state.selected && state.selected.r === r && state.selected.c === c ? 'true' : 'false');
        const p = posFor(r, c);
        el.style.left = `${p.x}px`;
        el.style.top = `${p.y}px`;
        el.style.opacity = '1';
        el.style.transform = 'translate(0px, 0px)';
        el.classList.toggle('selected', !!(state.selected && state.selected.r === r && state.selected.c === c));
        el.style.pointerEvents = state.screen === 'playing' ? 'auto' : 'none';
      }
    }
    // Remove old gems
    for (const [id, el] of Array.from(state.gemEls.entries())) {
      if (!seen.has(id)) {
        el.remove();
        state.gemEls.delete(id);
      }
    }

    updateCursor();
    dom.board.setAttribute('aria-activedescendant', `cell-${state.cursor.r}-${state.cursor.c}`);
  }

  function updateCursor() {
    const p = posFor(state.cursor.r, state.cursor.c);
    dom.cursor.style.left = `${p.x}px`;
    dom.cursor.style.top = `${p.y}px`;
  }

  // ---------- Hint visuals ----------
  let hintAnims = [];
  function clearHint() {
    state.hint = null;
    for (const a of hintAnims) {
      try { a.cancel(); } catch {}
    }
    hintAnims = [];
    // remove any hint styles
    for (const el of state.gemEls.values()) el.classList.remove('hintA', 'hintB');
  }

  function showHint(move) {
    clearHint();
    if (!move) return;
    state.hint = move;
    const a = document.getElementById(`cell-${move.from.r}-${move.from.c}`);
    const b = document.getElementById(`cell-${move.to.r}-${move.to.c}`);
    if (!a || !b) return;

    a.classList.add('hintA');
    b.classList.add('hintB');
    const glow = [
      { filter: 'brightness(1)', offset: 0 },
      { filter: 'brightness(1.25)', offset: 0.18 },
      { filter: 'brightness(1)', offset: 0.34 },
      { filter: 'brightness(1.25)', offset: 0.52 },
      { filter: 'brightness(1)', offset: 0.70 },
      { filter: 'brightness(1)', offset: 1 },
    ];
    hintAnims.push(playAnim(a, glow, { duration: 2000, easing: 'ease-in-out' }).anim);
    hintAnims.push(playAnim(b, glow, { duration: 2000, easing: 'ease-in-out' }).anim);

    if (state.motion) {
      const dx = move.to.c - move.from.c;
      const dy = move.to.r - move.from.r;
      const nudge = 0.12 * cellPx();
      hintAnims.push(playAnim(a, [
        { transform: 'translate(0px,0px)', offset: 0 },
        { transform: `translate(${dx * nudge}px,${dy * nudge}px)`, offset: 0.18 },
        { transform: 'translate(0px,0px)', offset: 0.34 },
        { transform: `translate(${dx * nudge}px,${dy * nudge}px)`, offset: 0.52 },
        { transform: 'translate(0px,0px)', offset: 0.70 },
        { transform: 'translate(0px,0px)', offset: 1 },
      ], { duration: 2000, easing: 'ease-in-out' }).anim);
    }

    // Auto clear after 2s (animation end).
    // Use one of the animations we already started.
    const animToWait = hintAnims[0];
    if (animToWait && animToWait.finished) animToWait.finished.then(() => clearHint());
    else setTimeout(() => clearHint(), 2000);
  }

  // ---------- Multiplier / score popup ----------
  function showMultiplier(n) {
    dom.multiplier.textContent = `x${n}`;
    playAnim(dom.multiplier, [
      { opacity: 0, transform: 'translateX(-50%) translateY(6px)' },
      { opacity: 1, transform: 'translateX(-50%) translateY(0px)', offset: 0.15 },
      { opacity: 1, transform: 'translateX(-50%) translateY(0px)', offset: 0.80 },
      { opacity: 0, transform: 'translateX(-50%) translateY(-6px)' },
    ], { duration: 500, easing: 'ease-out' });
  }

  function showScorePopup(points, clearKeys) {
    if (points <= 0) return;
    // Center over cleared cells.
    let sumX = 0, sumY = 0, n = 0;
    for (const key of clearKeys) {
      const [r, c] = key.split(',').map(Number);
      const p = posFor(r, c);
      sumX += p.x + p.s / 2;
      sumY += p.y + p.s / 2;
      n++;
    }
    if (!n) return;
    const x = sumX / n;
    const y = sumY / n;
    const pop = document.createElement('div');
    pop.className = 'scorePopup';
    pop.textContent = `+${points}`;
    // Place relative to boardWrap
    const wrap = dom.board.parentElement;
    pop.style.left = `${x}px`;
    pop.style.top = `${y}px`;
    wrap.appendChild(pop);
    playAnim(pop, [
      { opacity: 0, transform: 'translate(-50%,-50%) translateY(8px) scale(0.98)' },
      { opacity: 1, transform: 'translate(-50%,-50%) translateY(0px) scale(1)', offset: 0.12 },
      { opacity: 1, transform: 'translate(-50%,-50%) translateY(-6px) scale(1)', offset: 0.75 },
      { opacity: 0, transform: 'translate(-50%,-50%) translateY(-14px) scale(1.02)' },
    ], { duration: 700, easing: 'ease-out' }).finished.then(() => pop.remove());
  }

  // ---------- Input helpers ----------
  function isStable() {
    return state.screen === 'playing' && !state.resolving && !pausedByUser && !pausedByVisibility;
  }

  function resetIdle() { state.idleMs = 0; }

  function adjacent(a, b) {
    return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
  }

  function setSelected(pos) {
    state.selected = pos ? { ...pos } : null;
    renderBoard();
  }

  function setCursor(pos) {
    state.cursor = { r: Math.max(0, Math.min(ROWS - 1, pos.r)), c: Math.max(0, Math.min(COLS - 1, pos.c)) };
    renderBoard();
  }

  // ---------- Resolution / animations ----------
  async function animateSwap(from, to) {
    const a = document.getElementById(`cell-${from.r}-${from.c}`);
    const b = document.getElementById(`cell-${to.r}-${to.c}`);
    if (!a || !b) return;
    const p1 = posFor(from.r, from.c);
    const p2 = posFor(to.r, to.c);
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const dur = motionDur(120, 80);
    audio.slide();
    const aa = playAnim(a, [{ transform: 'translate(0px,0px)' }, { transform: `translate(${dx}px,${dy}px)` }], { duration: dur, easing: 'ease-in-out' });
    const bb = playAnim(b, [{ transform: 'translate(0px,0px)' }, { transform: `translate(${-dx}px,${-dy}px)` }], { duration: dur, easing: 'ease-in-out' });
    await Promise.all([aa.finished, bb.finished]);
  }

  async function animateInvalid(selectedPos) {
    const el = document.getElementById(`cell-${selectedPos.r}-${selectedPos.c}`);
    if (!el) return;
    audio.dull();
    if (state.motion) {
      const n = 0.12 * cellPx();
      const { finished } = playAnim(el, [
        { transform: 'translate(0px,0px)' },
        { transform: `translate(${n}px,0px)`, offset: 0.33 },
        { transform: `translate(${-n}px,0px)`, offset: 0.66 },
        { transform: 'translate(0px,0px)' },
      ], { duration: 180, easing: 'ease-in-out' });
      await finished;
    } else {
      const { finished } = playAnim(el, [
        { opacity: 1 },
        { opacity: 0.55, offset: 0.5 },
        { opacity: 1 },
      ], { duration: 80, easing: 'ease-out' });
      await finished;
    }
  }

  async function animateBrighten(keys) {
    const dur = motionDur(120, 80);
    const promises = [];
    for (const key of keys) {
      const [r, c] = key.split(',').map(Number);
      const el = document.getElementById(`cell-${r}-${c}`);
      if (!el) continue;
      promises.push(playAnim(el, [
        { filter: 'brightness(1)' },
        { filter: 'brightness(1.25)' },
      ], { duration: dur, easing: 'ease-out', fill: 'forwards' }).finished);
    }
    await Promise.all(promises);
    // reset filter after
    for (const key of keys) {
      const [r, c] = key.split(',').map(Number);
      const el = document.getElementById(`cell-${r}-${c}`);
      if (el) el.style.filter = '';
    }
  }

  async function animateClear(keys) {
    const dur = motionDur(180, 80);
    const promises = [];
    for (const key of keys) {
      const [r, c] = key.split(',').map(Number);
      const el = document.getElementById(`cell-${r}-${c}`);
      if (!el) continue;
      if (state.motion) {
        promises.push(playAnim(el, [
          { opacity: 1, transform: 'translate(0px,0px) scale(1)' },
          { opacity: 0, transform: 'translate(0px,0px) scale(0.82)' },
        ], { duration: dur, easing: 'ease-in', fill: 'forwards' }).finished);
      } else {
        promises.push(playAnim(el, [
          { opacity: 1 },
          { opacity: 0 },
        ], { duration: dur, easing: 'ease-out', fill: 'forwards' }).finished);
      }
    }
    await Promise.all(promises);
  }

  async function animateLineFlash(effectMap) {
    const dur = motionDur(120, 80);
    // Determine rows/cols fully hit by line effect (8 cells marked line or higher).
    const rowCount = new Array(ROWS).fill(0);
    const colCount = new Array(COLS).fill(0);
    if (effectMap) {
      for (const [k, eff] of effectMap.entries()) {
        if (eff !== 'line') continue;
        const [r, c] = k.split(',').map(Number);
        rowCount[r]++; colCount[c]++;
      }
    }
    const overlays = [];
    const s = cellPx();
    const makeStrip = (x, y, w, h) => {
      const d = document.createElement('div');
      d.style.position = 'absolute';
      d.style.left = `${x}px`;
      d.style.top = `${y}px`;
      d.style.width = `${w}px`;
      d.style.height = `${h}px`;
      d.style.background = 'rgba(255,255,255,0.00)';
      d.style.pointerEvents = 'none';
      d.style.borderRadius = '12px';
      dom.board.appendChild(d);
      overlays.push(d);
      return d;
    };
    for (let r = 0; r < ROWS; r++) {
      if (rowCount[r] >= COLS) makeStrip(0, r * s, s * COLS, s);
    }
    for (let c = 0; c < COLS; c++) {
      if (colCount[c] >= ROWS) makeStrip(c * s, 0, s, s * ROWS);
    }
    if (!overlays.length) return;
    await Promise.all(overlays.map(o => playAnim(o, [
      { background: 'rgba(255,255,255,0.00)' },
      { background: 'rgba(255,255,255,0.18)' },
      { background: 'rgba(255,255,255,0.00)' },
    ], { duration: dur, easing: 'ease-out' }).finished));
    overlays.forEach(o => o.remove());
  }

  async function animateBurstGlow(effectMap) {
    const dur = motionDur(120, 80);
    // Build connected components of burst-hit cells to approximate glows per affected area.
    const burstKeys = [];
    if (effectMap) {
      for (const [k, eff] of effectMap.entries()) if (eff === 'burst') burstKeys.push(k);
    }
    if (!burstKeys.length) return;
    const set = new Set(burstKeys);
    const seen = new Set();
    const comps = [];
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for (const k0 of burstKeys) {
      if (seen.has(k0)) continue;
      const [r0, c0] = k0.split(',').map(Number);
      const q = [{ r: r0, c: c0 }];
      seen.add(k0);
      let minR = r0, minC = c0, maxR = r0, maxC = c0;
      while (q.length) {
        const cur = q.pop();
        minR = Math.min(minR, cur.r); minC = Math.min(minC, cur.c);
        maxR = Math.max(maxR, cur.r); maxC = Math.max(maxC, cur.c);
        for (const [dr, dc] of dirs) {
          const rr = cur.r + dr, cc = cur.c + dc;
          const kk = `${rr},${cc}`;
          if (!set.has(kk) || seen.has(kk)) continue;
          seen.add(kk);
          q.push({ r: rr, c: cc });
        }
      }
      comps.push({ minR, minC, maxR, maxC });
    }
    const s = cellPx();
    const overlays = comps.map(comp => {
      const overlay = document.createElement('div');
      overlay.style.position = 'absolute';
      overlay.style.left = `${comp.minC * s}px`;
      overlay.style.top = `${comp.minR * s}px`;
      overlay.style.width = `${(comp.maxC - comp.minC + 1) * s}px`;
      overlay.style.height = `${(comp.maxR - comp.minR + 1) * s}px`;
      overlay.style.pointerEvents = 'none';
      overlay.style.borderRadius = '14px';
      dom.board.appendChild(overlay);
      return overlay;
    });
    await Promise.all(overlays.map(overlay => playAnim(overlay, [
      { boxShadow: '0 0 0px rgba(183,124,255,0.00)', background: 'rgba(183,124,255,0.00)' },
      { boxShadow: '0 0 18px rgba(183,124,255,0.35)', background: 'rgba(183,124,255,0.12)' },
      { boxShadow: '0 0 0px rgba(183,124,255,0.00)', background: 'rgba(183,124,255,0.00)' },
    ], { duration: dur, easing: 'ease-out' }).finished));
    overlays.forEach(o => o.remove());
  }

  async function animateFallAndSpawn(moves, spawns) {
    // moves: from computeFall with gem ids already moved in model
    // spawns: from spawnNewGems with gem objects now in model
    const promises = [];

    // falling existing gems: animate translateY from old to new
    for (const mv of moves) {
      const el = state.gemEls.get(mv.id);
      if (!el) continue;
      const pFrom = posFor(mv.from.r, mv.from.c);
      const pTo = posFor(mv.to.r, mv.to.c);
      el.id = `cell-${mv.to.r}-${mv.to.c}`;
      el.style.left = `${pTo.x}px`;
      el.style.top = `${pTo.y}px`;
      const dy = pFrom.y - pTo.y;
      const dist = mv.distance;
      const dur = state.motion ? (180 + 40 * Math.max(0, dist - 1)) : 80;
      promises.push(playAnim(el, [
        { transform: `translate(0px,${dy}px)` },
        { transform: 'translate(0px,0px)' },
      ], { duration: dur, easing: 'cubic-bezier(.2,.85,.2,1)' }).finished);
    }

    // spawned gems: create DOM elements above and animate down
    for (const sp of spawns) {
      const r = sp.to.r, c = sp.to.c;
      const cell = state.board[r][c];
      const el = document.createElement('div');
      el.className = 'gem';
      el.dataset.gemId = cell.id;
      el.appendChild(gemSvgFor(cell));
      el.setAttribute('role', 'gridcell');
      el.setAttribute('aria-label', gemAriaLabelFor(cell, r, c, false, false));
      state.gemEls.set(cell.id, el);
      dom.gemLayer.appendChild(el);

      const pTo = posFor(r, c);
      const pFromY = pTo.y - (Math.abs(sp.fromRow) + r + 1) * pTo.s;
      el.style.left = `${pTo.x}px`;
      el.style.top = `${pTo.y}px`;
      el.id = `cell-${r}-${c}`;
      const dist = (pTo.y - pFromY) / pTo.s;
      const dur = state.motion ? (180 + 40 * Math.max(0, dist - 1)) : 80;
      promises.push(playAnim(el, [
        { transform: `translate(0px,${pFromY - pTo.y}px)` },
        { transform: 'translate(0px,0px)' },
      ], { duration: dur, easing: 'cubic-bezier(.2,.85,.2,1)' }).finished);
    }

    await Promise.all(promises);
  }

  async function flashMeterOnce() {
    const dur = motionDur(180, 80);
    dom.meter.classList.add('flash');
    const { finished } = playAnim(dom.meter, [
      { filter: 'brightness(1)' },
      { filter: 'brightness(1.35)' },
      { filter: 'brightness(1)' },
    ], { duration: dur, easing: 'ease-out' });
    await finished;
    dom.meter.classList.remove('flash');
    dom.meter.style.filter = '';
  }

  function applyLevelProgress(points) {
    state.progress += points;
    let leveled = 0;
    while (state.progress >= targetForLevel(state.level)) {
      state.progress -= targetForLevel(state.level);
      state.level += 1;
      leveled++;
    }
    if (leveled > 0) {
      // Flash once per level (sequential).
      (async () => {
        for (let i = 0; i < leveled; i++) {
          audio.rise();
          await flashMeterOnce();
        }
      })();
    }
  }

  function applyBest(finalScore) {
    let isNew = false;
    if (finalScore > state.best) {
      state.best = finalScore;
      persist();
      isNew = true;
    }
    dom.bestOnlyNum.textContent = String(state.best);
    dom.bestScoreNum.textContent = String(state.best);
    dom.newBestTag.style.display = isNew ? 'block' : 'none';
  }

  function clearSelectionAndHintOnAction() {
    clearHint();
  }

  async function resolveClearStep({ movedDest, specialSwapEffectMap = null, specialSwapActivations = [] }, cascadeMultiplier) {
    // Compute matches
    const det = detectMatches(state.board);
    const matchedSetOriginal = det.matchedSet; // Map

    // Special creation based on matches
    const specialCreate = chooseSpecialCreation(state.board, det, movedDest);
    const createdKey = specialCreate ? `${specialCreate.at.r},${specialCreate.at.c}` : null;

    // Matched keys for clearing (exclude created special position if any)
    const matchClearKeys = new Set();
    for (const key of matchedSetOriginal.keys()) {
      if (createdKey && key === createdKey) continue;
      matchClearKeys.add(key);
    }

    // Special activations from matched (existing specials only, not newly created special)
    const matchedForActivation = new Map();
    for (const key of matchClearKeys) matchedForActivation.set(key, true);
    const activ = resolveSpecialActivations(state.board, matchedForActivation);

    // Merge effect maps: special swap effects + activations.
    const effectMap = new Map();
    const rank = { line: 1, burst: 2, color: 3 };
    function mergeEffectMap(m) {
      if (!m) return;
      for (const [k, eff] of m.entries()) {
        const prev = effectMap.get(k);
        if (!prev || rank[eff] > rank[prev]) effectMap.set(k, eff);
      }
    }
    mergeEffectMap(specialSwapEffectMap);
    mergeEffectMap(activ.effectMap);

    // Union of clears: matchedClearKeys + effectMap keys
    const clearKeys = new Set(matchClearKeys);
    for (const k of effectMap.keys()) clearKeys.add(k);

    if (clearKeys.size === 0 && (!specialSwapEffectMap || specialSwapEffectMap.size === 0)) {
      return { didClear: false, clearKeys };
    }

    // Visual pre-effects for line/burst
    const hasLine = Array.from(effectMap.values()).some(v => v === 'line');
    const hasBurst = Array.from(effectMap.values()).some(v => v === 'burst');
    if (hasLine) await animateLineFlash(effectMap);
    if (hasBurst) await animateBurstGlow(effectMap);

    // Brighten matched gems (only matched, not effect-only hits)
    if (matchClearKeys.size > 0) await animateBrighten(matchClearKeys);

    // Compute score for step
    const boardBefore = state.board.map(row => row.map(cell => (cell ? { ...cell } : null)));
    const scoreInfo = computeScoreForStep(boardBefore, matchedSetOriginal, effectMap, cascadeMultiplier);
    const stepPoints = scoreInfo.stepPoints;

    // Create special gem (after scoring snapshot and after we computed activation, so it doesn't auto-activate this step).
    if (specialCreate) {
      const r = specialCreate.at.r, c = specialCreate.at.c;
      const cell = state.board[r][c];
      if (cell) {
        if (specialCreate.kind === Special.COLOR) {
          cell.special = Special.COLOR;
        } else {
          cell.special = specialCreate.kind;
          cell.type = specialCreate.baseType;
        }
        audio.sparkle();
        renderBoard();
      }
    }

    // Clear animation
    await animateClear(clearKeys);

    // Apply clears to model
    applyClears(state.board, clearKeys);
    // Remove cleared DOM elements
    for (const key of clearKeys) {
      const [r, c] = key.split(',').map(Number);
      const el = document.getElementById(`cell-${r}-${c}`);
      if (el) {
        const gid = el.dataset.gemId;
        el.remove();
        if (gid) state.gemEls.delete(gid);
      }
    }

    // Update score and progress
    state.score += stepPoints;
    applyLevelProgress(stepPoints);
    updateHud();
    showScorePopup(stepPoints, clearKeys);

    // Falling + spawning
    const moves = computeFall(state.board);
    const spawns = spawnNewGems(state.board, state.level, idGen);
    // Re-render board now for moved IDs? We'll animate with moves/spawns.
    renderBoard();
    await animateFallAndSpawn(moves, spawns);
    renderBoard();

    return { didClear: true, clearKeys };
  }

  async function resolveFromCurrentBoard({ movedDest, specialSwapEffectMap = null } = {}) {
    let cascadeMultiplier = 1;
    while (true) {
      if (cascadeMultiplier >= 2) showMultiplier(cascadeMultiplier);
      const step = await resolveClearStep({ movedDest, specialSwapEffectMap }, cascadeMultiplier);
      specialSwapEffectMap = null; // only apply in first step
      movedDest = null;
      if (!step.didClear) break;
      // Detect cascades after fall/spawn complete
      const det = detectMatches(state.board);
      if (det.matchedSet.size > 0) {
        cascadeMultiplier += 1;
        audio.chime(cascadeMultiplier <= 6 ? (1 + (cascadeMultiplier - 1) * 0.08) : 1.4);
        continue;
      }
      break;
    }

    // Game over check after full resolution
    if (!anyLegalMove(state.board)) {
      audio.fall();
      applyBest(state.score);
      showGameOver(state.score);
    }
  }

  async function attemptSwap(from, to) {
    resetIdle();
    if (state.resolving || state.screen !== 'playing') return;
    if (!adjacent(from, to)) {
      setSelected({ ...to });
      state.cursor = { ...to };
      updateCursor();
      return;
    }

    clearSelectionAndHintOnAction();

    // Pre-classify: special swap?
    const cellA = state.board[from.r][from.c];
    const cellB = state.board[to.r][to.c];
    if (!cellA || !cellB) return;

    // Special swap rule check
    const specialKind = classifySpecialSwap(cellA, cellB);
    const specialInfo = specialKind ? computeSpecialSwapClears(state.board, { a: from, b: to }, to) : null;

    // Normal swap validity check (simulate)
    let isNormalValid = false;
    if (!specialInfo) {
      const clone = state.board.map(row => row.map(cell => (cell ? { ...cell } : null)));
      const tmp = clone[from.r][from.c];
      clone[from.r][from.c] = clone[to.r][to.c];
      clone[to.r][to.c] = tmp;
      const det = detectMatches(clone);
      isNormalValid = det.matchedSet.size > 0;
    }

    if (!specialInfo && !isNormalValid) {
      state.resolving = true;
      await animateInvalid(from);
      state.resolving = false;
      // Keep selection as per spec
      setSelected(from);
      return;
    }

    state.resolving = true;

    // Perform swap animation and apply swap to model/DOM
    await animateSwap(from, to);
    const tmp = state.board[from.r][from.c];
    state.board[from.r][from.c] = state.board[to.r][to.c];
    state.board[to.r][to.c] = tmp;
    // Update selection: clear selection after a valid swap resolution
    state.selected = null;
    state.cursor = { ...to };
    renderBoard();

    if (specialInfo) {
      audio.burst();
      await resolveFromCurrentBoard({ movedDest: to, specialSwapEffectMap: specialInfo.clears });
    } else {
      audio.chime(1);
      await resolveFromCurrentBoard({ movedDest: to });
    }

    state.resolving = false;
  }

  // ---------- Start / restart ----------
  function newGame() {
    state.score = 0;
    state.level = 1;
    state.progress = 0;
    state.idleMs = 0;
    state.selected = null;
    state.cursor = { r: 0, c: 0 };
    state.resolving = false;
    clearHint();
    // Generate board with checks.
    state.board = generateStartingBoard(idGen, 1);
    clearBoardDom();
    renderBoard();
    updateHud();
    showGame();
  }

  function playAgain() {
    dom.gameOverOverlay.classList.remove('show');
    dom.gameOverOverlay.setAttribute('aria-hidden', 'true');
    newGame();
  }

  // ---------- Settings UI ----------
  function renderSettingsButtons() {
    setBtnIcon(dom.soundBtn, state.sound ? 'soundOn' : 'soundOff');
    setBtnIcon(dom.motionBtn, 'motion');
    setBtnIcon(dom.idleHintBtn, 'idleHint');
    setBtnIcon(dom.contrastBtn, 'contrast');
    setBtnIcon(dom.trashBtn, 'trash');
    setBtnIcon(dom.settingsHomeBtn, 'home');
    setBtnIcon(dom.confirmResetBtn, 'check');
    setBtnIcon(dom.cancelResetBtn, 'x');

    dom.soundBtn.classList.toggle('on', state.sound);
    dom.soundBtn.classList.toggle('off', !state.sound);
    dom.motionBtn.classList.toggle('on', state.motion);
    dom.motionBtn.classList.toggle('off', !state.motion);
    dom.idleHintBtn.classList.toggle('on', state.idleHint);
    dom.idleHintBtn.classList.toggle('off', !state.idleHint);
    dom.contrastBtn.classList.toggle('on', state.contrast);
    dom.contrastBtn.classList.toggle('off', !state.contrast);
  }

  // ---------- Event wiring ----------
  // Unlock audio on first user interaction
  window.addEventListener('pointerdown', userInteracted, { once: true, passive: true });
  window.addEventListener('keydown', userInteracted, { once: true });

  dom.startBtn.addEventListener('click', () => {
    resetIdle();
    newGame();
  });
  dom.menuBestBtn.addEventListener('click', () => {
    resetIdle();
    dom.menuScreen.classList.remove('show');
    dom.menuScreen.setAttribute('aria-hidden', 'true');
    showBest();
  });
  dom.menuSettingsBtn.addEventListener('click', () => {
    resetIdle();
    showSettings('menu');
  });

  dom.bestHomeBtn.addEventListener('click', () => {
    resetIdle();
    hideBest();
  });

  dom.pauseBtn.addEventListener('click', () => {
    resetIdle();
    if (state.screen !== 'playing') return;
    clearHint();
    showPause();
  });

  dom.resumeBtn.addEventListener('click', () => {
    resetIdle();
    if (state.screen === 'paused') hidePause();
  });
  dom.restartBtn.addEventListener('click', () => {
    resetIdle();
    dom.pauseOverlay.classList.remove('show');
    dom.pauseOverlay.setAttribute('aria-hidden', 'true');
    pausedByUser = false;
    if (!pausedByVisibility) resumeAllAnimations();
    newGame();
  });
  dom.pauseSettingsBtn.addEventListener('click', () => {
    resetIdle();
    dom.pauseOverlay.classList.remove('show');
    dom.pauseOverlay.setAttribute('aria-hidden', 'true');
    showSettings('pause');
  });
  dom.pauseMenuBtn.addEventListener('click', () => {
    resetIdle();
    pausedByUser = false;
    if (!pausedByVisibility) resumeAllAnimations();
    showMenu();
  });

  dom.gameSettingsBtn.addEventListener('click', () => {
    resetIdle();
    showSettings('game');
  });

  dom.settingsHomeBtn.addEventListener('click', () => {
    resetIdle();
    hideSettings();
  });

  dom.soundBtn.addEventListener('click', () => {
    resetIdle();
    state.sound = !state.sound;
    audio.setEnabled(state.sound);
    persist();
    renderSettingsButtons();
  });
  dom.motionBtn.addEventListener('click', () => {
    resetIdle();
    state.motion = !state.motion;
    setMotionVars();
    persist();
    renderSettingsButtons();
  });
  dom.idleHintBtn.addEventListener('click', () => {
    resetIdle();
    state.idleHint = !state.idleHint;
    persist();
    renderSettingsButtons();
  });
  dom.contrastBtn.addEventListener('click', () => {
    resetIdle();
    state.contrast = !state.contrast;
    setContrastVars();
    persist();
    renderSettingsButtons();
  });
  dom.trashBtn.addEventListener('click', () => {
    resetIdle();
    dom.confirmRow.classList.add('show');
    dom.confirmRow.setAttribute('aria-hidden', 'false');
  });
  dom.cancelResetBtn.addEventListener('click', () => {
    resetIdle();
    dom.confirmRow.classList.remove('show');
    dom.confirmRow.setAttribute('aria-hidden', 'true');
  });
  dom.confirmResetBtn.addEventListener('click', () => {
    resetIdle();
    state.best = 0;
    persist();
    dom.bestOnlyNum.textContent = String(state.best);
    dom.bestScoreNum.textContent = String(state.best);
    dom.confirmRow.classList.remove('show');
    dom.confirmRow.setAttribute('aria-hidden', 'true');
  });

  dom.playAgainBtn.addEventListener('click', () => {
    resetIdle();
    playAgain();
  });
  dom.goMenuBtn.addEventListener('click', () => {
    resetIdle();
    dom.gameOverOverlay.classList.remove('show');
    dom.gameOverOverlay.setAttribute('aria-hidden', 'true');
    showMenu();
  });

  dom.hintBtn.addEventListener('click', () => {
    resetIdle();
    if (!isStable()) return;
    const move = findHintMove(state.board);
    if (move) showHint(move);
  });

  // Board pointer input: click select / drag swap.
  let drag = null;
  dom.gemLayer.addEventListener('pointerdown', (ev) => {
    resetIdle();
    if (!isStable()) return;
    const target = ev.target.closest('.gem');
    if (!target) return;
    ev.preventDefault();
    clearHint();
    dom.board.focus({ preventScroll: true });
    const id = target.id;
    const m = id.match(/^cell-(\d+)-(\d+)$/);
    if (!m) return;
    const r = Number(m[1]), c = Number(m[2]);
    drag = { startX: ev.clientX, startY: ev.clientY, pos: { r, c }, moved: false };
    target.setPointerCapture(ev.pointerId);
    // Click selection behavior
    if (!state.selected) setSelected({ r, c });
    else {
      const sel = state.selected;
      if (sel.r === r && sel.c === c) setSelected(null);
      else if (adjacent(sel, { r, c })) {
        // attempt swap using selection as moved gem
        attemptSwap(sel, { r, c });
      } else {
        setSelected({ r, c });
      }
    }
    state.cursor = { r, c };
    updateCursor();
    audio.click();
  }, { passive: false });

  dom.gemLayer.addEventListener('pointermove', (ev) => {
    if (!drag || !isStable()) return;
    const s = cellPx();
    const dx = ev.clientX - drag.startX;
    const dy = ev.clientY - drag.startY;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    const thresh = 0.25 * s;
    if (drag.moved) return;
    if (adx < thresh && ady < thresh) return;
    drag.moved = true;
    // Determine direction
    let dir = null;
    if (adx >= ady) dir = dx > 0 ? { dr: 0, dc: 1 } : { dr: 0, dc: -1 };
    else dir = dy > 0 ? { dr: 1, dc: 0 } : { dr: -1, dc: 0 };
    const from = drag.pos;
    const to = { r: from.r + dir.dr, c: from.c + dir.dc };
    if (!isInBounds(to.r, to.c)) return;
    // Attempt swap from dragged gem (moved gem is from)
    setSelected(from);
    attemptSwap(from, to);
  }, { passive: true });

  window.addEventListener('pointerup', () => { drag = null; }, { passive: true });
  window.addEventListener('pointercancel', () => { drag = null; }, { passive: true });

  // Keyboard
  dom.board.addEventListener('keydown', (ev) => {
    resetIdle();
    if (state.screen === 'paused') {
      if (ev.key.toLowerCase() === 'p') {
        ev.preventDefault();
        hidePause();
      }
      return;
    }
    if (state.screen !== 'playing') return;

    if (ev.key.toLowerCase() === 'p') {
      ev.preventDefault();
      showPause();
      clearHint();
      return;
    }
    if (ev.key.toLowerCase() === 'h') {
      ev.preventDefault();
      if (isStable()) {
        const move = findHintMove(state.board);
        if (move) showHint(move);
      }
      return;
    }
    if (ev.key === 'Escape') {
      ev.preventDefault();
      setSelected(null);
      clearHint();
      return;
    }

    const arrow = new Map([
      ['ArrowUp', { dr: -1, dc: 0 }],
      ['ArrowDown', { dr: 1, dc: 0 }],
      ['ArrowLeft', { dr: 0, dc: -1 }],
      ['ArrowRight', { dr: 0, dc: 1 }],
    ]);

    if (ev.key === 'Enter' || ev.key === ' ') {
      ev.preventDefault();
      clearHint();
      const cur = { ...state.cursor };
      if (state.selected && state.selected.r === cur.r && state.selected.c === cur.c) setSelected(null);
      else setSelected(cur);
      audio.click();
      return;
    }

    const d = arrow.get(ev.key);
    if (!d) return;
    ev.preventDefault();
    clearHint();
    if (state.selected) {
      const from = { ...state.selected };
      const to = { r: from.r + d.dr, c: from.c + d.dc };
      if (!isInBounds(to.r, to.c)) return;
      attemptSwap(from, to);
    } else {
      const next = { r: state.cursor.r + d.dr, c: state.cursor.c + d.dc };
      setCursor(next);
    }
  });

  // Ensure pause/hint hotkeys work even if focus isn't on the board (e.g., after pointer interactions).
  window.addEventListener('keydown', (ev) => {
    if (state.screen !== 'playing') return;
    if (state.resolving) return;
    if (ev.key.toLowerCase() === 'p') {
      ev.preventDefault();
      clearHint();
      showPause();
    } else if (ev.key.toLowerCase() === 'h') {
      ev.preventDefault();
      if (isStable()) {
        const move = findHintMove(state.board);
        if (move) showHint(move);
      }
    }
  }, true);

  // Idle hint timer
  setInterval(() => {
    if (state.screen !== 'playing') return;
    if (state.resolving) return;
    if (pausedByUser || pausedByVisibility) return;
    if (!state.idleHint) return;
    state.idleMs += 250;
    if (state.idleMs >= 8000) {
      state.idleMs = 0;
      if (isStable()) {
        const move = findHintMove(state.board);
        if (move) showHint(move);
      }
    }
  }, 250);

  // Any pointer movement counts as input for idle timer purposes.
  window.addEventListener('pointermove', () => {
    if (state.screen !== 'playing') return;
    resetIdle();
  }, { passive: true });

  // Load settings
  const loaded = loadPersistedSettings(localStorage);
  state.best = loaded.best;
  state.sound = loaded.sound;
  state.motion = loaded.motion;
  state.idleHint = loaded.idleHint;
  state.contrast = loaded.contrast;
  audio.setEnabled(state.sound);
  setMotionVars();
  setContrastVars();

  // Initialize settings buttons icons
  renderSettingsButtons();

  // Ensure menu best number stays current
  dom.bestOnlyNum.textContent = String(state.best);

  // Prevent accidental scroll with arrow keys when focused on board
  dom.board.addEventListener('focus', () => {
    // Cursor starts at row 1 col 1 when focus enters
    state.cursor = { r: 0, c: 0 };
    renderBoard();
  });

  // Non-visible debug hooks (useful for automated/manual testing).
  window.__bb = {
    getState: () => ({
      screen: state.screen,
      score: state.score,
      level: state.level,
      progress: state.progress,
      best: state.best,
      motion: state.motion,
      sound: state.sound,
      idleHint: state.idleHint,
      contrast: state.contrast,
    }),
    getBoard: () => state.board,
    hint: () => findHintMove(state.board),
    newGame,
  };

})();

</script>
