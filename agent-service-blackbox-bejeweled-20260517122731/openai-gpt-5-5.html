function num(v,d){v=Number(v);return Number.isFinite(v)?v:d}function getBool(k,d){let v=localStorage.getItem(k);return v==null?d:v==='1'}function saveBool(k,v){localStorage.setItem(k,v?'1':'0')}function inb(r,c){return r>=0&&r<N&&c>=0&&c<N}function key(r,c){return r+','+c}function pos(k){let [r,c]=k.split(',').map(Number);return{r,c}}function cellAt(p){return S.board[p.r]?.[p.c]}function samePos(a,b){return a&&b&&a.r===b.r&&a.c===b.c}function adj(a,b){return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1}function stable(){return S.screen==='game'&&!S.resolving&&!S.paused&&!S.gameOver&&!S.overlay}function dur(on,off){return S.settings.motion?on:off}function gem(type,special=null){return{type,special,id:idCounter++}}function normalTypes(){return S.level<3?BASE:S.level<6?[...BASE,'o']:[...BASE,'o','w']}function rand(arr){return arr[Math.floor(Math.random()*arr.length)]}function target(l=S.level){return 1000+400*(l-1)+100*(l-1)*(l-1)}
function setHC(){document.documentElement.classList.toggle('hc',S.settings.hc);document.documentElement.classList.toggle('reduced',!S.settings.motion)}setHC();
function icon(id,extra=''){return `<svg class="icon ${extra}" aria-hidden="true"><use href="#${id}"></use></svg>`}function btn(id,aria,fn){let b=document.createElement('button');b.className='iconBtn';b.type='button';b.setAttribute('aria-label',aria);b.innerHTML=icon(id);b.addEventListener('click',interact(fn));return b}function word(t,fn){let b=document.createElement('button');b.className='wordBtn';b.type='button';b.textContent=t;b.addEventListener('click',interact(fn));return b}function interact(fn){return e=>{audioReady=true;resetIdle();fn(e)}}
function render(){setHC();app.innerHTML='';if(S.screen==='menu')renderMenu();if(S.screen==='best')renderBest();if(S.screen==='game')renderGame();if(S.overlay)renderOverlay(S.overlay)}
function renderMenu(){let s=el('div','screen');s.append(btn('i-trophy','best score',()=>{S.screen='best';render()}));s.lastChild.classList.add('corner','left');s.append(btn('i-gear','settings',()=>openSettings('menu')));s.lastChild.classList.add('corner','right');s.append(el('div','logo'));s.append(word('Start Game',newGame));app.append(s)}

function renderGame(){let s=el('div','screen');let top=el('div','topbar');let sc=el('div','stat');sc.setAttribute('aria-label','score '+S.score);sc.append(el('div','num',String(S.score)));let lv=el('div','stat');lv.setAttribute('aria-label','level '+S.level);lv.append(iconNode('i-star'));lv.append(el('div','num',String(S.level)));top.append(sc,lv);s.append(top);let meter=el('div','meter');meter.setAttribute('role','progressbar');meter.setAttribute('aria-valuenow',S.progress);meter.setAttribute('aria-valuemax',target());meter.setAttribute('aria-valuemin','0');meter.innerHTML=`<div style="width:${Math.min(100,S.progress/target()*100)}%"></div>`;s.append(meter);let wrap=el('div','boardWrap');let board=el('div','board');if(S.gameOver)board.classList.add('dim');board.tabIndex=0;board.setAttribute('role','grid');board.addEventListener('keydown',boardKey);board.addEventListener('focus',()=>{if(!S.cursor)S.cursor={r:0,c:0};render()});for(let r=0;r<N;r++)for(let c=0;c<N;c++){let ce=el('button','cell');ce.type='button';ce.dataset.r=r;ce.dataset.c=c;ce.setAttribute('role','gridcell');let g=S.board[r]?.[c];ce.setAttribute('aria-label',`row ${r+1} column ${c+1} ${g?labels[g.type]:'empty'} ${g?.special||'normal'} ${samePos(S.cursor,{r,c})?'focused':'not focused'} ${samePos(S.selected,{r,c})?'selected':'not selected'}`);if(samePos(S.cursor,{r,c}))ce.classList.add('cursor');if(samePos(S.selected,{r,c}))ce.classList.add('selected');if(S.hintCells.some(p=>p.r===r&&p.c===c))ce.classList.add('hint');if(S.hintCells.length===2&&samePos(S.hintCells[0],{r,c})&&S.settings.motion){let dx=(S.hintCells[1].c-c)*12,dy=(S.hintCells[1].r-r)*12;ce.classList.add('nudge');ce.style.setProperty('--nx',dx+'%');ce.style.setProperty('--ny',dy+'%')}ce.addEventListener('pointerdown',pointerDown);ce.addEventListener('pointerup',pointerUp);ce.addEventListener('click',interact(()=>cellClick({r,c})));if(g){let gd=el('div','gem '+(g.type==='color'?'color':g.type)+' '+(g.special||''));ce.append(gd)}board.append(c function renderOverlay(type){let ov=el('div','overlay');let m=el('div','modal');if(type==='pause'){m.append(el('div','modalTitle','Paused'));let row=el('div','row');row.append(btn('i-play','resume',closePause),btn('i-restart','restart',newGame),btn('i-gear','settings',()=>openSettings('pause')),btn('i-home','menu',()=>{S.overlay=null;S.paused=false;S.screen='menu';render()}));m.append(row)}else if(type==='settings'){let row=el('div','row');row.append(btn(S.settings.sound?'i-sound':'i-mute','sound',toggleSound),btn('i-motion','motion',toggleMotion),btn('i-idle','idle hints',toggleIdle),btn('i-contrast','high contrast',toggleHC),btn('i-trash','reset best score',()=>{S.overlay='confirm';render()}),btn('i-home','return',closeSettings));m.append(row)}else if(type==='confirm'){let row=el('div','row');row.append(btn('i-check','confirm reset',()=>{S.best=0;localStorage.setItem(LS.best,'0');S.overlay='settings';render()}),btn('i-x','cancel reset',()=>{S.overlay='settings';render()}));m.append(row)}else if(type==='gameover'){m.setAttribute('aria-label',`final score ${S.score} best score ${S.best}`);m.append(el('div','modalTitle','Game Over'));m.append(el('div','modalNums',String(S.score)));let best=el('div','modalNums');best.append(iconNode('i-trophy'),document.createTextNode(String(S.best)));m.append(best);if(S.newBest)m.append(el('div','modalTitle','New Best'));m.append(word('Play Again',newGame),word('Menu',()=>{S.overlay=null;S.gameOver=false;S.screen='menu';render()}))}ov.append(m);app.append(ov)}
function el(tag,cls,txt){let x=document.createElement(tag);if(cls)x.className=cls;if(txt!=null)x.textContent=txt;return x}function iconNode(id){let d=el('span');d.innerHTML=icon(id);return d.firstChild}
function newGame(){S.score=0;S.level=1;S.progress=0;S.selected=null;S.cursor={r:0,c:0};S.resolving=false;S.paused=false;S.gameOver=false;S.newBest=false;S.overlay=null;S.hintCells=[];S.board=genBoard();S.screen='game';resetIdle();render()}function genBoard(){let tries=0,b;do{b=Array.from({length:N},()=>Array.from({length:N},()=>gem(rand(BASE))));tries++}while((findMatches(b).lines.length||legalMoves(b,false).length<3)&&tries<10000);return b}
function findMatches(board=S.board){let lines=[];for(let r=0;r<N;r++){let c=0;while(c<N){let g=board[r][c],t=g&&g.type;if(!g||t==='color'){c++;continue}let s=c;while(c<N&&board[r][c]&&board[r][c].type===t)c++;if(c-s>=3)lines.push({dir:'h',type:t,cells:range(s,c-1).map(cc=>({r,c:cc}))})}}for(let c=0;c<N;c++){let r=0;while(r<N){let g=board[r][c],t=g&&g.type;if(!g||t==='color'){r++;continue}let s=r;while(r<N&&board[r][c]&&board[r][c].type===t)r++;if(r-s>=3)lines.push({dir:'v',type:t,cells:range(s,r-1).map(rr=>({r:rr,c}))})}}return{lines}}function range(a,b){let x=[];for(let i=a;i<=b;i++)x.push(i);return x}
function analyze(board,moved){let fm=findMatches(board), lines=fm.lines, clear=new Set(), normal=0, candidates=[];let usedTL=new Set();for(let i=0;i<lines.length;i++)for(let j=i+1;j<lines.length;j++){let a=lines[i],b=lines[j];if(a.type===b.type&&a.dir!==b.dir){let inter=a.cells.find(x=>b.cells.some(y=>samePos(x,y)));if(inter){let cells=uniq([...a.cells,...b.cells]);candidates.push({kind:'burst',cells,pos:inter,lineIds:[i,j],priority:2});normal+=120;usedTL.add(i);usedTL.add(j)}}}
lines.forEach((l,i)=>{l.cells.forEach(p=>clear.add(key(p.r,p.c)));if(!usedTL.has(i)){normal+=PTS[Math.min(8,l.cells.length)]||210;if(l.cells.length>=5)candidates.push({kind:'color',cells:l.cells,pos:null,line:l,priority:3});else if(l.cells.length===4)candidates.push({kind:l.dir==='h'?'lineH':'lineV',cells:l.cells,pos:null,line:l,priority:1})}});candidates.sort((a,b)=>b.priority-a.priority);let create=null;if(candidates.length){let cand=candidates[0];let cells=cand.cells;if(moved&&cells.some(p=>samePos(p,moved)))create={pos:moved,special:cand.kind,type:cand.kind==='color'?'color':cellAt(moved)?.type||cand.line?.type||S.board[cells[0].r][cells[0].c].type};else if(cand.kind==='burst')create={pos:cand.pos,special:'burst',type:S.board[cand.pos.r][cand.pos.c].type};else{let sorted=[...cells].sort((a,b)=>cand.line.dir==='h'?a.c-b.c:a.r-b.r);let idx=(sorted.length-1)/2;if(Number.isInteger(idx))create={pos:sorted[idx],special:cand.kind,type:cand.kind==='color'?'color':cand.line.type};else{let a=sorted[Math.floor(idx)],b=sorted[Math.ceil(idx)],chosen=!moved?a:(Math.abs(a.r-moved.r)+Math.abs(a.c-moved.c)<=Math.abs(b.r-moved.r)+Math.abs(b.c-moved.c)?a:b);create={pos:chosen,special:cand.kind,type:cand.kind==='color'?'color':cand.line.type}}}clear.delete(key(create.pos.r,create.pos.c))}
let effects=new Map();for(let k of [...clear]){let p=pos(k),g=board[p.r][p.c];if(g?.special==='lineH'||g?.special==='lineV')addLineEffect(board,p,effects);if(g?.special==='burst')addBurstEffect(board,p,effects)}return{lines,clear,effects,normal,create}}
function uniq(arr){let m=new Map();arr.forEach(p=>m.set(key(p.r,p.c),p));return[...m.values()]}function setEff(map,p,v){let k=key(p.r,p.c);map.set(k,Math.max(map.get(k)||0,v))}function addLineEffect(board,p,map){let g=board[p.r][p.c];if(!g)return;if(g.special==='lineH')for(let c=0;c<N;c++)setEff(map,{r:p.r,c},10);else for(let r=0;r<N;r++)setEff(map,{r,c:p.c},10)}function addBurstEffect(board,p,map,size=1){for(let r=p.r-size;r<=p.r+size;r++)for(let c=p.c-size;c<=p.c+size;c++)if(inb(r,c))setEff(map,{r,c},size===2?15:15)}
function hasNormalSwap(board,a,b){let cp=cloneBoard(board);swap(cp,a,b);return findMatches(cp).lines.length>0}function isSpecial(g){return g&&(g.special||g.type==='color')}function specialRule(g1,g2){if(!g1||!g2)return null;let a=g1.type==='color'?'color':g1.special,b=g2.type==='color'?'color':g2.special;if(!a&&!b)return null;let set=[a,b].sort().join('+');if((a==='lineH'||a==='lineV')&&(b==='lineH'||b==='lineV'))return'line-line';if(((a==='lineH'||a==='lineV')&&b==='burst')||((b==='lineH'||b==='lineV')&&a==='burst'))return'line-burst';if(a==='burst'&&b==='burst')return'burst-burst';if(a==='color'&&b==='color')return'color-color';if(a==='color'||b==='color'){let other=a==='color'?g2:g1;if(other.special==='lineH'||other.special==='lineV')return'color-line';if(other.special==='burst')return'color-burst';if(other.type!=='color')return'color-normal'}return null}
function legalMoves(board=S.board,includeSpecial=true){let out=[],dirs=[[0,1],[1,0],[0,-1],[-1,0]];for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(let [dr,dc] of dirs){let a={r,c},b={r:r+dr,c:c+dc};if(!inb(b.r,b.c))continue;if(includeSpecial&&specialRule(board[r][c],board[b.r][b.c]))out.push([a,b]);else if(hasNormalSwap(board,a,b))out.push([a,b])}return out}
function cloneBoard(b){return b.map(row=>row.map(g=>g?{...g}:null))}function swap(b,a,c){let t=b[a.r][a.c];b[a.r][a.c]=b[c.r][c.c];b[c.r][c.c]=t}
let down=null;function pointerDown(e){let ce=e.currentTarget;down={r:+ce.dataset.r,c:+ce.dataset.c,x:e.clientX,y:e.clientY}}function pointerUp(e){if(!down||!stable())return;let ce=e.currentTarget,cell=ce.getBoundingClientRect(),dx=e.clientX-down.x,dy=e.clientY-down.y,lim=cell.width*.25;if(Math.max(Math.abs(dx),Math.abs(dy))>=lim){let p={r:down.r,c:down.c},q={r:p.r+(Math.abs(dy)>Math.abs(dx)?Math.sign(dy):0),c:p.c+(Math.abs(dx)>=Math.abs(dy)?Math.sign(dx):0)};if(inb(q.r,q.c))attempt(p,q)}down=null}
function cellClick(p){if(!stable())return;clearHint();S.cursor=p;if(!S.selected){S.selected=p;play('click');render();return}if(samePos(S.selected,p)){S.selected=null;render();return}if(adj(S.selected,p))attempt(S.selected,p);else{S.selected=p;play('click');render()}}
async function attempt(a,b){if(!stable())return;resetIdle();clearHint(false);if(!adj(a,b)){S.selected=b;render();return}let g1=cellAt(a),g2=cellAt(b),rule=specialRule(g1,g2);if(rule){S.resolving=true;S.selected=null;swap(S.board,a,b);render();play('slide');await wait(dur(120,80));await resolveSpecial(rule,b,a);return}if(hasNormalSwap(S.board,a,b)){S.resolving=true;S.selected=null;swap(S.board,a,b);render();play('slide');await wait(dur(120,80));await resolveAll(b,1);return}await invalid(a)}
async function invalid(a){play('bad');let ce=document.querySelector(`.cell[data-r="${a.r}"][data-c="${a.c}"]`);if(ce){ce.classList.add(S.settings.motion?'shake':'fadeFlash');await wait(dur(180,80));ce.classList.remove('shake','fadeFlash')}S.selected=a;render()}
async function resolveSpecial(rule,dest,other){let effects=new Map(), createSound=false;let add=(p,v)=>inb(p.r,p.c)&&setEff(effects,p,v);let gDest=cellAt(dest),gOther=cellAt(other);let involved=[gDest,gOther];if(rule==='line-line'){for(let c=0;c<N;c++)add({r:dest.r,c},10);for(let r=0;r<N;r++)add({r,c:dest.c},10)}else if(rule==='line-burst'){for(let r=dest.r-1;r<=dest.r+1;r++)for(let c=0;c<N;c++)add({r,c},10);for(let c=dest.c-1;c<=dest.c+1;c++)for(let r=0;r<N;r++)add({r,c},10)}else if(rule==='burst-burst'){for(let r=dest.r-2;r<=dest.r+2;r++)for(let c=dest.c-2;c<=dest.c+2;c++)add({r,c},15)}else if(rule==='color-color'){for(let r=0;r<N;r++)for(let c=0;c<N;c++)add({r,c},20)}else{let normal=involved.find(g=>g.type!=='color'), t=normal.type;if(rule==='color-normal'){for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(S.board[r][c]?.type===t)add({r,c},20)}else if(rule==='color-line'||rule==='color-burst'){for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(S.board[r][c]?.type===t){S.board[r][c].special=rule==='color-line'?(Math.random()<.5?'lineH':'lineV'):'burst';createSound=true; if(rule==='color-line')addLineEffect(S.board,{r,c},effects); else addBurstEffect(S.board,{r,c},effects)}}}
setEff(effects,dest,20);setEff(effects,other,20);if(createSound)play('special');play('burst');await flash([...effects.keys()],rule.includes('burst')?'glow':'flash');await clearScoreFall({normal:0,effects,clear:new Set(effects.keys()),create:null},1);}
async function resolveAll(moved,mult){let an=analyze(S.board,moved);if(!an.lines.length){await postResolution();return}await clearScoreFall(an,mult);}
async function clearScoreFall(an,mult){let all=new Set([...an.clear,...an.effects.keys()]);if(an.create){let p=an.create.pos;let old=S.board[p.r][p.c];S.board[p.r][p.c]=gem(an.create.type,an.create.special==='color'?null:an.create.special);if(an.create.special==='color')S.board[p.r][p.c].type='color';play('special')}an.effects.forEach((v,k)=>all.add(k));if(!all.size){await postResolution();return}await brighten([...all]);let subtotal=an.normal;an.effects.forEach(v=>subtotal+=v);let gain=subtotal*mult;applyScore(gain,all);all.forEach(k=>{let p=pos(k);S.board[p.r][p.c]=null});play(mult>1?'cascade':'clear');render();markCells(all,'clear');await wait(dur(180,80));fallSpawn();render();await wait(dur(260,80));let next=analyze(S.board,null);if(next.lines.length){await showMult(mult+1);await clearScoreFall(next,mult+1)}else await postResolution()}
function applyScore(gain,cells){if(gain<=0)return;S.score+=gain;S.progress+=gain;while(S.progress>=target()){S.progress-=target();S.level++;play('level');setTimeout(()=>document.querySelector('.meter')?.classList.add('flash'),0);setTimeout(()=>document.querySelector('.meter')?.classList.remove('flash'),dur(180,80))}render();let wrap=document.querySelector('.boardWrap');if(wrap){let p=el('div','popup','+'+gain);wrap.append(p);setTimeout(()=>p.remove(),700)}}function fallSpawn(){let types=normalTypes();for(let c=0;c<N;c++){let stack=[];for(let r=N-1;r>=0;r--)if(S.board[r][c])stack.push(S.board[r][c]);for(let r=N-1;r>=0;r--)S.board[r][c]=stack[N-1-r]||gem(rand(types))}}
async function postResolution(){S.resolving=false;S.selected=null;S.hintCells=[];if(legalMoves(S.board,true).length===0){S.gameOver=true;if(S.score>S.best){S.best=S.score;S.newBest=true;localStorage.setItem(LS.best,String(S.best))}S.overlay='gameover';play('over')}resetIdle();render()}
async function brighten(keys){markCells(keys,'flash');await wait(dur(120,80));unmark('flash')}async function flash(keys,cls){markCells(keys,cls);await wait(dur(120,80));unmark(cls)}function markCells(keys,cls){keys.forEach(k=>{let p=typeof k==='string'?pos(k):k;document.querySelector(`.cell[data-r="${p.r}"][data-c="${p.c}"]`)?.classList.add(cls)})}function unmark(cls){document.querySelectorAll('.'+cls).forEach(e=>e.classList.remove(cls))}
function wait(ms){return new Promise(res=>{let left=ms,last=performance.now();function step(now){if(document.hidden){last=now;requestAnimationFrame(step);return}left-=now-last;last=now;if(left<=0)res();else requestAnimationFrame(step)}requestAnimationFrame(step)})}
async function showMult(n){render();let m=document.getElementById('mult');if(m){m.textContent='x'+n;m.classList.remove('hidden')}await wait(500);if(m)m.classList.add('hidden')}
function clearHint(r=true){S.hintCells=[];if(r)render()}function manualHint(){if(!stable())return;let mv=legalMoves(S.board,true)[0];if(mv){S.hintCells=mv;render();setTimeout(()=>{S.hintCells=[];if(stable())render()},2000)}}function resetIdle(){S.idleAt=performance.now()}setInterval(()=>{if(stable()&&S.settings.idle&&performance.now()-S.idleAt>8000&&!S.hintCells.length)manualHint()},500)
function openPause(){if(S.screen==='game'&&!S.overlay){S.paused=true;S.overlay='pause';render()}}function closePause(){S.paused=false;S.overlay=null;resetIdle();render()}function openSettings(from){S.settingsFrom=from;S.overlay='settings';render()}function closeSettings(){let f=S.settingsFrom;S.overlay=null;if(f==='pause'){S.overlay='pause';S.paused=true}render()}function toggleSound(){S.settings.sound=!S.settings.sound;saveBool(LS.sound,S.settings.sound);render()}function toggleMotion(){S.settings.motion=!S.settings.motion;saveBool(LS.motion,S.settings.motion);render()}function toggleIdle(){S.settings.idle=!S.settings.idle;saveBool(LS.idle,S.settings.idle);render()}function toggleHC(){S.settings.hc=!S.settings.hc;saveBool(LS.hc,S.settings.hc);render()}
function boardKey(e){if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' ','Escape','p','P','h','H'].includes(e.key))return;e.preventDefault();if(e.key==='p'||e.key==='P'){S.paused?closePause():openPause();return}if(e.key==='h'||e.key==='H'){manualHint();return}if(!stable())return;resetIdle();let d={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(d){if(S.selected){let q={r:S.selected.r+d[0],c:S.selected.c+d[1]};if(inb(q.r,q.c))attempt(S.selected,q);return}let q={r:Math.max(0,Math.min(7,S.cursor.r+d[0])),c:Math.max(0,Math.min(7,S.cursor.c+d[1]))};S.cursor=q;render();return}if(e.key==='Enter'||e.key===' '){cellClick(S.cursor);return}if(e.key==='Escape'){S.selected=null;render()}}
document.addEventListener('keydown',e=>{if((e.key==='p'||e.key==='P')&&S.screen==='game'){e.preventDefault();S.paused?closePause():openPause()}else if((e.key==='h'||e.key==='H')&&S.screen==='game'){e.preventDefault();manualHint()}});
function play(kind){if(!S.settings.sound||!audioReady)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);let f={click:500,slide:330,bad:110,clear:760,cascade:900,special:1200,burst:160,level:440,over:220}[kind]||440;o.frequency.setValueAtTime(f,audioCtx.currentTime);if(kind==='level')o.frequency.exponentialRampToValueAtTime(880,audioCtx.currentTime+.18);if(kind==='over')o.frequency.exponentialRampToValueAtTime(90,audioCtx.currentTime+.25);g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.06,audioCtx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.18);o.start();o.stop(audioCtx.currentTime+.22)}catch(e){}}
window.__game={S,newGame,findMatches,legalMoves,hasNormalSwap,analyze,target,genBoard,specialRule};
