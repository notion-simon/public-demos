<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Brick Breaker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: none;
  }

  /* Menu screen */
  #menu-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100vh;
    position: relative;
  }
  #menu-screen .logo {
    width: 120px;
    height: 120px;
    margin-bottom: 40px;
    position: relative;
  }
  #menu-screen .logo-ball {
    width: 28px; height: 28px; border-radius: 50%;
    background: #ff5e57;
    position: absolute;
    left: 50%; top: 20px;
    transform: translateX(-50%);
    box-shadow: 0 0 12px #ff5e57;
  }
  #menu-screen .logo-paddle {
    width: 80px; height: 12px; border-radius: 6px;
    background: #4facfe;
    position: absolute;
    left: 50%; bottom: 30px;
    transform: translateX(-50%);
    box-shadow: 0 0 12px #4facfe;
  }
  #menu-screen .logo-brick {
    width: 18px; height: 8px; border-radius: 2px;
    position: absolute;
    top: 56px;
    box-shadow: 0 0 6px currentColor;
  }

  .menu-btn {
    background: #ff5e57;
    border: none; border-radius: 8px;
    color: #fff; font-size: 18px; font-weight: 600;
    padding: 14px 40px; cursor: pointer;
    min-width: 44px; min-height: 44px;
    transition: transform .15s, opacity .15s;
    margin-top: 20px;
  }
  .menu-btn:hover { transform: scale(1.05); }
  .menu-btn:active { transform: scale(.95); }
  .menu-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .corner-icon {
    position: absolute;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; color: #fff;
    cursor: pointer; border-radius: 8px;
  }
  .corner-icon:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .corner-icon svg { width: 24px; height: 24px; fill: currentColor; }

  #trophy-btn { top: 16px; left: 16px; }
  #menu-gear-btn { top: 16px; right: 16px; }

  /* Game screen */
  #game-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding: 12px 16px;
  }

  .game-header {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 480px; margin-bottom: 8px;
  }
  .game-header .left, .game-header .right {
    display: flex; align-items: center; gap: 6px;
    font-size: 16px; font-weight: 600;
  }
  .game-header svg { width: 20px; height: 20px; fill: currentColor; }

  #playfield-wrap {
    position: relative;
    width: 480px; height: 640px;
    max-width: 100%;
    border-radius: 8px; overflow: hidden;
    background: #1a1a2e;
    box-shadow: 0 0 20px rgba(0,0,0,.5);
  }
  #playfield {
    width: 480px; height: 640px;
    display: block;
    cursor: none;
  }

  .game-footer {
    display: flex; justify-content: center; gap: 20px;
    margin-top: 10px;
  }
  .footer-icon {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.08); border: none; border-radius: 8px;
    color: #fff; cursor: pointer;
  }
  .footer-icon:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .footer-icon svg { width: 22px; height: 22px; fill: currentColor; }

  /* Overlays */
  .overlay {
    position: absolute; inset: 0;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.55);
    z-index: 10;
    border-radius: 8px;
  }
  .overlay.active { display: flex; }

  .overlay-title {
    font-size: 32px; font-weight: 700; margin-bottom: 12px;
  }
  .overlay-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    font-size: 16px;
  }
  .overlay-row svg { width: 20px; height: 20px; fill: currentColor; }
  .overlay-btn {
    background: #ff5e57; border: none; border-radius: 8px;
    color: #fff; font-size: 16px; font-weight: 600;
    padding: 10px 28px; cursor: pointer; margin-top: 14px;
    min-height: 44px; min-width: 44px;
  }
  .overlay-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .overlay-btn.secondary {
    background: rgba(255,255,255,.15); margin-top: 8px;
  }

  /* Settings modal */
  #settings-modal {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); z-index: 100;
  }
  #settings-modal.active { display: flex; }
  .modal-box {
    background: #222; border-radius: 12px;
    padding: 24px 28px; width: 300px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .modal-title { font-size: 20px; font-weight: 700; text-align: center; color: #fff; display: flex; align-items: center; justify-content: center; }
  .modal-row {
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-row .label { display: flex; align-items: center; gap: 8px; }
  .modal-row svg { width: 20px; height: 20px; fill: currentColor; }
  .toggle-btn {
    width: 48px; height: 26px; border-radius: 13px;
    background: #555; border: none; position: relative; cursor: pointer;
    transition: background .2s;
  }
  .toggle-btn.on { background: #4facfe; }
  .toggle-btn::after {
    content: ''; position: absolute; width: 22px; height: 22px;
    border-radius: 50%; background: #fff; top: 2px; left: 2px;
    transition: transform .2s;
  }
  .toggle-btn.on::after { transform: translateX(22px); }
  .toggle-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .danger-zone {
    margin-top: 6px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .danger-btn {
    background: rgba(255,94,87,.2); color: #ff5e57;
    border: 1px solid rgba(255,94,87,.4); border-radius: 8px;
    padding: 8px 14px; cursor: pointer; font-size: 14px; font-weight: 600;
  }
  .danger-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .confirm-row { display: flex; gap: 10px; }
  .confirm-row button {
    flex: 1; padding: 8px; border-radius: 6px; border: none; cursor: pointer;
    font-weight: 600; min-height: 44px;
  }
  .confirm-yes { background: #ff5e57; color: #fff; }
  .confirm-no { background: #444; color: #fff; }

  .modal-home {
    align-self: center;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.08); border: none; border-radius: 8px;
    color: #fff; cursor: pointer;
  }
  .modal-home:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .modal-home svg { width: 22px; height: 22px; fill: currentColor; }

  /* Pause overlay buttons */
  .pause-grid {
    display: grid; grid-template-columns: repeat(2, auto); gap: 16px;
    margin-top: 10px;
  }
  .pause-grid button {
    width: 56px; height: 56px; border-radius: 12px;
    background: rgba(255,255,255,.12); border: none; color: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .pause-grid button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .pause-grid button svg { width: 26px; height: 26px; fill: currentColor; }

  /* Responsive */
  @media (max-width: 599px) {
    #playfield-wrap { width: calc(100vw - 32px); height: auto; aspect-ratio: 480 / 640; }
    #playfield { width: 100%; height: 100%; }
  }

  /* Score popups */
  .score-popup {
    position: absolute;
    color: #ffd700; font-weight: 700; font-size: 16px;
    pointer-events: none; animation: popupUp .6s ease-out forwards;
    text-shadow: 0 0 6px rgba(255,215,0,.6);
  }
  @keyframes popupUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-30px) scale(1.2); }
  }

  /* Dimmed playfield */
  .dimmed #playfield { opacity: .4; }

  /* New Best flash */
  .new-best { color: #ffd700; animation: flash .8s ease-in-out infinite alternate; }
  @keyframes flash { from { opacity: .6; } to { opacity: 1; } }
</style>
</head>

<!-- MENU SCREEN -->
<div id="menu-screen">
  <button id="trophy-btn" class="corner-icon" aria-label="Best Score" title="Best Score">

<script>
(function(){
  'use strict';

  /* ================= AUDIO ================= */
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  let soundOn = true;

  function ensureAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTone(type) {
    if (!soundOn || !audioCtx) return;
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    switch(type) {
      case 'paddle':
        o.type='sine'; o.frequency.setValueAtTime(600,t);
        g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.001,t+.08);
        o.start(t); o.stop(t+.08);
        break;
      case 'wall':
        o.type='square'; o.frequency.setValueAtTime(800,t);
        g.gain.setValueAtTime(.06,t); g.gain.exponentialRampToValueAtTime(.001,t+.04);
        o.start(t); o.stop(t+.04);
        break;
      case 'brick':
        o.type='sine'; o.frequency.setValueAtTime(1200,t);
        g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.15);
        o.start(t); o.stop(t+.15);
        break;
      case 'level':
        o.type='sine'; o.frequency.setValueAtTime(400,t);
        o.frequency.linearRampToValueAtTime(1000,t+.3);
        g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+.4);
        o.start(t); o.stop(t+.4);
        break;
      case 'gameover':
        o.type='sawtooth'; o.frequency.setValueAtTime(500,t);
        o.frequency.exponentialRampToValueAtTime(100,t+.6);
        g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.001,t+.7);
        o.start(t); o.stop(t+.7);
        break;
    }
  }

  /* ================= STATE ================= */
  const PF_W = 480, PF_H = 640;
  const canvas = document.getElementById('playfield');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('playfield-wrap');

  let state = 'menu'; // menu, playing, paused, gameover
  let score = 0, level = 1, bestScore = 0;
  let paddleX = PF_W/2, paddleW = 96, paddleH = 14, paddleY = 590;
  let ballX = PF_W/2, ballY = 560, ballR = 7, ballVx = 150, ballVy = -260;
  let bricks = [];
  let popups = [];
  let lastT = 0, animId = 0;
  let keys = {};
  let isNewBest = false;

  const COLORS = ['#ff5e57','#4facfe','#ffd700','#00e676','#ff9ff3','#54a0ff','#5f27cd','#ff6b6b'];

  /* ================= PERSISTENCE ================= */
  function loadBest() {
    try { bestScore = parseInt(localStorage.getItem('bb_best')||'0',10)||0; } catch(e){ bestScore=0; }
  }
  function saveBest() {
    try { localStorage.setItem('bb_best', String(bestScore)); } catch(e){}
  }
  loadBest();

  /* ================= BRICKS ================= */
  function buildBricks() {
    bricks = [];
    const rows = Math.min(8, 4 + level);
    const cols = 8;
    const bw = 52, bh = 20, gap = 6;
    const startX = 16, startY = 64;
    for (let r=0;r<rows;r++) {
      for (let c=0;c<cols;c++) {
        bricks.push({
          x: startX + c*(bw+gap),
          y: startY + r*(bh+gap),
          w: bw, h: bh,
          color: COLORS[r % COLORS.length],
          alive: true
        });
      }
    }
  }

  /* ================= RESET ================= */
  function resetGame() {
    score = 0; level = 1; isNewBest = false;
    paddleW = 96; paddleX = PF_W/2; paddleY = 590;
    resetBall(); buildBricks();
    updateUI();
  }
  function resetBall() {
    ballX = PF_W/2; ballY = 560; ballR = 7;
    ballVx = 150; ballVy = -260;
  }
  function nextLevel() {
    level++;
    paddleW = Math.max(56, 96 - 4*(level-1));
    const speed = Math.min(520, 300 + 24*(level-1));
    const angle = Math.random()*Math.PI/3 + Math.PI/6; // 30-90 deg upward
    ballVx = speed * Math.cos(angle) * (Math.random()<.5?1:-1);
    ballVy = -Math.abs(speed * Math.sin(angle));
    paddleX = PF_W/2;
    ballX = PF_W/2; ballY = 560;
    buildBricks();
    playTone('level');
    updateUI();
  }

  /* ================= UI ================= */
  const menuScreen = document.getElementById('menu-screen');
  const gameScreen = document.getElementById('game-screen');
  const pauseOverlay = document.getElementById('pause-overlay');
  const gameoverOverlay = document.getElementById('gameover-overlay');
  const settingsModal = document.getElementById('settings-modal');

  function showScreen(name) {
    menuScreen.style.display = name==='menu'?'flex':'none';
    gameScreen.style.display = (name==='playing' || name==='paused' || name==='gameover')?'flex':'none';
    pauseOverlay.classList.toggle('active', name==='paused');
    gameoverOverlay.classList.toggle('active', name==='gameover');
    wrap.classList.toggle('dimmed', name==='gameover');
    settingsModal.classList.remove('active');
    state = name;
  }

  function updateUI() {
    document.getElementById('score-display').textContent = score;
    document.getElementById('level-display').textContent = level;
  }

  /* ================= GAME LOOP ================= */
  function startLoop() {
    lastT = performance.now();
    if (animId) cancelAnimationFrame(animId);
    loop(lastT);
  }
  function stopLoop() {
    if (animId) cancelAnimationFrame(animId); animId = 0;
  }

  function loop(ts) {
    animId = requestAnimationFrame(loop);
    const dt = Math.min((ts - lastT)/1000, 0.05);
    lastT = ts;
    if (state === 'playing') update(dt);
    draw();
  }

  function update(dt) {
    // Keyboard paddle
    const speed = 420;
    if (keys['ArrowLeft'] || keys['KeyA']) paddleX -= speed*dt;
    if (keys['ArrowRight'] || keys['KeyD']) paddleX += speed*dt;
    // Clamp paddle
    const halfP = paddleW/2;
    paddleX = Math.max(halfP, Math.min(PF_W - halfP, paddleX));

    // Ball
    const speedMag = Math.hypot(ballVx, ballVy);
    ballX += ballVx * dt;
    ballY += ballVy * dt;

    // Wall collisions
    if (ballX - ballR < 0) { ballX = ballR; ballVx = Math.abs(ballVx); playTone('wall'); }
    if (ballX + ballR > PF_W) { ballX = PF_W - ballR; ballVx = -Math.abs(ballVx); playTone('wall'); }
    if (ballY - ballR < 0) { ballY = ballR; ballVy = Math.abs(ballVy); playTone('wall'); }

    // Paddle collision
    if (ballVy > 0 &&
        ballY + ballR >= paddleY && ballY - ballR <= paddleY + paddleH &&
        ballX >= paddleX - halfP && ballX <= paddleX + halfP) {
      ballY = paddleY - ballR;
      let hitPos = (ballX - paddleX) / halfP;
      hitPos = Math.max(-1, Math.min(1, hitPos));
      ballVx = hitPos * speedMag * 0.75;
      ballVy = -Math.abs(ballVy);
      playTone('paddle');
    }

    // Brick collision
    let hitBrick = false;
    for (const b of bricks) {
      if (!b.alive) continue;
      if (ballX + ballR > b.x && ballX - ballR < b.x + b.w &&
          ballY + ballR > b.y && ballY - ballR < b.y + b.h) {
        b.alive = false;
        hitBrick = true;
        const pts = 10 * level;
        score += pts;
        addPopup(b.x + b.w/2, b.y + b.h/2, '+' + pts);
        // Bounce based on side
        const overlapLeft = (ballX + ballR) - b.x;
        const overlapRight = (b.x + b.w) - (ballX - ballR);
        const overlapTop = (ballY + ballR) - b.y;
        const overlapBottom = (b.y + b.h) - (ballY - ballR);
        const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
        if (minOverlap === overlapLeft) ballVx = -Math.abs(ballVx);
        else if (minOverlap === overlapRight) ballVx = Math.abs(ballVx);
        else if (minOverlap === overlapTop) ballVy = -Math.abs(ballVy);
        else ballVy = Math.abs(ballVy);
        break;
      }
    }
    if (hitBrick) {
      playTone('brick');
      // Check level clear
      if (bricks.every(b=>!b.alive)) {
        nextLevel();
      }
    }

    // Game over
    if (ballY - ballR > PF_H) {
      doGameOver();
    }

    updateUI();
  }

  function addPopup(x, y, text) {
    const el = document.createElement('div');
    el.className = 'score-popup';
    el.textContent = text;
    el.style.left = (x - 16) + 'px';
    el.style.top = (y - 10) + 'px';
    wrap.appendChild(el);
    setTimeout(()=>el.remove(), 600);
  }

  function doGameOver() {
    stopLoop();
    state = 'gameover';
    pauseOverlay.classList.remove('active');
    gameoverOverlay.classList.add('active');
    wrap.classList.add('dimmed');
    document.getElementById('final-score').textContent = score;
    const nb = document.getElementById('new-best-label');
    if (score > bestScore) {
      bestScore = score; saveBest(); isNewBest = true;
      nb.style.display = '';
    } else {
      nb.style.display = 'none';
    }
    document.getElementById('best-score-display').textContent = bestScore;
    playTone('gameover');
  }

  /* ================= DRAW ================= */
  function draw() {
    ctx.clearRect(0, 0, PF_W, PF_H);

    // Bricks
    for (const b of bricks) {
      if (!b.alive) continue;
      ctx.fillStyle = b.color;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 12;
      roundRect(ctx, b.x, b.y, b.w, b.h, 3);
      ctx.fill();
      // Highlight edge
      ctx.strokeStyle = 'rgba(255,255,255,.25)';
      ctx.lineWidth = 1.5;
      roundRect(ctx, b.x, b.y, b.w, b.h, 3);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // Paddle
    ctx.fillStyle = '#4facfe';
    ctx.shadowColor = '#4facfe';
    ctx.shadowBlur = 10;
    roundRect(ctx, paddleX - paddleW/2, paddleY, paddleW, paddleH, 7);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Ball
    ctx.fillStyle = '#ff5e57';
    ctx.shadowColor = '#ff5e57';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(ballX, ballY, ballR, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // Ball highlight
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath();
    ctx.arc(ballX - ballR*0.25, ballY - ballR*0.35, ballR*0.4, 0, Math.PI*2);
    ctx.fill();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x+r, y); c.lineTo(x+w-r, y); c.arcTo(x+w, y, x+w, y+r, r);
    c.lineTo(x+w, y+h-r); c.arcTo(x+w, y+h, x+w-r, y+h, r);
    c.lineTo(x+r, y+h); c.arcTo(x, y+h, x, y+h-r, r);
    c.lineTo(x, y+r); c.arcTo(x, y, x+r, y, r);
    c.closePath();
  }

  /* ================= INPUT ================= */
  // Mouse
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = PF_W / rect.width;
    paddleX = (e.clientX - rect.left) * scaleX;
    paddleX = Math.max(paddleW/2, Math.min(PF_W - paddleW/2, paddleX));
  });
  canvas.addEventListener('mouseenter', () => { canvas.style.cursor = 'none'; });

  // Touch
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    handleTouch(e.touches[0]);
  }, {passive:false});
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    handleTouch(e.touches[0]);
  }, {passive:false});
  function handleTouch(t) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = PF_W / rect.width;
    paddleX = (t.clientX - rect.left) * scaleX;
    paddleX = Math.max(paddleW/2, Math.min(PF_W - paddleW/2, paddleX));
  }

  // Keyboard
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyP') {
      if (state === 'playing') { showScreen('paused'); stopLoop(); }
      else if (state === 'paused') { showScreen('playing'); startLoop(); }
    }
    // Prevent scrolling with arrows
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) {
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  /* ================= BUTTON HANDLERS ================= */
  document.getElementById('start-btn').addEventListener('click', () => {
    ensureAudio();
    resetGame();
    showScreen('playing');
    startLoop();
  });

  document.getElementById('pause-footer-btn').addEventListener('click', () => {
    if (state === 'playing') { showScreen('paused'); stopLoop(); }
  });

  document.getElementById('resume-btn').addEventListener('click', () => {
    showScreen('playing'); startLoop();
  });

  document.getElementById('restart-from-pause-btn').addEventListener('click', () => {
    ensureAudio();
    resetGame();
    showScreen('playing');
    startLoop();
  });

  document.getElementById('settings-from-pause-btn').addEventListener('click', () => {
    settingsModal.classList.add('active');
  });

  document.getElementById('home-from-pause-btn').addEventListener('click', () => {
    stopLoop(); showScreen('menu');
  });

  document.getElementById('play-again-btn').addEventListener('click', () => {
    ensureAudio();
    resetGame();
    showScreen('playing');
    startLoop();
  });

  document.getElementById('menu-from-gameover-btn').addEventListener('click', () => {
    showScreen('menu');
  });

  document.getElementById('settings-footer-btn').addEventListener('click', () => {
    settingsModal.classList.add('active');
  });

  document.getElementById('menu-gear-btn').addEventListener('click', () => {
    settingsModal.classList.add('active');
  });

  document.getElementById('settings-home-btn').addEventListener('click', () => {
    settingsModal.classList.remove('active');
    // Return to previous screen
  });

  // Sound toggle
  const soundToggle = document.getElementById('sound-toggle');
  soundToggle.addEventListener('click', () => {
    soundOn = !soundOn;
    soundToggle.classList.toggle('on', soundOn);
    ensureAudio();
  });

  // Reset best
  const resetBestBtn = document.getElementById('reset-best-btn');
  const resetConfirm = document.getElementById('reset-confirm');
  resetBestBtn.addEventListener('click', () => {
    resetConfirm.style.display = 'block';
  });
  document.getElementById('confirm-yes').addEventListener('click', () => {
    bestScore = 0; saveBest(); resetConfirm.style.display = 'none';
  });
  document.getElementById('confirm-no').addEventListener('click', () => {
    resetConfirm.style.display = 'none';
  });

  // Trophy best score display (tooltip-ish simple alert for now)
  document.getElementById('trophy-btn').addEventListener('click', () => {
    alert('Best Score: ' + bestScore);
  });

  /* ================= RESIZE ================= */
  function onResize() {
    if (window.innerWidth < 600) {
      const w = window.innerWidth - 32;
      const h = w * (PF_H / PF_W);
      wrap.style.width = w + 'px';
      wrap.style.height = h + 'px';
    } else {
      wrap.style.width = PF_W + 'px';
      wrap.style.height = PF_H + 'px';
    }
  }
  window.addEventListener('resize', onResize);
  onResize();

  // Initial draw
  draw();
})();
</script>
</body>
</html>
