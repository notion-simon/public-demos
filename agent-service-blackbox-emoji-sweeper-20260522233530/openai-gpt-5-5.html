<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Emoji Sweeper</title>
<style>
  :root {
    color-scheme: dark;
    --bg1: #25143f;
    --bg2: #0c1735;
    --panel: rgba(255,255,255,.12);
    --panel-strong: rgba(255,255,255,.19);
    --tile: #8067dd;
    --tile-hi: #9a83ef;
    --tile-shadow: #4b3a92;
    --flat: rgba(255,255,255,.16);
    --flat2: rgba(255,255,255,.11);
    --ink: #fff8da;
    --muted: rgba(255,255,255,.72);
    --focus: #ffffff;
    --danger: #ff647c;
    --gold: #ffd75c;
    --cell: clamp(30px, min(9.7vw, 7.7vh), 54px);
    --gap: 5px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    min-height: 100%;
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 8%, rgba(255,216,92,.22), transparent 27%),
      radial-gradient(circle at 84% 18%, rgba(105,226,255,.20), transparent 24%),
      radial-gradient(circle at 50% 100%, rgba(255,99,160,.18), transparent 30%),
      linear-gradient(145deg, var(--bg1), var(--bg2));
    color: var(--ink);
    overflow: hidden;
    user-select: none;
  }
  button { font: inherit; color: inherit; }
  .app {
    width: min(100vw, 760px);
    height: 100dvh;
    margin: 0 auto;
    padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
    display: grid;
    place-items: center;
    position: relative;
  }
  .screen {
    width: 100%;
    min-height: min(100%, 720px);
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 16px;
    position: relative;
  }
  .topbar, .hud, .bottombar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .icon, .pill, .start {
    border: 0;
    cursor: pointer;
    background: var(--panel);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 14px 35px rgba(0,0,0,.18);
    backdrop-filter: blur(16px);
  }
  .icon {
    min-width: 52px; width: auto; height: 52px; padding: 0 14px;
    border-radius: 18px;
    display: grid; place-items: center; white-space: nowrap;
    font-size: 27px;
  }
  .icon:active, .start:active { transform: translateY(1px) scale(.99); }
  .icon:focus-visible, .start:focus-visible, .cell:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  .menu-main {
    align-self: center;
    display: grid;
    justify-items: center;
    gap: 22px;
  }
  .intro-card {
    display: grid;
    justify-items: center;
    gap: 18px;
    padding: 18px;
    border-radius: 38px;
    background: linear-gradient(145deg, rgba(255,255,255,.11), rgba(255,255,255,.04));
    box-shadow: 0 26px 80px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .logo {
    display: grid;
    grid-template-columns: repeat(4, 58px);
    grid-auto-rows: 58px;
    gap: 8px;
    padding: 18px;
    border-radius: 34px;
    background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.07));
    box-shadow: 0 28px 70px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.22);
    position: relative;
  }
  .logo::before, .logo::after {
    content: '✨';
    position: absolute;
    font-size: 25px;
    filter: drop-shadow(0 0 14px rgba(255,215,92,.55));
    animation: floaty 2.8s ease-in-out infinite;
  }
  .logo::before { left: -15px; top: 20px; }
  .logo::after { right: -15px; bottom: 18px; animation-delay: -1.2s; }
  .logo span {
    display: grid; place-items: center;
    border-radius: 16px;
    background: linear-gradient(145deg, var(--tile-hi), var(--tile));
    box-shadow: inset 0 4px 0 rgba(255,255,255,.22), inset 0 -5px 0 var(--tile-shadow), 0 8px 16px rgba(0,0,0,.20);
    font-size: 28px;
  }
  .logo span:nth-child(3n) { background: linear-gradient(145deg, #ff91c6, #d959a1); box-shadow: inset 0 4px 0 rgba(255,255,255,.22), inset 0 -5px 0 #98366f, 0 8px 16px rgba(0,0,0,.20); }
  .logo span:nth-child(5n) { background: linear-gradient(145deg, #65e6ff, #399ac9); box-shadow: inset 0 4px 0 rgba(255,255,255,.22), inset 0 -5px 0 #26729a, 0 8px 16px rgba(0,0,0,.20); }
  .hint-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    flex-wrap: wrap;
    max-width: min(92vw, 430px);
  }
  .hint-step {
    min-width: 64px;
    min-height: 54px;
    padding: 8px 12px;
    border-radius: 19px;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    font-size: 25px;
    background: rgba(255,255,255,.11);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 12px 26px rgba(0,0,0,.14);
  }
  .hint-arrow {
    opacity: .72;
    font-size: 22px;
    transform: translateY(-1px);
  }
  .start {
    border-radius: 999px;
    padding: 18px 34px;
    font-size: clamp(26px, 8vw, 44px);
    font-weight: 900;
    letter-spacing: .02em;
    background: linear-gradient(145deg, #ffe879, #ff9f43 60%, #ff6978);
    color: #3b1840;
    text-shadow: 0 1px 0 rgba(255,255,255,.35);
  }
  .game-wrap { display: grid; align-content: center; justify-items: center; gap: 13px; }
  .hud { width: min-content; min-width: min(100%, 320px); }
  .pill {
    min-width: 90px;
    height: 48px;
    border-radius: 999px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 0 18px;
    font-size: 24px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
  }
  .board {
    --cols: 8;
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--cell));
    gap: var(--gap);
    padding: 10px;
    border-radius: 24px;
    background: rgba(5,10,28,.38);
    box-shadow: 0 24px 70px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.14);
    touch-action: none;
  }
  .cell {
    width: var(--cell); height: var(--cell);
    border: 0;
    border-radius: 12px;
    display: grid; place-items: center;
    padding: 0;
    font-size: calc(var(--cell) * .48);
    font-weight: 1000;
    line-height: 1;
    cursor: pointer;
    color: var(--ink);
    background: linear-gradient(145deg, var(--tile-hi), var(--tile));
    box-shadow: inset 0 4px 0 rgba(255,255,255,.22), inset 0 -5px 0 var(--tile-shadow), 0 6px 10px rgba(0,0,0,.18);
    transition: transform .12s ease, filter .12s ease, background .12s ease, box-shadow .12s ease;
  }
  .cell.hidden:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .cell.revealed {
    cursor: default;
    background: linear-gradient(145deg, var(--flat), var(--flat2));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
    color: #fff5b8;
    transform: none;
  }
  .cell.zero { color: transparent; }
  .cell.marked { color: #fff; text-shadow: 0 2px 9px rgba(0,0,0,.28); }
  .cell.hazard { background: linear-gradient(145deg, rgba(255,100,124,.44), rgba(117,31,64,.50)); color: #fff; }
  .cell.sparkle { color: var(--gold); text-shadow: 0 0 13px rgba(255,215,92,.45); }
  .n1 { color: #82d7ff; } .n2 { color: #9dffae; } .n3 { color: #ffe071; } .n4 { color: #ffad75; }
  .n5 { color: #ff83af; } .n6 { color: #c79cff; } .n7 { color: #8effee; } .n8 { color: #f6f0ff; }
  .pop { animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.78); opacity: .45; } to { transform: scale(1); opacity: 1; } }
  @keyframes floaty { 0%, 100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-8px) rotate(8deg); } }
  .no-motion *, .no-motion *::before, .no-motion *::after { animation: none !important; transition: none !important; }
  .settings {
    position: absolute;
    inset: auto 16px 82px auto;
    display: none;
    gap: 10px;
    padding: 12px;
    border-radius: 26px;
    background: rgba(9,13,35,.70);
    box-shadow: 0 24px 70px rgba(0,0,0,.36), inset 0 1px 0 rgba(255,255,255,.15);
    backdrop-filter: blur(18px);
    z-index: 4;
  }
  .settings.open { display: flex; }
  .confirm { display: none; gap: 10px; }
  .confirm.open { display: flex; }
  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
    background: rgba(4,7,20,.54);
    backdrop-filter: blur(9px);
    z-index: 6;
    border-radius: 32px;
  }
  .overlay.open { display: grid; }
  .card {
    width: min(92vw, 420px);
    display: grid; justify-items: center; gap: 18px;
    padding: 30px;
    border-radius: 34px;
    background: linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.08));
    box-shadow: 0 28px 80px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .game-over { font-size: clamp(42px, 11vw, 68px); font-weight: 1000; color: #fff; text-align: center; }
  .new-best { font-size: clamp(25px, 7vw, 36px); font-weight: 1000; color: var(--gold); }
  .hide { display: none !important; }
  @media (max-height: 640px) { :root { --cell: clamp(25px, min(8.4vw, 6.5vh), 43px); --gap: 4px; } .icon { min-width: 46px; height: 46px; } .intro-card { transform: scale(.88); } .screen { gap: 8px; } .hint-row { max-width: 520px; } }
  @media (max-width: 420px) { :root { --gap: 4px; } .app { padding-left: 8px; padding-right: 8px; } .board { padding: 7px; border-radius: 18px; } .cell { border-radius: 9px; } }
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
(() => {
  'use strict';
  const WORDS = { start: 'Start Game', over: 'Game Over', again: 'Play Again', menu: 'Menu', best: 'New Best' };
  const hazardsByTheme = ['💣','👻','🔥','💀','🌵','⚡','🐞'];
  const marker = '🚩', sparkle = '✨';
  const dirs = [-1,0,1].flatMap(dr => [-1,0,1].map(dc => [dr, dc])).filter(([dr,dc]) => dr || dc);
  const orth = [[-1,0],[1,0],[0,-1],[0,1]];
  const app = document.getElementById('app');
  const state = {
    screen: 'menu', board: null, level: 1, best: Number(localStorage.getItem('emojiSweeperBest') || 0),
    sound: localStorage.getItem('emojiSweeperSound') !== '0', motion: localStorage.getItem('emojiSweeperMotion') !== '0',
    cursor: { r: 0, c: 0 }, settings: false, confirm: false, audio: null, newBest: false
  };
  function levelInfo(level) {
    if (level === 1) return { rows: 8, cols: 8, hazards: 8 };
    if (level === 2) return { rows: 9, cols: 9, hazards: 12 };
    if (level === 3) return { rows: 10, cols: 10, hazards: 16 };
    if (level === 4) return { rows: 12, cols: 12, hazards: 24 };
    return { rows: 14, cols: 14, hazards: Math.min(55, 30 + 3 * (level - 5)) };
  }
  function makeBoard(level) {
    const info = levelInfo(level);
    const cells = [];
    for (let r = 0; r < info.rows; r++) for (let c = 0; c < info.cols; c++) cells.push({ r, c, hazard:false, sparkle:false, revealed:false, marked:false, n:0 });
    return { ...info, level, cells, placed:false, over:false, won:false, hazardIcon: hazardsByTheme[(level-1) % hazardsByTheme.length], firstSafe: new Set() };
  }
  const idx = (b,r,c) => r * b.cols + c;
  const inBounds = (b,r,c) => r >= 0 && c >= 0 && r < b.rows && c < b.cols;
  const cell = (b,r,c) => b.cells[idx(b,r,c)];
  function around(b,r,c) { return dirs.filter(([dr,dc]) => inBounds(b, r+dr, c+dc)).map(([dr,dc]) => cell(b,r+dr,c+dc)); }
  function orthCells(b,r,c) { return orth.filter(([dr,dc]) => inBounds(b, r+dr, c+dc)).map(([dr,dc]) => cell(b,r+dr,c+dc)); }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function safeZoneFor(b,r,c) {
    const s = new Set([idx(b,r,c)]);
    around(b,r,c).forEach(x => s.add(idx(b,x.r,x.c)));
    return s;
  }
  function placeHazards(b, r, c) {
    b.firstSafe = safeZoneFor(b,r,c);
    const choices = b.cells.filter(x => !b.firstSafe.has(idx(b,x.r,x.c)));
    shuffle(choices).slice(0, b.hazards).forEach(x => x.hazard = true);
    b.cells.forEach(x => { x.n = around(b,x.r,x.c).filter(y => y.hazard).length; });
    const sparkleCount = Math.min(5, 2 + Math.floor(b.level / 3));
    const sparkleChoices = b.cells.filter(x => !x.hazard && !b.firstSafe.has(idx(b,x.r,x.c)));
    shuffle(sparkleChoices).slice(0, sparkleCount).forEach(x => x.sparkle = true);
    b.placed = true;
  }
  function beep(type='tap') {
    if (!state.sound) return;
    try {
      state.audio ||= new (window.AudioContext || window.webkitAudioContext)();
      const ctx = state.audio, osc = ctx.createOscillator(), gain = ctx.createGain();
      const hz = type === 'bad' ? 120 : type === 'win' ? 660 : type === 'sparkle' ? 920 : 420;
      osc.frequency.value = hz; osc.type = 'sine';
      gain.gain.setValueAtTime(.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.06, ctx.currentTime + .01);
      gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + (type === 'bad' ? .24 : .10));
      osc.connect(gain).connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + .28);
    } catch {}
  }
  function revealOne(b, x, q) {
    if (x.revealed || x.marked || x.hazard) return;
    x.revealed = true; q.push(x);
  }
  function floodZeros(b, starts, q) {
    const queue = starts.filter(x => x.n === 0 && !x.hazard);
    const seen = new Set(queue.map(x => idx(b,x.r,x.c)));
    while (queue.length) {
      const z = queue.shift();
      around(b,z.r,z.c).forEach(n => {
        if (n.marked || n.hazard) return;
        if (!n.revealed) revealOne(b,n,q);
        const id = idx(b,n.r,n.c);
        if (n.n === 0 && !seen.has(id)) { seen.add(id); queue.push(n); }
      });
    }
  }
  function doReveal(r, c, fromChord=false) {
    const b = state.board; if (!b || b.over || b.won || !inBounds(b,r,c)) return;
    const x = cell(b,r,c);
    if (!b.placed) placeHazards(b,r,c);
    if (x.marked) return;
    if (x.revealed) { chord(x); return; }
    if (x.hazard) { gameOver(); return; }
    const changed = [];
    revealOne(b,x,changed);
    let zeros = [x];
    if (x.sparkle) {
      orthCells(b,r,c).forEach(n => { if (!n.hazard && !n.marked) revealOne(b,n,changed); });
      zeros = changed.slice(); beep('sparkle');
    } else beep('tap');
    floodZeros(b, zeros, changed);
    renderBoardOnly(changed);
    checkWin();
  }
  function chord(x) {
    const b = state.board; if (!x.revealed || x.n < 1) return;
    if (around(b,x.r,x.c).filter(n => n.marked).length !== x.n) return;
    around(b,x.r,x.c).filter(n => !n.revealed && !n.marked).forEach(n => doReveal(n.r,n.c,true));
  }
  function toggleMark(r, c) {
    const b = state.board; if (!b || b.over || b.won || !inBounds(b,r,c)) return;
    const x = cell(b,r,c); if (x.revealed) return;
    x.marked = !x.marked; beep('tap'); render(); focusCursor();
  }
  function checkWin() {
    const b = state.board; if (!b || b.over) return;
    if (b.cells.every(x => x.hazard || x.revealed)) {
      b.won = true; beep('win'); state.level += 1;
      if (state.level > state.best) { state.best = state.level; state.newBest = true; localStorage.setItem('emojiSweeperBest', String(state.best)); }
      window.setTimeout(() => { state.board = makeBoard(state.level); state.cursor = {r:0,c:0}; render(); }, state.motion ? 420 : 0);
    }
  }
  function gameOver() {
    const b = state.board; b.over = true; b.cells.forEach(x => { if (x.hazard) x.revealed = true; }); beep('bad'); render();
  }
  function startGame(level=1) { state.level = level; state.newBest = false; state.board = makeBoard(level); state.screen = 'game'; state.cursor = {r:0,c:0}; state.settings = false; state.confirm = false; render(); window.setTimeout(focusCursor, 0); }
  function goMenu() { state.screen = 'menu'; state.board = null; state.settings = false; state.confirm = false; render(); }
  function resetBest() { state.best = 0; state.newBest = false; localStorage.setItem('emojiSweeperBest','0'); state.confirm = false; render(); }
  function btn(cls, text, label, fn) { return `<button class="${cls}" type="button" aria-label="${label}" data-action="${fn}">${text}</button>`; }
  function settingsHtml() {
    return `<div class="settings ${state.settings ? 'open' : ''}" aria-hidden="${!state.settings}">
      ${btn('icon', state.sound ? '🔊' : '🔇', 'sound', 'sound')}
      ${btn('icon', state.motion ? '🐇' : '🐢', 'motion', 'motion')}
      ${btn('icon', '🗑️', 'reset', 'confirm')}
      <div class="confirm ${state.confirm ? 'open' : ''}">
        ${btn('icon', '✓', 'yes', 'resetBest')}${btn('icon', '✕', 'no', 'cancelConfirm')}
      </div>
    </div>`;
  }
  function menuHtml() {
    return `<div class="screen">
      <div class="topbar">${btn('icon','🏆' + (state.best ? ' ' + state.best : ''),'best','noop')}${btn('icon','⚙️','settings','settings')}</div>
      <main class="menu-main">
        <div class="intro-card" aria-label="emoji sweeper preview">
          <div class="logo" aria-hidden="true"><span></span><span>${marker}</span><span></span><span>${sparkle}</span><span></span><span>💣</span><span></span><span></span><span>1</span><span></span><span>2</span><span></span></div>
          <div class="hint-row" aria-hidden="true">
            <div class="hint-step">👆 ◻️</div><div class="hint-arrow">›</div>
            <div class="hint-step">1 2</div><div class="hint-arrow">›</div>
            <div class="hint-step">${marker} 💣</div><div class="hint-arrow">›</div>
            <div class="hint-step">${sparkle} ⭐</div>
          </div>
        </div>
        ${btn('start', WORDS.start, WORDS.start, 'start')}
      </main><div></div>${settingsHtml()}
    </div>`;
  }
  function displayCell(x, b) {
    if (x.marked && !x.revealed) return marker;
    if (!x.revealed) return '';
    if (x.hazard && b.over) return b.hazardIcon;
    if (x.sparkle) return sparkle + (x.n ? x.n : '');
    return x.n ? String(x.n) : '';
  }
  function cellClass(x, b) {
    const arr = ['cell'];
    if (!x.revealed) arr.push('hidden'); else arr.push('revealed', x.n ? 'n'+x.n : 'zero');
    if (x.marked && !x.revealed) arr.push('marked');
    if (x.hazard && b.over) arr.push('hazard');
    if (x.sparkle && x.revealed) arr.push('sparkle');
    if (x.revealed && state.motion) arr.push('pop');
    return arr.join(' ');
  }
  function ariaCell(x,b) {
    const parts = [`row ${x.r+1}`, `column ${x.c+1}`, x.marked && !x.revealed ? 'marked' : x.revealed ? 'revealed' : 'hidden'];
    if (b.over && x.hazard) parts.push('hazard');
    if (x.revealed && !x.hazard) parts.push(`number ${x.n}`);
    return parts.join(', ');
  }
  function boardHtml() {
    const b = state.board;
    const remaining = b.hazards - b.cells.filter(x => x.marked).length;
    return `<div class="screen">
      <div></div><main class="game-wrap">
        <div class="hud"><div class="pill" aria-label="remaining hazards"><span>${remaining}</span></div><div class="pill" aria-label="level"><span>⭐</span><span>${b.level}</span></div></div>
        <div class="board" style="--cols:${b.cols}" role="grid" aria-rowcount="${b.rows}" aria-colcount="${b.cols}">
          ${b.cells.map(x => `<button type="button" role="gridcell" aria-label="${ariaCell(x,b)}" aria-rowindex="${x.r+1}" aria-colindex="${x.c+1}" class="${cellClass(x,b)}" data-r="${x.r}" data-c="${x.c}" tabindex="${state.cursor.r===x.r&&state.cursor.c===x.c?0:-1}">${displayCell(x,b)}</button>`).join('')}
        </div>
        <div class="bottombar">${btn('icon','⚙️','settings','settings')}${btn('icon','🏠','menu','menu')}</div>
      </main><div></div>${settingsHtml()}
      <div class="overlay ${b.over ? 'open' : ''}"><div class="card"><div class="game-over">${WORDS.over}</div><div class="new-best ${state.newBest ? '' : 'hide'}">${WORDS.best}</div>${btn('start',WORDS.again,WORDS.again,'start')}${btn('start',WORDS.menu,WORDS.menu,'menu')}</div></div>
    </div>`;
  }
  function render() {
    app.classList.toggle('no-motion', !state.motion);
    app.innerHTML = state.screen === 'menu' ? menuHtml() : boardHtml();
  }
  function renderBoardOnly() { render(); focusCursor(); }
  function focusCursor() { const el = app.querySelector(`.cell[data-r="${state.cursor.r}"][data-c="${state.cursor.c}"]`); if (el) el.focus({preventScroll:true}); }
  app.addEventListener('click', e => {
    const action = e.target.closest('[data-action]')?.dataset.action;
    if (suppressClick) { suppressClick = false; e.preventDefault(); e.stopPropagation(); return; }
    if (action) {
      if (action === 'start') startGame(1);
      if (action === 'menu') goMenu();
      if (action === 'settings') { state.settings = !state.settings; state.confirm = false; render(); }
      if (action === 'sound') { state.sound = !state.sound; localStorage.setItem('emojiSweeperSound', state.sound ? '1' : '0'); render(); }
      if (action === 'motion') { state.motion = !state.motion; localStorage.setItem('emojiSweeperMotion', state.motion ? '1' : '0'); render(); }
      if (action === 'confirm') { state.confirm = !state.confirm; render(); }
      if (action === 'resetBest') resetBest();
      if (action === 'cancelConfirm') { state.confirm = false; render(); }
      return;
    }
    const el = e.target.closest('.cell'); if (!el) return;
    const r = Number(el.dataset.r), c = Number(el.dataset.c); state.cursor = {r,c}; doReveal(r,c);
  });
  app.addEventListener('contextmenu', e => {
    const el = e.target.closest('.cell'); if (!el) return;
    e.preventDefault(); const r = Number(el.dataset.r), c = Number(el.dataset.c); state.cursor = {r,c}; toggleMark(r,c);
  });
  let pressTimer = 0, longDone = false, suppressClick = false;
  app.addEventListener('pointerdown', e => {
    const el = e.target.closest('.cell'); if (!el || e.pointerType === 'mouse') return;
    longDone = false; const r = Number(el.dataset.r), c = Number(el.dataset.c);
    pressTimer = window.setTimeout(() => { longDone = true; state.cursor = {r,c}; toggleMark(r,c); }, 450);
  });
  app.addEventListener('pointerup', e => { clearTimeout(pressTimer); if (longDone) { suppressClick = true; e.preventDefault(); e.stopPropagation(); } }, true);
  app.addEventListener('pointercancel', () => clearTimeout(pressTimer));
  app.addEventListener('keydown', e => {
    if (state.screen !== 'game' || !state.board) return;
    const b = state.board; let {r,c} = state.cursor;
    if (e.key === 'ArrowUp') r = Math.max(0, r-1); else if (e.key === 'ArrowDown') r = Math.min(b.rows-1, r+1); else if (e.key === 'ArrowLeft') c = Math.max(0, c-1); else if (e.key === 'ArrowRight') c = Math.min(b.cols-1, c+1); else if (e.key === 'Enter') { e.preventDefault(); doReveal(r,c); return; } else if (e.key === ' ') { e.preventDefault(); toggleMark(r,c); return; } else return;
    e.preventDefault(); state.cursor = {r,c}; render(); focusCursor();
  });
  window.EmojiSweeper = { state, levelInfo, startGame, doReveal, toggleMark, cell, placeHazards, safeZoneFor, render };
  render();
})();
