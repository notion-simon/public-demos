<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>▥</title><style>:root{--bg:#111827;--panel:#1f2937;--cell:#0b1020;--grid:#283244;--txt:#f8fafc;--a:#60a5fa;--o:#facc15;--focus:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#334155,#111827 55%,#020617);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center}button{font:inherit;color:inherit;background:#2563eb;border:0;border-radius:18px;padding:14px 24px;box-shadow:0 12px 30px #0006;cursor:pointer}button:focus,.cell:focus{outline:2px solid var(--focus);outline-offset:2px}.screen{width:min(96vw,760px);min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;position:relative}.topIcon{position:absolute;top:16px;font-size:30px;background:#ffffff14;border-radius:16px;padding:8px 10px}.left{left:16px}.right{right:16px}.logo{display:grid;grid-template-columns:repeat(4,36px);gap:5px;transform:rotate(-8deg);filter:drop-shadow(0 20px 20px #0008)}.logo i{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#22d3ee,#2563eb)}.logo i:nth-child(2),.logo i:nth-child(5){background:linear-gradient(135deg,#facc15,#f97316)}.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:start;width:min(96vw,760px)}.stat{font-size:30px;font-weight:800;text-shadow:0 3px 8px #000}.sub{font-size:22px;color:#cbd5e1}.rt{text-align:right}.boardWrap{display:flex;gap:20px;align-items:center;justify-content:center}.board{display:grid;grid-template-columns:repeat(10,28px);grid-template-rows:repeat(20,28px);gap:2px;background:#0f172a;padding:8px;border-radius:16px;border:2px solid #475569;box-shadow:0 24px 50px #0008}.cell{width:28px;height:28px;border-radius:5px;background:var(--cell);border:1px solid var(--grid)}.filled{box-shadow:inset 0 2px 8px #fff5}.I{background:#22d3ee}.O{background:#facc15}.T{background:#c084fc}.S{background:#4ade80}.Z{background:#fb7185}.J{background:#60a5fa}.L{background:#fb923c}.preview{display:grid;grid-template-columns:repeat(4,22px);grid-template-rows:repeat(4,22px);gap:2px;background:#ffffff12;padding:10px;border-radius:14px}.pcell{width:22px;height:22px;border-radius:4px;background:#0f172a}.controls{display:flex;gap:18px}.iconBtn{background:#ffffff12;font-size:28px;padding:10px 14px;border-radius:16px}.overlay{position:fixed;inset:0;background:#020617cc;display:grid;place-items:center;z-index:5}.panel{background:#1e293b;border:1px solid #64748b;border-radius:24px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:18px;min-width:260px;box-shadow:0 25px 80px #000}.big{font-size:42px;font-weight:900}.row{display:flex;gap:14px}.tiny{background:#ffffff12}.flash{animation:flash .18s 4}@keyframes flash{50%{filter:brightness(2)}}@media(max-width:650px){.hud{grid-template-columns:1fr 1fr}.boardWrap{grid-column:1/3;flex-direction:column}.board{grid-template-columns:repeat(10,8.2vw);grid-template-rows:repeat(20,8.2vw)}.cell{width:8.2vw;height:8.2vw}.screen{justify-content:flex-start;padding-top:68px}.stat{font-size:26px}}
</style></head><body><main id="app"></main><script>(()=>{const W=10,H=20,TYPES='IOTSZJL'.split('');
const SH={I:[[0,1],[1,1],[2,1],[3,1]],O:[[1,0],[2,0],[1,1],[2,1]],T:[[1,0],[0,1],[1,1],[2,1]],S:[[1,0],[2,0],[0,1],[1,1]],Z:[[0,0],[1,0],[1,1],[2,1]],J:[[0,0],[0,1],[1,1],[2,1]],L:[[2,0],[0,1],[1,1],[2,1]]};
let S,app=document.getElementById('app'),timer=0,last=0,touch=null,best=+localStorage.bestBlocks||0,sound=localStorage.soundBlocks!=='0',motion=localStorage.motionBlocks!=='0';
function bag(){let a=[...TYPES];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function draw(){if(!S.bag.length)S.bag=bag();return S.bag.pop()}function piece(t){return{t,x:3,y:0,r:0}}function cells(p=p){return SH[p.t].map(([x,y])=>{let X=x-1.5,Y=y-1.5;for(let i=0;i<p.r;i++){[X,Y]=[-Y,X]}return{x:Math.round(X+1.5)+p.x,y:Math.round(Y+1.5)+p.y}})}
function can(p){return cells(p).every(c=>c.x>=0&&c.x<W&&c.y>=0&&c.y<H&&!S.board[c.y][c.x])}function start(){S={board:Array.from({length:H},()=>Array(W).fill('')),score:0,level:1,lines:0,fall:800,bag:bag(),over:false,paused:false};S.cur=piece(draw());S.next=draw();if(!can(S.cur))over();render();requestAnimationFrame(loop)}
function loop(t){if(S&&!S.over&&!S.paused){if(!last)last=t;if(t-last>S.fall){drop(false);last=t}requestAnimationFrame(loop)}}function drop(soft){let p={...S.cur,y:S.cur.y+1};if(can(p)){S.cur=p;if(soft)S.score++;render();return true}lock();return false}function hard(){let n=0;while(can({...S.cur,y:S.cur.y+1})){S.cur.y++;n++}S.score+=2*n;lock()}function rotate(dir){let base={...S.cur,r:(S.cur.r+dir+4)%4};for(let k of [0,-1,1,-2,2]){let p={...base,x:base.x+k};if(can(p)){S.cur=p;render();return}}}
function move(dx){let p={...S.cur,x:S.cur.x+dx};if(can(p)){S.cur=p;render()}}function lock(){for(let c of cells(S.cur))if(c.y>=0)S.board[c.y][c.x]=S.cur.t;let full=[];S.board.forEach((r,i)=>{if(r.every(Boolean))full.push(i)});if(full.length){if(motion)flash(full);S.board=S.board.filter((_,i)=>!full.includes(i));while(S.board.length<H)S.board.unshift(Array(W).fill(''));S.score+=[0,100,300,500,800][full.length]*S.level;S.lines+=full.length;S.level=Math.floor(S.lines/10)+1;S.fall=Math.max(100,800-60*(S.level-1))}S.cur=piece(S.next);S.next=draw();if(!can(S.cur))over();render()}function over(){S.over=true;let nb=S.score>best;if(nb){best=S.score;localStorage.bestBlocks=best}render(nb)}
function boardHTML(){let occ={};if(S&&!S.over)for(let c of cells(S.cur))occ[c.y+','+c.x]=S.cur.t;return Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>{let t=occ[y+','+x]||S.board[y][x];return `<div tabindex="0" role="gridcell" aria-label="row ${y+1} column ${x+1} ${t?'filled '+t:'empty'}" class="cell ${t?'filled '+t:''}"></div>`}).join('')).join('')}function prev(){let p=piece(S.next),cs=cells(p).map(c=>[c.x-3,c.y]);return Array.from({length:16},(_,i)=>{let x=i%4,y=i>>2,on=cs.some(c=>c[0]===x&&c[1]===y);return `<i class="pcell ${on?S.next:''}"></i>`}).join('')}
function menu(){app.innerHTML=`<section class=screen><div class="topIcon left">🏆</div><button class="topIcon right iconBtn" onclick="settings()">⚙️</button><div class=logo>${'<i></i>'.repeat(8)}</div><button onclick="gameStart()">Start Game</button></section>`}window.gameStart=start;window.closeOverlay=()=>document.querySelector('.overlay')?.remove();window.toggleSound=b=>{sound=!sound;localStorage.soundBlocks=sound?'1':'0';b.textContent=sound?'🔊':'🔇'};window.toggleMotion=b=>{motion=!motion;localStorage.motionBlocks=motion?'1':'0';b.textContent=motion?'✨':'○'};window.resetBest=()=>{best=0;localStorage.bestBlocks=0;closeOverlay()};window.toMenu=()=>{S=null;menu()};window.settings=()=>{app.insertAdjacentHTML('beforeend',`<div class=overlay><div class=panel><div class=row><button class=tiny onclick="toggleSound(this)">${sound?'🔊':'🔇'}</button><button class=tiny onclick="toggleMotion(this)">${motion?'✨':'○'}</button><button class=tiny onclick="this.nextElementSibling.style.display='flex'">🗑️</button><span style="display:none;gap:8px"><button class=tiny onclick="resetBest()">✓</button><button class=tiny onclick="closeOverlay()">×</button></span></div><button onclick="closeOverlay()">Menu</button></div></div>`)}
function render(nb=false){if(!S){menu();return}app.innerHTML=`<section class=screen><div class=hud><div><div class=stat>${S.score}</div><div class=sub>${S.lines}</div></div><div class=boardWrap><div class=board role=grid>${boardHTML()}</div><div class=preview>${prev()}</div></div><div class="stat rt">⭐ ${S.level}</div></div><div class=controls><button class=iconBtn onclick="pause()">⏸</button><button class=iconBtn onclick="settings()">⚙️</button></div></section>`;if(S.paused)overlay('Paused');if(S.over)app.insertAdjacentHTML('beforeend',`<div class=overlay><div class=panel><div class=big>Game Over</div><div class=stat>${S.score}</div><div class=stat>🏆 ${best}</div>${nb?'<div>New Best</div>':''}<button onclick="gameStart()">Play Again</button><button onclick="toMenu()">Menu</button></div></div>`)}function overlay(txt){app.insertAdjacentHTML('beforeend',`<div class=overlay><div class=panel><div class=big>${txt}</div><button onclick="pause()">▶</button></div></div>`)}window.pause=()=>{if(S&&!S.over){S.paused=!S.paused;last=0;render();if(!S.paused)requestAnimationFrame(loop)}};function flash(rows){setTimeout(()=>rows.forEach(y=>document.querySelectorAll('.board .cell')[y*W]?.classList.add('flash')),0)}
addEventListener('keydown',e=>{if(!S||S.over)return;if(e.key==='p'||e.key==='P'){pause();return}if(S.paused)return;({'ArrowLeft':()=>move(-1),'ArrowRight':()=>move(1),'ArrowDown':()=>drop(true),'ArrowUp':()=>rotate(1),'z':()=>rotate(-1),'Z':()=>rotate(-1),' ':hard}[e.key]||(()=>{}))();if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key))e.preventDefault()});app.addEventListener('touchstart',e=>{touch={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()}},{passive:true});app.addEventListener('touchend',e=>{if(!S||S.paused||S.over||!touch)return;let q=e.changedTouches[0],dx=q.clientX-touch.x,dy=q.clientY-touch.y;if(Math.abs(dx)<25&&Math.abs(dy)<25)rotate(1);else if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy>80)hard();else if(dy>25)drop(true)});window.__game={start,move,drop,hard,rotate,get S(){return S},can,cells};menu();})();
</script></body></html>
