<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Laser Mirror Puzzle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1220; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
#app { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }

.screen { width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.screen.active { display: flex; }

.icon-btn { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 14px; background: rgba(255,255,255,0.06); transition: background 0.2s, transform 0.1s; border: none; color: inherit; }
.icon-btn:hover { background: rgba(255,255,255,0.12); }
.icon-btn:active { transform: scale(0.95); }
.icon-btn svg { width: 26px; height: 26px; fill: currentColor; }

.menu-header { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 20px; z-index: 10; }
.logo { display: flex; flex-direction: column; align-items: center; gap: 28px; margin-bottom: 40px; }
.logo-svg { width: 140px; height: 140px; }
.logo-title { font-size: 28px; font-weight: 800; letter-spacing: 2px; color: #e2e8f0; }
.start-btn { padding: 18px 52px; font-size: 20px; font-weight: 700; color: #0b1220; background: #38bdf8; border: none; border-radius: 14px; cursor: pointer; transition: transform 0.2s, background 0.2s, box-shadow 0.2s; box-shadow: 0 4px 20px rgba(56,189,248,0.3); }
.start-btn:hover { transform: scale(1.06); background: #7dd3fc; box-shadow: 0 6px 28px rgba(56,189,248,0.4); }
.play-again-btn { padding: 14px 40px; font-size: 16px; font-weight: 600; color: #e2e8f0; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15); border-radius: 14px; cursor: pointer; transition: background 0.2s; margin-top: 12px; }
.play-again-btn:hover { background: rgba(255,255,255,0.14); }

.game-header { width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; }
.stat { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; }
.stat svg { width: 22px; height: 22px; }

.board-wrap { position: relative; margin: 8px 0; }
.board { display: grid; background: #1e293b; padding: 3px; border-radius: 10px; border: 2px solid #334155; }
.cell { width: var(--cell-size); height: var(--cell-size); background: #0f172a; border: 1px solid #1e293b; position: relative; display: flex; align-items: center; justify-content: center; cursor: default; transition: background 0.15s; }
.cell.mirror { cursor: pointer; }
.cell.mirror:hover { background: #162032; }
.cell.focused { box-shadow: inset 0 0 0 3px #38bdf8; z-index: 2; }

.cell.emitter::after { content: ''; width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 11px solid #22d3ee; filter: drop-shadow(0 0 4px #22d3ee); }
.cell.target::after { content: ''; width: 18px; height: 18px; border-radius: 50%; background: #475569; border: 2px solid #334155; transition: background 0.3s, box-shadow 0.3s, border-color 0.3s; }
.cell.target.lit::after { background: #fbbf24; border-color: #f59e0b; box-shadow: 0 0 14px #fbbf24, 0 0 28px rgba(251,191,36,0.4); }
.cell.blocker { background: #1e293b; }
.cell.blocker::after { content: ''; width: 60%; height: 60%; background: #475569; border-radius: 6px; border: 2px solid #334155; }
.cell.slash::before { content: ''; width: 70%; height: 4px; background: #cbd5e1; border-radius: 2px; transform: rotate(-45deg); box-shadow: 0 0 4px rgba(203,213,225,0.3); }
.cell.backslash::before { content: ''; width: 70%; height: 4px; background: #cbd5e1; border-radius: 2px; transform: rotate(45deg); box-shadow: 0 0 4px rgba(203,213,225,0.3); }

.cell.hc { border-width: 2px; border-color: #64748b; }
.cell.hc.slash::before, .cell.hc.backslash::before { height: 6px; }

.laser-svg { position: absolute; top: 3px; left: 3px; width: calc(var(--grid-size) * var(--cell-size)); height: calc(var(--grid-size) * var(--cell-size)); pointer-events: none; z-index: 10; }
.laser-path { fill: none; stroke: #ef4444; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 3px rgba(239,68,68,0.6)); opacity: 0.95; transition: stroke-width 0.2s; }
.laser-path.hc { stroke-width: 5; filter: drop-shadow(0 0 5px rgba(239,68,68,0.8)); }
.laser-path.motion { stroke-dasharray: 8 6; animation: dash 0.4s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -14; } }

.game-footer { width: 100%; display: flex; justify-content: center; gap: 40px; padding: 20px; }

.settings-title { font-size: 24px; font-weight: 700; margin-bottom: 24px; }
.settings-list { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; padding: 0 24px; }
.row { display: flex; align-items: center; justify-content: space-between; padding: 16px; background: rgba(255,255,255,0.05); border-radius: 12px; }
.row-left { display: flex; align-items: center; gap: 14px; font-size: 17px; font-weight: 600; }
.row-left svg { width: 24px; height: 24px; }
.toggle { width: 50px; height: 30px; background: #475569; border-radius: 15px; position: relative; cursor: pointer; transition: background 0.2s; }
.toggle.on { background: #38bdf8; }
.toggle-knob { width: 24px; height: 24px; background: white; border-radius: 50%; position: absolute; top: 3px; left: 3px; transition: left 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
.toggle.on .toggle-knob { left: 23px; }

.reset-row { display: flex; align-items: center; justify-content: space-between; padding: 16px; background: rgba(255,255,255,0.05); border-radius: 12px; }
.reset-label { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 14px; }
.reset-confirm { display: flex; gap: 10px; }
.reset-confirm .icon-btn { width: 40px; height: 40px; }

.settings-footer { margin-top: 24px; }

.best-screen { text-align: center; }
.best-trophy { width: 80px; height: 80px; fill: #fbbf24; margin-bottom: 12px; filter: drop-shadow(0 0 10px rgba(251,191,36,0.4)); }
.best-label { font-size: 18px; color: #94a3b8; margin-bottom: 6px; }
.best-number { font-size: 56px; font-weight: 800; margin-bottom: 32px; }
.best-footer { margin-top: 8px; }

.popup { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); background: #fbbf24; color: #0b1220; padding: 14px 28px; border-radius: 14px; font-weight: 800; font-size: 20px; pointer-events: none; z-index: 100; transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 4px 20px rgba(251,191,36,0.4); }
.popup.show { transform: translate(-50%, -50%) scale(1); }

@keyframes pulse-target {
  0% { transform: scale(1); }
  40% { transform: scale(1.3); }
  100% { transform: scale(1); }
}
.pulse .cell.target.lit::after { animation: pulse-target 0.5s ease-out; }

*:focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; border-radius: 4px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));

function create(el, attrs={}, children=[]) {
  const dom = document.createElement(el);
  Object.entries(attrs).forEach(([k,v]) => dom.setAttribute(k,v));
  children.forEach(c => dom.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
  return dom;
}

const ICONS = {
  trophy: '<svg viewBox="0 0 24 24"><path d="M5 3h14v2h-1v3a5 5 0 0 1-3.5 8.6V20h7v2H7v-2h7v-2.4A5 5 0 0 1 10.5 8V5H9V3zM7 5v3a3 3 0 0 0 3 3h4a3 3 0 0 0 3-3V5H7z"/></svg>',
  gear: '<svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.32.07-.66.07-1s-.03-.68-.07-1l2.11-1.65a.5.5 0 0 0 .11-.66l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.03 7.03 0 0 0-1.73-1l-.38-2.65A.5.5 0 0 0 14 1h-4a.5.5 0 0 0-.48.38l-.38 2.65a7.03 7.03 0 0 0-1.73 1l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46c-.13.22-.07.5.11.66l2.11 1.65c-.04.32-.07.66-.07 1s.03.68.07 1l-2.11 1.65a.5.5 0 0 0-.11.66l2 3.46a.5.5 0 0 0 .61.22l2.49-1a7.03 7.03 0 0 0 1.73 1l.38 2.65c.05.26.29.42.55.42h4a.5.5 0 0 0 .48-.38l.38-2.65a7.03 7.03 0 0 0 1.73-1l2.49 1c.23.09.49 0 .61-.22l2-3.46a.5.5 0 0 0-.11-.66l-2.11-1.65zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>',
  star: '<svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>',
  speaker: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71z"/></svg>',
  motion: '<svg viewBox="0 0 24 24"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9 7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.2L8 8v2h1.8l0-1.1z"/></svg>',
  contrast: '<svg viewBox="0 0 24 24"><path d="M12 22c5.52 0 10-4.48 10-10S17.52 2 12 2 2 6.48 2 12s4.48 10 10 10zm0-18c4.42 0 8 3.58 8 8s-3.58 8-8 8V4z"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>',
  home: '<svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>',
};

const state = {
  screen: 'menu',
  level: 1,
  moves: 0,
  best: 0,
  sound: false,
  motion: true,
  hc: false,
  resetting: false,
  board: null,
  gridSize: 0,
  targetCount: 0,
  focusRow: 0,
  focusCol: 0,
  litTargets: new Set(),
  animatingComplete: false,
};

function load() {
  try {
    const s = JSON.parse(localStorage.getItem('laserMirror') || '{}');
    if (typeof s.best === 'number') state.best = s.best;
    if (typeof s.sound === 'boolean') state.sound = s.sound;
    if (typeof s.motion === 'boolean') state.motion = s.motion;
    if (typeof s.hc === 'boolean') state.hc = s.hc;
  } catch (e) {}
}
function save() {
  try {
    localStorage.setItem('laserMirror', JSON.stringify({ best: state.best, sound: state.sound, motion: state.motion, hc: state.hc }));
  } catch (e) {}
}

load();

function buildMenu() {
  const screen = create('div', { class: 'screen', id: 'menu' });
  const header = create('div', { class: 'menu-header' });
  header.appendChild(create('button', { class: 'icon-btn', 'aria-label': 'Best level', title: 'Best level' }, [create('div', { innerHTML: ICONS.trophy })]));
  header.lastChild.addEventListener('click', () => showBest());
  header.appendChild(create('button', { class: 'icon-btn', 'aria-label': 'Settings', title: 'Settings' }, [create('div', { innerHTML: ICONS.gear })]));
  header.lastChild.addEventListener('click', () => showSettings());

  const logo = create('div', { class: 'logo' });
  const svg = createNS('svg', { class: 'logo-svg', viewBox: '0 0 100 100' });
  const defs = createNS('defs');
  const grad = createNS('linearGradient', { id: 'logoGrad', x1:'0%', y1:'0%', x2:'100%', y2:'100%' });
  grad.appendChild(createNS('stop', { offset:'0%', 'stop-color':'#38bdf8' }));
  grad.appendChild(createNS('stop', { offset:'100%', 'stop-color':'#fbbf24' }));
  defs.appendChild(grad);
  svg.appendChild(defs);
  svg.appendChild(createNS('polygon', { points:'5,50 35,30 35,70', fill:'#22d3ee' }));
  svg.appendChild(createNS('polygon', { points:'95,50 65,30 65,70', fill:'#22d3ee' }));
  svg.appendChild(createNS('rect', { x:'42', y:'42', width:'16', height:'16', transform:'rotate(45 50 50)', fill:'url(#logoGrad)', rx:'2' }));
  logo.appendChild(svg);
  logo.appendChild(create('div', { class: 'logo-title' }, ['LASER PUZZLE']));

  const start = create('button', { class: 'start-btn' }, ['Start Game']);
  start.addEventListener('click', () => { state.level = 1; state.moves = 0; buildLevel(); showScreen('game'); });

  const playAgain = create('button', { class: 'play-again-btn' }, ['Play Again']);
  playAgain.addEventListener('click', () => { state.level = 1; state.moves = 0; buildLevel(); showScreen('game'); });

  screen.appendChild(header);
  screen.appendChild(logo);
  screen.appendChild(start);
  screen.appendChild(playAgain);
  return screen;
}

function buildGame() {
  const screen = create('div', { class: 'screen', id: 'game' });
  const header = create('div', { class: 'game-header' });
  const movesStat = create('div', { class: 'stat' }, [create('div', { innerHTML: ICONS.motion }), create('span', { id: 'moves-num' }, ['0'])]);
  const levelStat = create('div', { class: 'stat' }, [create('div', { innerHTML: ICONS.star }), create('span', { id: 'level-num' }, ['1'])]);
  header.appendChild(movesStat);
  header.appendChild(levelStat);

  const boardWrap = create('div', { class: 'board-wrap', id: 'board-wrap' });
  const board = create('div', { class: 'board', id: 'board', role: 'grid', tabindex: '0' });
  board.addEventListener('keydown', onBoardKey);
  boardWrap.appendChild(board);
  const laserSvg = createNS('svg', { class: 'laser-svg', id: 'laser-svg' });
  boardWrap.appendChild(laserSvg);

  const footer = create('div', { class: 'game-footer' });
  const homeBtn = create('button', { class: 'icon-btn', 'aria-label': 'Menu' }, [create('div', { innerHTML: ICONS.home })]);
  homeBtn.addEventListener('click', () => showScreen('menu'));
  const gearBtn = create('button', { class: 'icon-btn', 'aria-label': 'Settings' }, [create('div', { innerHTML: ICONS.gear })]);
  gearBtn.addEventListener('click', () => showSettings());
  footer.appendChild(homeBtn);
  footer.appendChild(gearBtn);

  const popup = create('div', { class: 'popup', id: 'newbest' }, ['New Best']);

  screen.appendChild(header);
  screen.appendChild(boardWrap);
  screen.appendChild(footer);
  screen.appendChild(popup);
  return screen;
}

function buildSettings() {
  const screen = create('div', { class: 'screen', id: 'settings' });
  screen.appendChild(create('div', { class: 'settings-title' }, ['Settings']));
  const list = create('div', { class: 'settings-list' });

  const speakerRow = create('div', { class: 'row' });
  const speakerLeft = create('div', { class: 'row-left' }, [create('div', { innerHTML: ICONS.speaker }), 'Sound']);
  const speakerToggle = create('button', { class: 'toggle ' + (state.sound ? 'on' : ''), 'aria-label': 'Toggle sound' }, [create('div', { class: 'toggle-knob' })]);
  speakerToggle.addEventListener('click', () => { state.sound = !state.sound; speakerToggle.classList.toggle('on', state.sound); save(); });
  speakerRow.appendChild(speakerLeft); speakerRow.appendChild(speakerToggle);
  list.appendChild(speakerRow);

  const motionRow = create('div', { class: 'row' });
  const motionLeft = create('div', { class: 'row-left' }, [create('div', { innerHTML: ICONS.motion }), 'Motion']);
  const motionToggle = create('button', { class: 'toggle ' + (state.motion ? 'on' : ''), 'aria-label': 'Toggle motion' }, [create('div', { class: 'toggle-knob' })]);
  motionToggle.addEventListener('click', () => { state.motion = !state.motion; motionToggle.classList.toggle('on', state.motion); save(); redrawLaser(); });
  motionRow.appendChild(motionLeft); motionRow.appendChild(motionToggle);
  list.appendChild(motionRow);

  const hcRow = create('div', { class: 'row' });
  const hcLeft = create('div', { class: 'row-left' }, [create('div', { innerHTML: ICONS.contrast }), 'High Contrast']);
  const hcToggle = create('button', { class: 'toggle ' + (state.hc ? 'on' : ''), 'aria-label': 'Toggle high contrast' }, [create('div', { class: 'toggle-knob' })]);
  hcToggle.addEventListener('click', () => { state.hc = !state.hc; hcToggle.classList.toggle('on', state.hc); save(); renderBoard(); redrawLaser(); });
  hcRow.appendChild(hcLeft); hcRow.appendChild(hcToggle);
  list.appendChild(hcRow);

  const resetRow = create('div', { class: 'reset-row' });
  const resetLabel = create('div', { class: 'reset-label' }, [create('div', { innerHTML: ICONS.trash }), 'Reset Best']);
  const resetConfirm = create('div', { class: 'reset-confirm' });
  const checkBtn = create('button', { class: 'icon-btn', 'aria-label': 'Confirm reset' }, [create('div', { innerHTML: ICONS.check })]);
  checkBtn.addEventListener('click', () => { state.best = 0; save(); hideResetConfirm(); });
  const xBtn = create('button', { class: 'icon-btn', 'aria-label': 'Cancel reset' }, [create('div', { innerHTML: ICONS.x })]);
  xBtn.addEventListener('click', hideResetConfirm);
  resetConfirm.appendChild(checkBtn);
  resetConfirm.appendChild(xBtn);
  resetRow.appendChild(resetLabel);
  resetRow.appendChild(resetConfirm);
  resetConfirm.style.display = 'none';
  list.appendChild(resetRow);

  screen.appendChild(list);

  const homeBtn = create('button', { class: 'icon-btn settings-footer', 'aria-label': 'Menu' }, [create('div', { innerHTML: ICONS.home })]);
  homeBtn.addEventListener('click', () => showScreen('menu'));
  screen.appendChild(homeBtn);

  screen._resetConfirm = resetConfirm;
  function showResetConfirm() { resetConfirm.style.display = 'flex'; state.resetting = true; }
  function hideResetConfirm() { resetConfirm.style.display = 'none'; state.resetting = false; }
  resetLabel.addEventListener('click', () => { if (!state.resetting) showResetConfirm(); });

  return screen;
}

function buildBest() {
  const screen = create('div', { class: 'screen best-screen', id: 'best' });
  screen.appendChild(create('div', { class: 'best-trophy', innerHTML: ICONS.trophy }));
  screen.appendChild(create('div', { class: 'best-label' }, ['Best Level']));
  screen.appendChild(create('div', { class: 'best-number', id: 'best-num' }, ['0']));
  const homeBtn = create('button', { class: 'icon-btn best-footer', 'aria-label': 'Menu' }, [create('div', { innerHTML: ICONS.home })]);
  homeBtn.addEventListener('click', () => showScreen('menu'));
  screen.appendChild(homeBtn);
  return screen;
}

function createNS(tag, attrs={}) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k,v));
  return el;
}

const app = $('#app');
app.appendChild(buildMenu());
app.appendChild(buildGame());
app.appendChild(buildSettings());
app.appendChild(buildBest());

function showScreen(name) {
  $$('.screen').forEach(s => s.classList.remove('active'));
  $('#' + name).classList.add('active');
  state.screen = name;
  if (name === 'best') $('#best-num').textContent = String(state.best);
  if (name === 'game' && state.board) {
    requestAnimationFrame(() => { renderBoard(); traceLaser(); });
    $('#board').focus();
  }
}

function showSettings() {
  const s = $('#settings');
  s.querySelectorAll('.toggle')[0].classList.toggle('on', state.sound);
  s.querySelectorAll('.toggle')[1].classList.toggle('on', state.motion);
  s.querySelectorAll('.toggle')[2].classList.toggle('on', state.hc);
  showScreen('settings');
}

function showBest() {
  $('#best-num').textContent = String(state.best);
  showScreen('best');
}

/* Board generation */
function buildLevel() {
  state.gridSize = Math.min(10, 5 + Math.floor((state.level - 1) / 2));
  state.targetCount = Math.min(4, 1 + Math.floor((state.level - 1) / 3));
  const blockerCount = Math.min(10, state.level - 1);
  const mirrorCount = Math.min(14, 4 + state.level);
  const n = state.gridSize;

  let result = generateRandomBoard(n, state.targetCount, blockerCount, mirrorCount);
  if (!result) result = generatePathBoard(n, state.targetCount, blockerCount, mirrorCount);
  if (!result) result = generateFallbackBoard(n, state.targetCount, blockerCount, mirrorCount);

  state.board = result.board;
  state.emitter = result.emitter;
  state.litTargets = new Set();
  state.focusRow = result.emitter.r;
  state.focusCol = result.emitter.c;
  state.animatingComplete = false;

  $('#level-num').textContent = String(state.level);
  $('#moves-num').textContent = String(state.moves);
  renderBoard();
  traceLaser();
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
}

function generateRandomBoard(n, targetCount, blockerCount, mirrorCount) {
  let attempts = 0;
  while (attempts < 600) {
    attempts++;
    const board = Array.from({length:n}, () => Array(n).fill('empty'));
    const cells = [];
    for (let r=0;r<n;r++) for (let c=0;c<n;c++) cells.push({r,c});
    const emitter = { r: Math.floor(n/2), c: 0 };
    board[emitter.r][emitter.c] = { type:'emitter', dir:'right' };
    const possibleTargets = cells.filter(p => p.c !== 0);
    shuffle(possibleTargets);
    const targets = possibleTargets.slice(0, targetCount);
    targets.forEach(p => board[p.r][p.c] = { type:'target' });
    const remaining = cells.filter(p => board[p.r][p.c] === 'empty');
    shuffle(remaining);
    for (let i=0;i<Math.min(blockerCount, remaining.length);i++) {
      board[remaining[i].r][remaining[i].c] = { type:'blocker' };
    }
    const free = cells.filter(p => board[p.r][p.c] === 'empty');
    shuffle(free);
    for (let i=0;i<Math.min(mirrorCount, free.length);i++) {
      board[free[i].r][free[i].c] = { type:'mirror', orientation: Math.random() < 0.5 ? 'slash' : 'backslash' };
    }
    const sol = findSolution(board, emitter, targets);
    if (sol) {
      sol.forEach(s => { board[s.r][s.c].orientation = s.orientation; });
      return { board, emitter, targets };
    }
  }
  return null;
}

function mirrorOrientation(inDir, outDir) {
  const slash = { up:'right', right:'up', down:'left', left:'down' };
  const backslash = { up:'left', left:'up', down:'right', right:'down' };
  if (slash[inDir] === outDir) return 'slash';
  if (backslash[inDir] === outDir) return 'backslash';
  return 'slash';
}

function generatePathBoard(n, targetCount, blockerCount, mirrorCount) {
  const DIRS = { up:[-1,0], down:[1,0], left:[0,-1], right:[0,1] };
  const opposite = { up:'down', down:'up', left:'right', right:'left' };
  let tries = 0;
  while (tries < 200) {
    tries++;
    const board = Array.from({length:n}, () => Array(n).fill('empty'));
    const emitter = { r: Math.floor(Math.random() * n), c: 0 };
    board[emitter.r][emitter.c] = { type:'emitter', dir:'right' };
    let r = emitter.r, c = emitter.c, dir = 'right';
    const used = new Set([r + ',' + c]);
    const targets = [];
    const mirrors = [];
    let steps = 0;
    while (steps < n * n * 2) {
      steps++;
      const dirs = ['up','down','left','right'].filter(d => d !== opposite[dir]);
      const candidates = dirs.map(d => {
        const nr = r + DIRS[d][0], nc = c + DIRS[d][1];
        return { d, nr, nc, ok: nr>=0 && nr<n && nc>=0 && nc<n && !used.has(nr+','+nc) };
      }).filter(x => x.ok);
      if (candidates.length === 0) break;
      candidates.sort((a,b) => (b.nc - a.nc) + Math.random() * 0.5);
      const choice = candidates[0];
      if (choice.d !== dir) {
        const ori = mirrorOrientation(dir, choice.d);
        board[r][c] = { type:'mirror', orientation: ori };
        mirrors.push({r,c});
      }
      r = choice.nr; c = choice.nc; dir = choice.d;
      used.add(r + ',' + c);
      if (targets.length < targetCount && Math.random() < 0.35 && !(r===emitter.r && c===0)) {
        board[r][c] = { type:'target' };
        targets.push({r,c});
      }
    }
    const emptyPath = [];
    for (let rr=0; rr<n; rr++) for (let cc=0; cc<n; cc++) {
      if (board[rr][cc] === 'empty') emptyPath.push({r:rr,c:cc});
    }
    shuffle(emptyPath);
    for (const p of emptyPath) {
      if (targets.length >= targetCount) break;
      board[p.r][p.c] = { type:'target' };
      targets.push(p);
    }
    if (targets.length < targetCount) continue;
    const rest = [];
    for (let rr=0; rr<n; rr++) for (let cc=0; cc<n; cc++) {
      if (board[rr][cc] === 'empty') rest.push({r:rr,c:cc});
    }
    shuffle(rest);
    let idx = 0;
    for (let i=0; i<blockerCount && idx<rest.length; i++, idx++) {
      board[rest[idx].r][rest[idx].c] = { type:'blocker' };
    }
    for (let i=0; i<mirrorCount-mirrors.length && idx<rest.length; i++, idx++) {
      board[rest[idx].r][rest[idx].c] = { type:'mirror', orientation: Math.random()<0.5?'slash':'backslash' };
    }
    const sol = findSolution(board, emitter, targets);
    if (sol) {
      sol.forEach(s => { board[s.r][s.c].orientation = s.orientation; });
      for (let rr=0; rr<n; rr++) for (let cc=0; cc<n; cc++) {
        if (board[rr][cc].type === 'mirror') {
          const inSol = sol.some(s => s.r===rr && s.c===cc);
          if (!inSol) board[rr][cc].orientation = Math.random()<0.5?'slash':'backslash';
        }
      }
      return { board, emitter, targets };
    }
  }
  return null;
}

function generateFallbackBoard(n, targetCount, blockerCount, mirrorCount) {
  const board = Array.from({length:n}, () => Array(n).fill('empty'));
  const emitter = { r: Math.floor(n/2), c: 0 };
  board[emitter.r][emitter.c] = { type:'emitter', dir:'right' };
  const targets = [];
  for (let i=0; i<targetCount; i++) {
    const tc = Math.min(n-1, 2 + i * Math.max(1, Math.floor((n-2)/targetCount)));
    board[emitter.r][tc] = { type:'target' };
    targets.push({r:emitter.r, c:tc});
  }
  const unprotected = [];
  for (let r=0; r<n; r++) for (let c=0; c<n; c++) {
    if (board[r][c]==='empty') unprotected.push({r,c});
  }
  shuffle(unprotected);
  let idx = 0;
  for (let i=0; i<blockerCount && idx<unprotected.length; i++, idx++) {
    board[unprotected[idx].r][unprotected[idx].c] = { type:'blocker' };
  }
  for (let i=0; i<mirrorCount && idx<unprotected.length; i++, idx++) {
    board[unprotected[idx].r][unprotected[idx].c] = { type:'mirror', orientation: Math.random()<0.5?'slash':'backslash' };
  }
  return { board, emitter, targets };
}

function findSolution(board, emitter, targets) {
  const n = board.length;
  const mirrors = [];
  for (let r=0;r<n;r++) for (let c=0;c<n;c++) if (board[r][c].type === 'mirror') mirrors.push({r,c});
  let solution = null;
  function dfs(idx) {
    if (solution) return true;
    if (idx === mirrors.length) {
      const path = trace(board, emitter);
      const lit = new Set();
      for (const p of path) {
        const cell = board[p.r][p.c];
        if (cell && cell.type === 'target') lit.add(p.r + ',' + p.c);
      }
      if (targets.every(t => lit.has(t.r + ',' + t.c))) {
        solution = mirrors.map(m => ({ r:m.r, c:m.c, orientation: board[m.r][m.c].orientation }));
        return true;
      }
      return false;
    }
    const m = mirrors[idx];
    for (const ori of ['slash', 'backslash']) {
      board[m.r][m.c].orientation = ori;
      if (dfs(idx+1)) return true;
    }
    return false;
  }
  dfs(0);
  return solution;
}

function trace(board, emitter) {
  const n = board.length;
  let r = emitter.r, c = emitter.c;
  let dir = emitter.dir || 'right';
  const path = [];
  const visited = new Set();
  const DIRS = { up:[-1,0], down:[1,0], left:[0,-1], right:[0,1] };
  while (true) {
    const key = r + ',' + c + ',' + dir;
    if (visited.has(key)) break;
    visited.add(key);
    path.push({r,c});
    const nr = r + DIRS[dir][0];
    const nc = c + DIRS[dir][1];
    if (nr < 0 || nr >= n || nc < 0 || nc >= n) break;
    r = nr; c = nc;
    const cell = board[r][c];
    if (!cell) break;
    if (cell === 'empty') continue;
    if (cell.type === 'blocker') { path.push({r,c}); break; }
    if (cell.type === 'target') continue;
    if (cell.type === 'mirror') {
      const nd = reflect(dir, cell.orientation);
      if (!nd) { path.push({r,c}); break; }
      dir = nd;
    }
  }
  return path;
}

function reflect(dir, orientation) {
  const slash = { up:'right', right:'up', down:'left', left:'down' };
  const backslash = { up:'left', left:'up', down:'right', right:'down' };
  return orientation === 'slash' ? slash[dir] : backslash[dir];
}

function renderBoard() {
  const board = state.board;
  const n = state.gridSize;
  const cellSize = Math.min(56, Math.floor(Math.min(window.innerWidth - 24, window.innerHeight - 220) / n));
  const wrap = $('#board-wrap');
  const b = $('#board');
  b.innerHTML = '';
  b.style.setProperty('--grid-size', n);
  b.style.setProperty('--cell-size', cellSize + 'px');
  b.style.gridTemplateColumns = `repeat(${n}, ${cellSize}px)`;
  b.style.gridTemplateRows = `repeat(${n}, ${cellSize}px)`;

  const svg = $('#laser-svg');
  svg.setAttribute('width', n * cellSize);
  svg.setAttribute('height', n * cellSize);
  svg.style.width = (n * cellSize) + 'px';
  svg.style.height = (n * cellSize) + 'px';

  for (let r=0; r<n; r++) {
    for (let c=0; c<n; c++) {
      const cell = board[r][c];
      const div = create('div', {
        class: 'cell',
        'data-r': r, 'data-c': c,
        role: 'gridcell',
        'aria-rowindex': r+1,
        'aria-colindex': c+1,
        'aria-label': ariaLabel(r, c, cell),
        tabindex: (r === state.focusRow && c === state.focusCol) ? '0' : '-1',
      });
      if (state.hc) div.classList.add('hc');
      if (cell !== 'empty') {
        if (cell.type === 'emitter') div.classList.add('emitter');
        else if (cell.type === 'target') div.classList.add('target');
        else if (cell.type === 'blocker') div.classList.add('blocker');
        else if (cell.type === 'mirror') {
          div.classList.add('mirror');
          div.classList.add(cell.orientation);
        }
      }
      if (r === state.focusRow && c === state.focusCol) div.classList.add('focused');
      div.addEventListener('click', () => onCellClick(r, c));
      b.appendChild(div);
    }
  }
}

function ariaLabel(r, c, cell) {
  let label = `Row ${r+1}, Column ${c+1}`;
  if (cell === 'empty') label += ', empty';
  else if (cell.type === 'emitter') label += ', emitter';
  else if (cell.type === 'target') label += ', target' + (state.litTargets.has(r+','+c) ? ', lit' : ', unlit');
  else if (cell.type === 'blocker') label += ', blocker';
  else if (cell.type === 'mirror') label += ', mirror, ' + cell.orientation;
  return label;
}

function onCellClick(r, c) {
  const cell = state.board[r][c];
  if (cell.type !== 'mirror' || state.animatingComplete) return;
  state.focusRow = r; state.focusCol = c;
  toggleMirror(r, c);
}

function toggleMirror(r, c) {
  const cell = state.board[r][c];
  cell.orientation = cell.orientation === 'slash' ? 'backslash' : 'slash';
  state.moves++;
  $('#moves-num').textContent = String(state.moves);
  renderBoard();
  traceLaser();
}

function onBoardKey(e) {
  if (state.animatingComplete) return;
  const n = state.gridSize;
  let r = state.focusRow, c = state.focusCol;
  switch (e.key) {
    case 'ArrowUp': r--; e.preventDefault(); break;
    case 'ArrowDown': r++; e.preventDefault(); break;
    case 'ArrowLeft': c--; e.preventDefault(); break;
    case 'ArrowRight': c++; e.preventDefault(); break;
    case 'Enter':
    case ' ':
      e.preventDefault();
      if (state.board[r][c].type === 'mirror') toggleMirror(r, c);
      return;
    default: return;
  }
  r = Math.max(0, Math.min(n-1, r));
  c = Math.max(0, Math.min(n-1, c));
  state.focusRow = r; state.focusCol = c;
  renderBoard();
}

function traceLaser() {
  const board = state.board;
  const n = state.gridSize;
  const path = trace(board, state.emitter);
  const cellSize = parseFloat($('#board').style.getPropertyValue('--cell-size'));
  const svg = $('#laser-svg');
  svg.innerHTML = '';

  const lit = new Set();
  for (const p of path) {
    if (board[p.r][p.c].type === 'target') lit.add(p.r + ',' + p.c);
  }
  state.litTargets = lit;

  $$('.cell.target').forEach(el => {
    const r = +el.dataset.r, c = +el.dataset.c;
    el.classList.toggle('lit', lit.has(r + ',' + c));
    el.setAttribute('aria-label', ariaLabel(r, c, board[r][c]));
  });

  if (path.length > 1) {
    const d = path.map((p, i) => {
      const x = p.c * cellSize + cellSize/2;
      const y = p.r * cellSize + cellSize/2;
      return (i===0?'M':'L') + x + ',' + y;
    }).join(' ');
    const pathEl = createNS('path', {
      class: 'laser-path' + (state.hc ? ' hc' : '') + (state.motion ? ' motion' : ''),
      d: d,
    });
    svg.appendChild(pathEl);
  }

  let allLit = true;
  for (let r=0; r<n; r++) for (let c=0; c<n; c++) if (board[r][c].type === 'target' && !lit.has(r+','+c)) allLit = false;
  if (allLit && !state.animatingComplete) {
    state.animatingComplete = true;
    $('#board-wrap').classList.add('pulse');
    if (state.sound) playSound();
    setTimeout(() => {
      $('#board-wrap').classList.remove('pulse');
      completeLevel();
    }, 600);
  }
}

function redrawLaser() {
  traceLaser();
}

function completeLevel() {
  const isNewBest = state.level > state.best;
  if (isNewBest) {
    state.best = state.level;
    save();
    const popup = $('#newbest');
    popup.classList.add('show');
    setTimeout(() => popup.classList.remove('show'), 1500);
  }
  state.level++;
  state.moves = 0;
  state.animatingComplete = false;
  buildLevel();
  $('#level-num').textContent = String(state.level);
  $('#moves-num').textContent = '0';
}

function playSound() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioContext();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(523.25, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1046.5, ctx.currentTime + 0.15);
    g.gain.setValueAtTime(0.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    o.connect(g);
    g.connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + 0.3);
  } catch(e){}
}

window.addEventListener('resize', () => {
  if (state.screen === 'game' && state.board) { renderBoard(); traceLaser(); }
});

showScreen('menu');

})();
</script>
</body>
