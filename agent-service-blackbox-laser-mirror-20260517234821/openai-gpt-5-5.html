<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laser Mirror Puzzle</title>
<style>
  :root{
    color-scheme:dark;
    --bg0:#08111f; --bg1:#13213b; --panel:rgba(13,25,48,.82); --line:rgba(168,211,255,.22);
    --text:#f7fbff; --muted:#9fb5d7; --cyan:#46e8ff; --laser:#ff315a; --gold:#ffd260;
    --green:#72ff9e; --block:#243044; --tile:#14243e; --focus:#ffffff;
    --cell:56px; --gap:6px; --laserw:5px; --outline:1px;
  }
  *{box-sizing:border-box} html,body{height:100%;margin:0;overflow:hidden;background:radial-gradient(circle at 50% -10%,#1e3b68 0%,var(--bg0) 55%,#03060d 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);touch-action:manipulation;user-select:none}
  body.high-contrast{--laserw:9px;--outline:3px;--line:rgba(255,255,255,.72);--tile:#07162d;--block:#111;filter:saturate(1.18) contrast(1.12)}
  body.reduce-motion *,body.reduce-motion *::before,body.reduce-motion *::after{animation:none!important;transition:none!important}
  #app{height:100%;display:grid;place-items:center;padding:18px;position:relative}
  .screen{width:min(96vw,720px);min-height:min(94vh,880px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:24px;position:relative}
  .screen.active{display:flex}
  .corner{position:absolute;top:8px;width:54px;height:54px;border:0;background:rgba(255,255,255,.06);border-radius:18px;color:var(--text);font-size:28px;display:grid;place-items:center;box-shadow:inset 0 0 0 var(--outline) var(--line),0 14px 40px rgba(0,0,0,.18);backdrop-filter:blur(10px);cursor:pointer}
  .corner.left{left:8px}.corner.right{right:8px}.corner:focus-visible,.icon-btn:focus-visible,.primary:focus-visible,.cell:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .logo{width:min(62vw,300px);aspect-ratio:1;position:relative;display:grid;place-items:center;filter:drop-shadow(0 24px 50px rgba(38,207,255,.20))}
  .logo svg{width:100%;height:100%}.logo .pulse{animation:pulse 2.8s infinite ease-in-out;transform-origin:center}.logo .spin{animation:spin 16s linear infinite;transform-origin:center}
  @keyframes pulse{50%{opacity:.55;transform:scale(.96)}} @keyframes spin{to{transform:rotate(360deg)}}
  .primary{border:0;border-radius:999px;padding:18px 30px;min-width:210px;background:linear-gradient(135deg,#fff 0%,#bdf6ff 45%,#56e8ff 100%);color:#061320;font-weight:900;font-size:26px;letter-spacing:.01em;box-shadow:0 18px 60px rgba(70,232,255,.30),inset 0 -3px 0 rgba(4,34,56,.18);cursor:pointer}
  .small-word{font-size:22px;min-width:150px;padding:14px 22px}
  .game{gap:14px;justify-content:center}.hud{width:min(96vw,calc(var(--boardW,360px)));display:flex;align-items:center;justify-content:space-between;font-size:30px;font-weight:900;line-height:1;color:var(--text);text-shadow:0 0 20px rgba(70,232,255,.32)}
  .hud span{display:inline-flex;gap:8px;align-items:center;min-width:84px}.hud span:last-child{justify-content:flex-end}.symbol{font-size:.9em;color:var(--gold);filter:drop-shadow(0 0 10px rgba(255,210,96,.4))}
  .board-wrap{position:relative;padding:10px;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.025));box-shadow:inset 0 0 0 var(--outline) var(--line),0 24px 70px rgba(0,0,0,.38)}
  #board{display:grid;grid-template-columns:repeat(var(--n),var(--cell));gap:var(--gap);position:relative}
  .cell{width:var(--cell);height:var(--cell);border:0;border-radius:14px;background:linear-gradient(145deg,var(--tile),#0b1830);box-shadow:inset 0 0 0 var(--outline) var(--line),inset 0 -10px 18px rgba(0,0,0,.16);position:relative;display:grid;place-items:center;color:var(--text);font-size:30px;cursor:default;overflow:hidden}
  .cell.mirror{cursor:pointer}.cell.blocker{background:linear-gradient(145deg,#30394d,var(--block))}.cell.target{box-shadow:inset 0 0 0 var(--outline) rgba(255,210,96,.55),0 0 18px rgba(255,210,96,.08)}
  .cell.target::before{content:"";width:42%;height:42%;border-radius:50%;box-shadow:inset 0 0 0 4px var(--gold),0 0 20px rgba(255,210,96,.22);background:radial-gradient(circle,#fff7bc 0 14%,transparent 16%)}
  .cell.lit::before{background:radial-gradient(circle,#fff 0 18%,#fff2a0 20% 35%,rgba(255,210,96,.25) 40%);box-shadow:inset 0 0 0 4px #fff2a0,0 0 26px rgba(255,210,96,.85)}
  .cell.just-lit{animation:pop .46s ease-out 1}@keyframes pop{50%{transform:scale(1.13);filter:brightness(1.45)}}
  .cell.emitter::before{content:"";width:0;height:0;border-top:14px solid transparent;border-bottom:14px solid transparent;border-left:24px solid var(--cyan);filter:drop-shadow(0 0 10px var(--cyan));transform:translateX(2px)}
  .cell.mirror::before{content:"";width:78%;height:8px;border-radius:99px;background:linear-gradient(90deg,#fff,#a6f7ff 40%,#48e8ff);box-shadow:0 0 18px rgba(72,232,255,.7);transform:rotate(var(--rot))}.cell.slash{--rot:-45deg}.cell.backslash{--rot:45deg}
  .cell.blocker::before{content:"";width:52%;height:52%;border-radius:8px;background:repeating-linear-gradient(45deg,#0e1420 0 7px,#4b5871 7px 13px);box-shadow:inset 0 0 0 2px rgba(255,255,255,.13)}
  .cell.cursor{box-shadow:inset 0 0 0 3px #fff,0 0 0 2px rgba(255,255,255,.16),0 0 25px rgba(255,255,255,.25)}
  .cell.has-laser::after{display:none}
  #laserSvg{position:absolute;inset:10px;pointer-events:none;overflow:visible}.laser-line{fill:none;stroke:var(--laser);stroke-width:var(--laserw);stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 9px var(--laser)) drop-shadow(0 0 18px rgba(255,49,90,.65));stroke-dasharray:1200;animation:draw .55s ease-out both}@keyframes draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
  .bottom{display:flex;gap:18px;padding-top:4px}.icon-btn{width:62px;height:62px;border:0;border-radius:21px;background:rgba(255,255,255,.07);color:var(--text);font-size:31px;display:grid;place-items:center;box-shadow:inset 0 0 0 var(--outline) var(--line),0 16px 40px rgba(0,0,0,.20);cursor:pointer}.icon-btn.on{background:rgba(70,232,255,.18);box-shadow:inset 0 0 0 2px rgba(70,232,255,.75),0 0 30px rgba(70,232,255,.16)}
  .panel{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;width:min(90vw,430px);padding:24px;border-radius:30px;background:var(--panel);box-shadow:inset 0 0 0 var(--outline) var(--line),0 24px 80px rgba(0,0,0,.42);backdrop-filter:blur(18px)}
  .best-num{font-size:92px;font-weight:950;line-height:.9;color:#fff;text-shadow:0 0 34px rgba(255,210,96,.42)}.big-icon{font-size:88px;filter:drop-shadow(0 0 18px rgba(255,210,96,.4))}.toast{position:absolute;top:84px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:999px;background:rgba(255,210,96,.15);box-shadow:inset 0 0 0 1px rgba(255,210,96,.55),0 14px 45px rgba(0,0,0,.25);color:#fff4bf;font-size:20px;font-weight:900;opacity:0;pointer-events:none}.toast.show{animation:toast 1.8s ease both}@keyframes toast{15%,80%{opacity:1;transform:translateX(-50%) translateY(0)}0%,100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}
  @media (max-width:680px){:root{--cell:min(10.5vw,52px);--gap:4px}.hud{font-size:26px}.cell{border-radius:11px}.screen{min-height:94vh}.primary{font-size:23px}}
</style>
</head>
<body>
<div id="app">
  <section id="home" class="screen active" aria-live="polite">
    <button id="bestBtn" class="corner left" aria-label="best">🏆</button>
    <button id="settingsBtn" class="corner right" aria-label="settings">⚙️</button>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 200 200" role="img">
        <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#fff"/><stop offset=".42" stop-color="#55edff"/><stop offset="1" stop-color="#ff315a"/></linearGradient></defs>
        <circle class="pulse" cx="100" cy="100" r="82" fill="none" stroke="#46e8ff" stroke-width="4" opacity=".45"/>
        <path class="spin" d="M100 22 122 78 180 100 122 122 100 178 78 122 20 100 78 78Z" fill="rgba(70,232,255,.08)" stroke="rgba(255,255,255,.36)" stroke-width="3"/>
        <path d="M28 112 H88 L118 82 H172" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M82 72 128 118" stroke="#fff" stroke-width="12" stroke-linecap="round" filter="drop-shadow(0 0 8px #46e8ff)"/>
        <circle cx="174" cy="82" r="10" fill="#ffd260" filter="drop-shadow(0 0 12px #ffd260)"/>
      </svg>
    </div>
    <button id="startBtn" class="primary">Start Game</button>
  </section>

  <section id="game" class="screen game" aria-live="polite">
    <div id="newBest" class="toast">New Best</div>
    <div class="hud"><span id="moves">0</span><span><span class="symbol" aria-hidden="true">★</span><span id="level">1</span></span></div>
    <div id="boardWrap" class="board-wrap"><div id="board" role="grid" aria-label="grid"></div><svg id="laserSvg" aria-hidden="true"></svg></div>
    <div class="bottom"><button id="gearGame" class="icon-btn" aria-label="settings">⚙️</button><button id="homeGame" class="icon-btn" aria-label="menu">⌂</button></div>
  </section>

  <section id="settings" class="screen">
    <div class="panel">
      <button id="soundBtn" class="icon-btn" aria-label="sound">🔊</button>
      <button id="motionBtn" class="icon-btn" aria-label="motion">◌</button>
      <button id="contrastBtn" class="icon-btn" aria-label="contrast">◐</button>
      <button id="trashBtn" class="icon-btn" aria-label="reset">🗑️</button>
      <button id="okReset" class="icon-btn" aria-label="confirm" hidden>✓</button>
      <button id="cancelReset" class="icon-btn" aria-label="cancel" hidden>×</button>
    </div>
    <button id="settingsHome" class="icon-btn" aria-label="home">⌂</button>
  </section>

  <section id="best" class="screen">
    <div class="big-icon" aria-hidden="true">🏆</div>
    <div id="bestNumber" class="best-num">1</div>
    <button id="bestHome" class="icon-btn" aria-label="home">⌂</button>
  </section>

  <section id="menu" class="screen">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="74" fill="rgba(70,232,255,.07)" stroke="rgba(255,255,255,.3)" stroke-width="3"/><path d="M36 112 H86 L116 82 H166" fill="none" stroke="#ff315a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M82 72 128 118" stroke="#fff" stroke-width="12" stroke-linecap="round"/></svg>
    </div>
    <button id="againBtn" class="primary small-word">Play Again</button>
    <button id="menuBtn" class="primary small-word">Menu</button>
  </section>
</div>
<script>
(() => {
  'use strict';
  const DIRS = { up:[-1,0], right:[0,1], down:[1,0], left:[0,-1] };
  const OPP = { up:'down', right:'left', down:'up', left:'right' };
  const SLASH = { up:'right', right:'up', down:'left', left:'down' };
  const BACKSLASH = { up:'left', left:'up', down:'right', right:'down' };
  const store = { get(k,d){ try{return JSON.parse(localStorage.getItem(k)) ?? d}catch{return d} }, set(k,v){ try{localStorage.setItem(k,JSON.stringify(v))}catch{} } };
  const state = { screen:'home', previous:'home', level:1, best:store.get('laserBest',1), moves:0, board:[], n:5, emitter:{r:0,c:0,dir:'right'}, cursor:{r:0,c:0}, laser:null, settings:store.get('laserSettings',{sound:true,motion:true,contrast:false}), resetCheck:false, completing:false };
  const $ = id => document.getElementById(id);
  const screens = ['home','game','settings','best','menu'];
  function formulas(level){ return { gridSize:Math.min(10,5+Math.floor((level-1)/2)), targetCount:Math.min(4,1+Math.floor((level-1)/3)), blockerCount:Math.min(10,level-1), mirrorCount:Math.min(14,4+level) }; }
  function mulberry32(seed){ return function(){ let t=seed+=0x6D2B79F5; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
  function shuffle(a,rng){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  function blank(n){ return Array.from({length:n},(_,r)=>Array.from({length:n},(_,c)=>({type:'empty',r,c,laser:false,lit:false}))); }
  function createLevel(level){
    const f=formulas(level), n=f.gridSize, rng=mulberry32((Date.now()&0xfffffff) ^ (level*2654435761));
    const board=blank(n); const emitter={r:0,c:0,dir:'right'}; board[0][0]={type:'emitter',r:0,c:0,dir:'right',laser:false,lit:false};
    const rowsUsed=Math.min(n, f.targetCount+1); const turnCells=[];
    function putMirror(r,c,solution){
      board[r][c]={type:'mirror',r,c,orientation:solution==='slash'?'backslash':'slash',solution,laser:false,lit:false};
      turnCells.push(board[r][c]);
    }
    for(let r=0;r<rowsUsed-1;r++){
      const c=(r%2===0)?n-1:0;
      putMirror(r,c,(r%2===0)?'backslash':'slash');
      putMirror(r+1,c,(r%2===0)?'slash':'backslash');
    }
    for(let i=0;i<f.targetCount;i++){
      const r=i+1; let c=Math.floor(n/2)+(i%2)-((n%2===0)?1:0); c=Math.max(1,Math.min(n-2,c));
      board[r][c]={type:'target',r,c,laser:false,lit:false};
    }
    const off=[]; for(let r=rowsUsed;r<n;r++) for(let c=0;c<n;c++) off.push([r,c]); shuffle(off,rng);
    for(let i=0;i<f.blockerCount;i++){ const [r,c]=off.pop(); board[r][c]={type:'blocker',r,c,laser:false,lit:false}; }
    let extras=f.mirrorCount-turnCells.length;
    for(let i=0;i<extras;i++){ const [r,c]=off.pop(); const solution=rng()<.5?'slash':'backslash'; board[r][c]={type:'mirror',r,c,orientation:rng()<.5?'slash':'backslash',solution,laser:false,lit:false}; }
    return {board,n,emitter};
  }
  function reflect(dir, orientation){ return orientation==='slash' ? SLASH[dir] : BACKSLASH[dir]; }
  function resetLaserMarks(board){ for(const row of board) for(const cell of row){ cell.laser=false; cell.lit=false; cell.laserDirs=[]; } }
  function traceBoard(board, emitter){
    const n=board.length; resetLaserMarks(board); const points=[{r:emitter.r,c:emitter.c}]; const visited=new Set(); let r=emitter.r,c=emitter.c,dir=emitter.dir; board[r][c].laser=true; let guard=0;
    while(guard++<n*n*8){ const step=DIRS[dir]; r+=step[0]; c+=step[1]; if(r<0||c<0||r>=n||c>=n) break; const key=`${r},${c},${dir}`; if(visited.has(key)) break; visited.add(key); const cell=board[r][c]; cell.laser=true; cell.laserDirs.push(dir); points.push({r,c}); if(cell.type==='target') cell.lit=true; if(cell.type==='blocker') break; if(cell.type==='mirror') dir=reflect(dir,cell.orientation); }
    const targets=board.flat().filter(c=>c.type==='target'); return {points,complete:targets.length>0 && targets.every(c=>c.lit),visited:[...visited]};
  }
  function show(name){ screens.forEach(s=>$(s).classList.toggle('active',s===name)); state.screen=name; if(name!=='settings') state.previous=name; }
  function applySettings(){ document.body.classList.toggle('high-contrast',!!state.settings.contrast); document.body.classList.toggle('reduce-motion',!state.settings.motion); $('soundBtn').classList.toggle('on',!!state.settings.sound); $('motionBtn').classList.toggle('on',!!state.settings.motion); $('contrastBtn').classList.toggle('on',!!state.settings.contrast); store.set('laserSettings',state.settings); }
  function playTone(){ if(!state.settings.sound) return; try{ const AudioCtx=window.AudioContext||window.webkitAudioContext; const ctx=new AudioCtx(); const osc=ctx.createOscillator(); const gain=ctx.createGain(); osc.type='sine'; osc.frequency.value=520; gain.gain.setValueAtTime(.055,ctx.currentTime); gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.12); osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime+.13); }catch{} }
  function startLevel(level){ const made=createLevel(level); Object.assign(state,{level,moves:0,board:made.board,n:made.n,emitter:made.emitter,cursor:{r:0,c:0},completing:false}); state.laser=traceBoard(state.board,state.emitter); renderGame(); show('game'); }
  function updateBest(nextLevel){ if(nextLevel>state.best){ state.best=nextLevel; store.set('laserBest',state.best); const t=$('newBest'); t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); } }
  function completeSoon(){ if(state.completing) return; state.completing=true; playTone(); document.querySelectorAll('.cell.lit').forEach(el=>{el.classList.remove('just-lit'); void el.offsetWidth; el.classList.add('just-lit');}); const next=state.level+1; updateBest(next); setTimeout(()=>startLevel(next), state.settings.motion?650:60); }
  function toggleMirror(r,c){ const cell=state.board[r]?.[c]; if(!cell || cell.type!=='mirror' || state.completing) return; cell.orientation=cell.orientation==='slash'?'backslash':'slash'; state.moves++; playTone(); state.laser=traceBoard(state.board,state.emitter); renderGame(); if(state.laser.complete) completeSoon(); }
  function cellName(cell){ const parts=[`row ${cell.r+1}`,`column ${cell.c+1}`,cell.type]; if(cell.type==='mirror') parts.push(cell.orientation); if(cell.laser) parts.push('laser'); if(cell.type==='target'&&cell.lit) parts.push('lit'); return parts.join(', '); }
  function renderGame(){
    $('moves').textContent=state.moves; $('level').textContent=state.level; const board=$('board'); board.style.setProperty('--n',state.n); document.documentElement.style.setProperty('--boardW',`calc(${state.n} * var(--cell) + ${state.n-1} * var(--gap) + 20px)`); board.innerHTML='';
    for(const row of state.board) for(const cell of row){ const b=document.createElement('button'); b.className=`cell ${cell.type}`; if(cell.type==='mirror') b.classList.add(cell.orientation); if(cell.type==='target'&&cell.lit) b.classList.add('lit'); if(cell.laser) b.classList.add('has-laser'); if(state.cursor.r===cell.r&&state.cursor.c===cell.c) b.classList.add('cursor'); b.type='button'; b.dataset.r=cell.r; b.dataset.c=cell.c; b.setAttribute('role','gridcell'); b.setAttribute('aria-label',cellName(cell)); b.tabIndex=(state.cursor.r===cell.r&&state.cursor.c===cell.c)?0:-1; b.addEventListener('click',()=>{ state.cursor={r:cell.r,c:cell.c}; toggleMirror(cell.r,cell.c); }); board.appendChild(b); }
    renderLaser(); const focus=board.querySelector('.cell.cursor'); if(document.activeElement?.classList?.contains('cell')) focus?.focus({preventScroll:true});
  }
  function renderLaser(){
    const svg=$('laserSvg'); svg.innerHTML=''; const board=$('board');
    const boardBox=board.getBoundingClientRect(); svg.setAttribute('width',boardBox.width); svg.setAttribute('height',boardBox.height);
    if(!state.laser||state.laser.points.length<2) return;
    const coords=[];
    for(const p of state.laser.points){
      const cell=board.querySelector(`[data-r="${p.r}"][data-c="${p.c}"]`);
      const box=cell.getBoundingClientRect();
      coords.push(`${box.left-boardBox.left+box.width/2},${box.top-boardBox.top+box.height/2}`);
    }
    const poly=document.createElementNS('http://www.w3.org/2000/svg','polyline'); poly.setAttribute('points',coords.join(' ')); poly.setAttribute('class','laser-line'); svg.appendChild(poly);
  }
  function moveCursor(dr,dc){ const n=state.n; state.cursor={r:(state.cursor.r+dr+n)%n,c:(state.cursor.c+dc+n)%n}; renderGame(); document.querySelector('.cell.cursor')?.focus({preventScroll:true}); }
  function openSettings(){ state.previous=state.screen==='settings'?state.previous:state.screen; show('settings'); applySettings(); }
  function resetChoice(on){ state.resetCheck=on; $('okReset').hidden=!on; $('cancelReset').hidden=!on; }
  function init(){
    applySettings(); $('startBtn').onclick=()=>startLevel(1); $('bestBtn').onclick=()=>{$('bestNumber').textContent=state.best; show('best')}; $('settingsBtn').onclick=openSettings; $('gearGame').onclick=openSettings; $('homeGame').onclick=()=>show('menu'); $('againBtn').onclick=()=>startLevel(1); $('menuBtn').onclick=()=>show('home'); $('settingsHome').onclick=()=>show(state.previous||'home'); $('bestHome').onclick=()=>show('home');
    $('soundBtn').onclick=()=>{state.settings.sound=!state.settings.sound; applySettings(); playTone();}; $('motionBtn').onclick=()=>{state.settings.motion=!state.settings.motion; applySettings();}; $('contrastBtn').onclick=()=>{state.settings.contrast=!state.settings.contrast; applySettings();}; $('trashBtn').onclick=()=>resetChoice(true); $('cancelReset').onclick=()=>resetChoice(false); $('okReset').onclick=()=>{state.best=1; store.set('laserBest',1); $('bestNumber').textContent='1'; resetChoice(false);};
    document.addEventListener('keydown',e=>{ if(state.screen!=='game') return; if(e.key==='ArrowUp'){e.preventDefault();moveCursor(-1,0)} else if(e.key==='ArrowDown'){e.preventDefault();moveCursor(1,0)} else if(e.key==='ArrowLeft'){e.preventDefault();moveCursor(0,-1)} else if(e.key==='ArrowRight'){e.preventDefault();moveCursor(0,1)} else if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleMirror(state.cursor.r,state.cursor.c)} });
    addEventListener('resize',()=>{ if(state.screen==='game') renderLaser(); });
  }
  window.__laserMirrorTest = { formulas, createLevel, traceBoard, reflect, state, startLevel, toggleMirror };
  init();
})();
</script>
</body>
</html>
