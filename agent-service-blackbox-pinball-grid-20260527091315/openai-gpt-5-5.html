<script>
(function(root, factory){
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.PinballCore = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function(){
  'use strict';
  const DIRS = { up:{dr:-1,dc:0}, right:{dr:0,dc:1}, down:{dr:1,dc:0}, left:{dr:0,dc:-1} };
  const SLASH = { up:'right', right:'up', down:'left', left:'down' };
  const BACKSLASH = { up:'left', left:'up', down:'right', right:'down' };
  const TYPES = { EMPTY:'empty', ENTRY:'entry', EXIT:'exit', STAR:'star', BLOCKER:'blocker', BUMPER:'bumper' };

  function formulas(level){
    return {
      gridSize: Math.min(10, 6 + Math.floor((level - 1) / 3)),
      starCount: Math.min(5, 1 + Math.floor((level - 1) / 4)),
      bumperCount: Math.min(14, 4 + level),
      blockerCount: Math.min(10, Math.floor(level / 2))
    };
  }

  function key(r,c){ return r + ',' + c; }
  function inBounds(level,r,c){ return r >= 0 && c >= 0 && r < level.size && c < level.size; }
  function makeGrid(n){ return Array.from({length:n}, () => Array.from({length:n}, () => ({ type:TYPES.EMPTY }))); }

  function addPathCell(list, seen, r, c){ const k = key(r,c); if (!seen.has(k)) { seen.add(k); list.push({r,c}); } }
  function buildSolutionPath(n){
    const mid = Math.floor(n / 2);
    const left = 1;
    const right = n - 2;
    const topTurn = Math.max(2, Math.floor(n / 3));
    const bottomTurn = n - 2;
    const entry = { r:0, c:mid };
    const exit = { r:n-1, c:right };
    const cells = [], seen = new Set();
    addPathCell(cells, seen, 0, mid);
    for (let r=1; r<=topTurn; r++) addPathCell(cells, seen, r, mid);
    for (let c=mid-1; c>=left; c--) addPathCell(cells, seen, topTurn, c);
    for (let r=topTurn+1; r<=bottomTurn; r++) addPathCell(cells, seen, r, left);
    for (let c=left+1; c<=right; c++) addPathCell(cells, seen, bottomTurn, c);
    addPathCell(cells, seen, n-1, right);
    const turns = [
      { r:topTurn, c:mid, solution:'/' },
      { r:topTurn, c:left, solution:'/' },
      { r:bottomTurn, c:left, solution:'\\' },
      { r:bottomTurn, c:right, solution:'\\' }
    ];
    return { entry, exit, cells, seen, turns };
  }

  function candidateDecoys(n, pathSeen){
    const out = [];
    for (let ring=0; ring<n; ring++) {
      for (let r=0; r<n; r++) for (let c=0; c<n; c++) {
        const dist = Math.abs(r - Math.floor(n/2)) + Math.abs(c - Math.floor(n/2));
        if (dist !== ring) continue;
        const k = key(r,c);
        if (pathSeen.has(k)) continue;
        if (r === 0 || r === n-1) continue;
        out.push({r,c});
      }
    }
    return out;
  }

  function buildLevel(levelNumber){
    const f = formulas(levelNumber);
    const n = f.gridSize;
    const grid = makeGrid(n);
    const path = buildSolutionPath(n);
    grid[path.entry.r][path.entry.c] = { type:TYPES.ENTRY };
    grid[path.exit.r][path.exit.c] = { type:TYPES.EXIT };

    const turnKeys = new Set();
    const bumpers = [];
    path.turns.forEach((t, i) => {
      turnKeys.add(key(t.r,t.c));
      const needsPlayer = i < Math.min(3, 2 + (levelNumber % 2));
      const orientation = needsPlayer ? (t.solution === '/' ? '\\' : '/') : t.solution;
      grid[t.r][t.c] = { type:TYPES.BUMPER, orientation, solution:t.solution, useful:true };
      bumpers.push({ r:t.r, c:t.c, solution:t.solution, useful:true });
    });

    const starPlaces = path.cells.filter(p => {
      const k = key(p.r,p.c);
      return k !== key(path.entry.r,path.entry.c) && k !== key(path.exit.r,path.exit.c) && !turnKeys.has(k);
    });
    for (let i=0; i<f.starCount; i++) {
      const idx = Math.floor(((i + 1) * starPlaces.length) / (f.starCount + 1));
      const p = starPlaces[Math.min(starPlaces.length - 1, idx)];
      grid[p.r][p.c] = { type:TYPES.STAR, collected:false };
    }

    const decoys = candidateDecoys(n, path.seen);
    let decoyIndex = (levelNumber * 3) % Math.max(1, decoys.length);
    while (bumpers.length < f.bumperCount && decoys.length) {
      const p = decoys[decoyIndex % decoys.length]; decoyIndex++;
      if (grid[p.r][p.c].type !== TYPES.EMPTY) continue;
      const orientation = ((p.r + p.c + levelNumber) % 2 === 0) ? '/' : '\\';
      grid[p.r][p.c] = { type:TYPES.BUMPER, orientation, solution:orientation, useful:false };
      bumpers.push({ r:p.r, c:p.c, solution:orientation, useful:false });
    }

    let blockers = 0;
    const blockerCandidates = [];
    for (let r=1; r<n-1; r++) for (let c=0; c<n; c++) {
      if (grid[r][c].type === TYPES.EMPTY && !path.seen.has(key(r,c)) && Math.abs(c - path.entry.c) > 0) blockerCandidates.push({r,c});
    }
    let start = (levelNumber * 5) % Math.max(1, blockerCandidates.length);
    while (blockers < f.blockerCount && blockerCandidates.length) {
      const p = blockerCandidates[start % blockerCandidates.length]; start++;
      if (grid[p.r][p.c].type === TYPES.EMPTY) { grid[p.r][p.c] = { type:TYPES.BLOCKER }; blockers++; }
    }

    return { number:levelNumber, size:n, grid, entry:path.entry, exit:path.exit, solutionPath:path.cells, formulas:f };
  }

  function cloneLevel(level){
    return { ...level, entry:{...level.entry}, exit:{...level.exit}, solutionPath:level.solutionPath.map(p=>({...p})), formulas:{...level.formulas}, grid: level.grid.map(row => row.map(cell => ({...cell}))) };
  }

  function setSolutionOrientations(level){
    const copy = cloneLevel(level);
    for (const row of copy.grid) for (const cell of row) if (cell.type === TYPES.BUMPER && cell.useful) cell.orientation = cell.solution;
    return copy;
  }

  function reflect(dir, orientation){ return orientation === '/' ? SLASH[dir] : BACKSLASH[dir]; }

  function totalStars(level){
    let count = 0;
    for (const row of level.grid) for (const cell of row) if (cell.type === TYPES.STAR) count++;
    return count;
  }

  function simulateLaunch(level){
    let r = level.entry.r, c = level.entry.c, dir = 'down';
    const visitedStates = new Set();
    const collected = new Set();
    const path = [{ r, c, dir, type:TYPES.ENTRY }];
    const total = totalStars(level);
    let completed = false;
    let stoppedBy = 'loop';
    for (let steps=0; steps<200; steps++) {
      const stateKey = key(r,c) + ',' + dir;
      if (visitedStates.has(stateKey)) { stoppedBy = 'loop'; break; }
      visitedStates.add(stateKey);
      const delta = DIRS[dir];
      r += delta.dr; c += delta.dc;
      if (!inBounds(level,r,c)) { stoppedBy = 'edge'; break; }
      const cell = level.grid[r][c];
      if (cell.type === TYPES.STAR) collected.add(key(r,c));
      path.push({ r, c, dir, type:cell.type });
      if (cell.type === TYPES.BLOCKER) { stoppedBy = 'blocker'; break; }
      if (cell.type === TYPES.EXIT) {
        if (collected.size === total) { completed = true; stoppedBy = 'exit'; }
        else stoppedBy = 'early-exit';
        break;
      }
      if (cell.type === TYPES.BUMPER) dir = reflect(dir, cell.orientation);
    }
    return { path, collected:[...collected], collectedCount:collected.size, totalStars:total, completed, stoppedBy };
  }

  function toggleBumper(level, r, c){
    if (!inBounds(level,r,c)) return false;
    const cell = level.grid[r][c];
    if (cell.type !== TYPES.BUMPER) return false;
    cell.orientation = cell.orientation === '/' ? '\\' : '/';
    return true;
  }

  return { TYPES, formulas, buildLevel, cloneLevel, setSolutionOrientations, simulateLaunch, toggleBumper, reflect, totalStars };
});

</script>
<script>
(function(){
  'use strict';
  const Core = window.PinballCore;
  const app = document.getElementById('app');
  const STORE = 'pinball-grid-best';
  const SETTINGS = 'pinball-grid-settings';
  const state = {
    screen:'menu', levelNumber:1, level:null, moves:0, lastPath:[], lastCollected:new Set(), collectedCount:0,
    cursor:{r:0,c:0}, best:Number(localStorage.getItem(STORE) || '1'), settings:{sound:true,motion:true,contrast:false}, confirmReset:false
  };
  try { Object.assign(state.settings, JSON.parse(localStorage.getItem(SETTINGS) || '{}')); } catch {}

  function saveSettings(){ localStorage.setItem(SETTINGS, JSON.stringify(state.settings)); }
  function saveBest(){ localStorage.setItem(STORE, String(state.best)); }
  function iconButton(icon, cls, aria, onClick){
    const b = document.createElement('button'); b.className = 'iconBtn ' + (cls || ''); b.type = 'button'; b.textContent = icon; b.setAttribute('aria-label', aria); b.addEventListener('click', onClick); return b;
  }
  function primary(text, onClick){ const b=document.createElement('button'); b.type='button'; b.className='primary'; b.textContent=text; b.addEventListener('click', onClick); return b; }
  function shell(extra){ const s=document.createElement('section'); s.className='shell ' + (extra||''); if(state.settings.contrast)s.classList.add('highContrast'); if(!state.settings.motion)s.classList.add('reduceMotion'); return s; }
  function clear(){ app.innerHTML=''; }

  function renderMenu(){
    state.screen='menu'; clear();
    const s=shell('menu');
    const trophy=iconButton('🏆','topIcon left','trophy best ' + state.best,()=>{}); const num=document.createElement('span'); num.textContent=String(state.best); trophy.appendChild(num);
    trophy.style.gap='2px'; trophy.style.fontSize='1.08rem';
    s.appendChild(trophy);
    s.appendChild(iconButton('⚙','topIcon right','settings',openSettings));
    const logo=document.createElement('div'); logo.className='logo'; logo.setAttribute('aria-label','ball and bumper logo');
    logo.innerHTML='<div class="ball"></div><div class="peg"></div><div class="bumper a"></div><div class="bumper b"></div>';
    s.appendChild(logo);
    s.appendChild(primary('Start Game', startGame));
    app.appendChild(s);
  }

  function startGame(){ state.levelNumber=1; state.moves=0; state.lastCollected=new Set(); createLevel(1); }
  function createLevel(num){ state.screen='game'; state.levelNumber=num; state.moves=0; state.level=Core.buildLevel(num); state.lastPath=[]; state.lastCollected=new Set(); state.collectedCount=0; state.cursor={...state.level.entry}; renderGame(); }
  function renderGame(completing){
    clear();
    const s=shell('game'); if(completing)s.classList.add('complete');
    const hud=document.createElement('div'); hud.className='hud';
    const left=document.createElement('div'); left.className='pill'; left.textContent=String(state.moves); left.setAttribute('aria-label','move count ' + state.moves);
    const right=document.createElement('div'); right.className='pill'; right.innerHTML='<span aria-hidden="true">⭐</span><span>'+state.collectedCount+'</span><span aria-hidden="true">◆</span><span>'+state.levelNumber+'</span>'; right.setAttribute('aria-label','collected stars ' + state.collectedCount + ' level ' + state.levelNumber);
    hud.append(left,right); s.appendChild(hud);
    const wrap=document.createElement('div'); wrap.className='boardWrap';
    const board=document.createElement('div'); board.className='board'; board.setAttribute('role','grid'); board.style.gridTemplateColumns=`repeat(${state.level.size},1fr)`;
    const pathSet=new Set(state.lastPath.map(p=>p.r+','+p.c));
    for(let r=0;r<state.level.size;r++) for(let c=0;c<state.level.size;c++){
      const cell=state.level.grid[r][c]; const el=document.createElement('button'); el.type='button'; el.className='cell ' + cell.type;
      if(cell.type===Core.TYPES.BUMPER) el.classList.add(cell.orientation==='/'?'slash':'backslash');
      if(pathSet.has(r+','+c)) el.classList.add('path');
      if(state.cursor.r===r && state.cursor.c===c) el.classList.add('focused');
      el.setAttribute('role','gridcell'); el.dataset.r=r; el.dataset.c=c;
      el.setAttribute('aria-label', describeCell(r,c,cell,pathSet.has(r+','+c),state.lastCollected.has(r+','+c)));
      el.addEventListener('click',()=>{ state.cursor={r,c}; if(cell.type===Core.TYPES.BUMPER) toggleAt(r,c); else renderGame(); });
      board.appendChild(el);
    }
    wrap.appendChild(board); s.appendChild(wrap);
    const controls=document.createElement('div'); controls.className='controls';
    controls.appendChild(primary('Launch', launch));
    controls.appendChild(iconButton('⚙','','settings',openSettings));
    controls.appendChild(iconButton('⌂','','Menu',renderMenu));
    s.appendChild(controls);
    app.appendChild(s);
  }
  function describeCell(r,c,cell,onPath,collected){
    let d = `row ${r+1}, column ${c+1}, ${cell.type}`;
    if(cell.type===Core.TYPES.BUMPER) d += `, ${cell.orientation === '/' ? 'slash' : 'backslash'} bumper orientation`;
    if(cell.type===Core.TYPES.STAR) d += collected ? ', star collected' : ', star not collected';
    d += onPath ? ', path present' : ', no path';
    return d;
  }
  function toggleAt(r,c){ if(Core.toggleBumper(state.level,r,c)){ state.moves++; state.lastPath=[]; state.lastCollected=new Set(); state.collectedCount=0; clickSound(250); } renderGame(); }
  function launch(){
    const result=Core.simulateLaunch(state.level); state.lastPath=result.path; state.lastCollected=new Set(result.collected); state.collectedCount=result.collectedCount; clickSound(result.completed?520:180); renderGame(result.completed);
    if(result.completed){ setTimeout(()=>{ state.best=Math.max(state.best,state.levelNumber+1); saveBest(); createLevel(state.levelNumber+1); }, state.settings.motion ? 720 : 20); }
  }
  function clickSound(freq){
    if(!state.settings.sound) return;
    try{ const ctx=new (window.AudioContext||window.webkitAudioContext)(); const osc=ctx.createOscillator(); const gain=ctx.createGain(); osc.frequency.value=freq; gain.gain.value=.035; osc.connect(gain); gain.connect(ctx.destination); osc.start(); gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.08); osc.stop(ctx.currentTime+.09); }catch{}
  }
  function closeSettings(overlay){ app.inert=false; app.removeAttribute('aria-hidden'); if(overlay) overlay.remove(); }
  function openSettings(){ state.confirmReset=false; renderSettings(); }
  function renderSettings(){
    app.inert=true; app.setAttribute('aria-hidden','true');
    const overlay=document.createElement('div'); overlay.className='settings'; overlay.setAttribute('role','dialog'); overlay.setAttribute('aria-modal','true'); overlay.addEventListener('click',e=>{ if(e.target===overlay) closeSettings(overlay); });
    const card=document.createElement('div'); card.className='settingsCard';
    const close=iconButton('✕','settingsClose','X',()=>closeSettings(overlay));
    const sound=iconButton(state.settings.sound?'🔊':'🔇', state.settings.sound?'settingToggle active':'settingToggle', 'speaker', ()=>{state.settings.sound=!state.settings.sound; saveSettings(); closeSettings(overlay); renderSettings();});
    const motion=iconButton(state.settings.motion?'➰':'○', state.settings.motion?'settingToggle active':'settingToggle', 'motion', ()=>{state.settings.motion=!state.settings.motion; saveSettings(); closeSettings(overlay); if(state.screen==='game')renderGame(); else renderMenu(); renderSettings();});
    const contrast=iconButton('◩', state.settings.contrast?'settingToggle active':'settingToggle', 'high contrast', ()=>{state.settings.contrast=!state.settings.contrast; saveSettings(); closeSettings(overlay); if(state.screen==='game')renderGame(); else renderMenu(); renderSettings();});
    card.append(close,sound,motion,contrast);
    if(state.confirmReset){
      const confirm=document.createElement('div'); confirm.className='confirm wide';
      confirm.appendChild(iconButton('✓','','check',()=>{state.best=1; saveBest(); state.confirmReset=false; closeSettings(overlay); if(state.screen==='game')renderGame(); else renderMenu();}));
      confirm.appendChild(iconButton('✕','','X',()=>{state.confirmReset=false; closeSettings(overlay); renderSettings();}));
      card.appendChild(confirm);
    } else card.appendChild(iconButton('🗑','wide','trash',()=>{state.confirmReset=true; closeSettings(overlay); renderSettings();}));
    overlay.appendChild(card); document.body.appendChild(overlay);
  }


  document.addEventListener('keydown', (e)=>{
    const overlay=document.querySelector('.settings');
    if(overlay && e.key==='Escape'){ e.preventDefault(); closeSettings(overlay); }
  });

  document.addEventListener('keydown', (e)=>{
    if(state.screen!=='game' || !state.level) return;
    const k=e.key.toLowerCase(); let moved=false;
    if(k==='arrowup'){state.cursor.r=Math.max(0,state.cursor.r-1); moved=true;}
    if(k==='arrowdown'){state.cursor.r=Math.min(state.level.size-1,state.cursor.r+1); moved=true;}
    if(k==='arrowleft'){state.cursor.c=Math.max(0,state.cursor.c-1); moved=true;}
    if(k==='arrowright'){state.cursor.c=Math.min(state.level.size-1,state.cursor.c+1); moved=true;}
    if(k==='enter'||k===' '){ e.preventDefault(); toggleAt(state.cursor.r,state.cursor.c); return; }
    if(k==='l'){ launch(); return; }
    if(moved){ e.preventDefault(); renderGame(); }
  });

  renderMenu();
})();

</script>
</body>
</html>
